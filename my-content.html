<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#16302B">
<title>محتواي</title>
<!-- تحديث التصميم: المرحلة 3 + مشغّل فيديو داخلي (29 سبتمبر 2026) -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  :root {
    --accent: #D4A93B; --accent-rgb: 212,169,59;
    --c-page: #16302B; --c-card: #F5F1E6; --c-cardalt: #EAEAE4; --c-field: #FFFDF8;
    --c-text: #1B2420; --c-muted: #6B6B60; --c-onpage: #F5F1E6; --c-mutedonpage: #9FB8AD;
    --c-success: #3F6B4A; --c-successbg: #E4EEE5; --c-successsolid: #5E9468;
    --c-danger: #C15B3C; --c-dangertext: #9C4B32; --c-dangerbg: #F6E7E2;
    --c-warnbg: #FBF0DE; --c-warntext: #8A6A1F; --c-warnsolid: #C99A2B;
  }
  @property --p { syntax: '<number>'; inherits: false; initial-value: 0; }
  body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: var(--c-page); color: var(--c-text); min-height: 100vh; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 1.75rem 1.25rem 3rem; }
  h1 { font-family: 'Fraunces', serif; color: var(--c-onpage); font-size: 1.4rem; margin: 0 0 0.3rem; }
  p.sub { color: var(--c-mutedonpage); font-size: 0.88rem; margin: 0 0 1.5rem; }
  .ic { width: 1.15em; height: 1.15em; vertical-align: -0.2em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; pointer-events: none; }
  .card { background: var(--c-card); border-radius: 16px; padding: 1.25rem; margin-bottom: 1rem; box-shadow: 0 8px 24px rgba(0,0,0,0.18); }
  button, .btn-primary { font-family: inherit; background: var(--accent); color: var(--c-text); border: none; border-radius: 10px; padding: 0.5rem 0.9rem; font-weight: 700; font-size: 0.82rem; cursor: pointer; width: auto; }
  .btn-primary { display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem; text-decoration: none; padding: 0.7rem 1.3rem; font-size: 0.9rem; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button:focus-visible, .btn-primary:focus-visible, .redeem-link:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (pointer: coarse) { select, input[type=text] { font-size: 16px; } }
  .link-btn { display: inline-flex; align-items: center; gap: 0.4rem; background: none; box-shadow: none; color: var(--c-mutedonpage); font-weight: 600; font-size: 0.85rem; padding: 0.4rem 0.2rem; margin-bottom: 0.4rem; }
  .redeem-link { display: flex; align-items: center; justify-content: center; gap: 0.45rem; color: var(--c-onpage); margin-top: 0.6rem; font-size: 0.9rem; text-decoration: none; padding: 0.6rem; }
  #errorBox { display: none; align-items: flex-start; gap: 0.5rem; background: var(--c-dangerbg); color: var(--c-dangertext); padding: 0.65rem 0.9rem; border-radius: 10px; font-size: 0.88rem; margin-bottom: 1rem; }
  .loading { display: flex; align-items: center; justify-content: center; gap: 0.6rem; color: var(--c-mutedonpage); padding: 2rem 0; }
  .spinner { width: 1.1rem; height: 1.1rem; border-radius: 50%; border: 2px solid rgba(159,184,173,0.35); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* قائمة المحتوى */
  .product-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.05rem; margin-bottom: 0.45rem; }
  .status-chip { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.76rem; font-weight: 600; padding: 0.2rem 0.65rem; border-radius: 999px; margin-bottom: 0.7rem; background: rgba(0,0,0,0.06); color: var(--c-muted); }
  .status-chip.ok { background: var(--c-successbg); color: var(--c-success); }
  .status-chip.expired { background: var(--c-dangerbg); color: var(--c-dangertext); }
  .item-row { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; padding: 0.65rem 0; border-bottom: 1px solid rgba(0,0,0,0.08); }
  .item-row:last-child { border-bottom: none; }
  .item-title { display: flex; align-items: center; gap: 0.55rem; font-weight: 500; font-size: 0.92rem; }
  .item-title .ic { color: var(--c-muted); }
  .yt-lazy { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; display: grid; place-items: center; text-align: center; color: #fff; padding: 0.75rem; margin-top: 0.5rem; }
  .yt-lazy-btn { width: auto; display: inline-flex; align-items: center; gap: 0.5rem; background: var(--accent, #D4A93B); color: var(--c-onaccent, #1a1a1a); border: none; border-radius: 999px; padding: 0.7rem 1.4rem; font-family: inherit; font-weight: 700; font-size: 0.95rem; cursor: pointer; box-shadow: none; }
  .yt-lazy-btn[disabled] { opacity: 0.7; cursor: default; }
  .yt-lazy-msg { display: block; margin-top: 0.6rem; font-size: 0.8rem; line-height: 1.7; color: #E0A458; }
  .na { display: inline-flex; align-items: center; gap: 0.3rem; color: var(--c-dangertext); font-size: 0.8rem; white-space: nowrap; }
  .score-chip { padding: 0.35rem 0.85rem; border-radius: 999px; font-family: 'Fraunces', serif; background: var(--c-successbg); color: var(--c-success); }
  .score-chip.mid, .tier-chip.mid { background: var(--c-warnbg); color: var(--c-warntext); }
  .score-chip.low, .tier-chip.low { background: var(--c-dangerbg); color: var(--c-dangertext); }
  .mat-video-wrap { position: relative; width: 100%; padding-top: 56.25%; border-radius: 10px; overflow: hidden; margin: 0.5rem 0; }
  .mat-video-wrap iframe { position: absolute; top: 0; right: 0; width: 100%; height: 100%; border: none; }
  /* مشغّل الفيديو الداخلي: بدون أي روابط قابلة للضغط لليوتيوب + ملء الشاشة مع تدوير + إيماءات */
  .yt-player { --yt-fg: #F5F1E6; --yt-muted: #9FB8AD; --yt-accent: var(--accent, var(--c-accent, #D4A93B)); position: relative; margin: 0.5rem 0; background: #000; }
  .yt-stage { position: relative; width: 100%; padding-top: 56.25%; }
  .yt-stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .yt-shield { position: absolute; inset: 0; z-index: 2; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .yt-shield-b { position: absolute; left: 0; right: 0; bottom: 0; height: 22%; z-index: 2; display: none; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  /* قبل أول تشغيل: بنسيب منتصف الفيديو مفتوح عشان أول ضغطة توصل لليوتيوب نفسه (ضغطة حقيقية من المستخدم، بتشتغل على كل الأجهزة حتى الآيفون)، وبنغطي الشريط العلوي والسفلي بس عشان الروابط */
  .yt-player:not(.live):not(.plain) .yt-shield { bottom: auto; height: 22%; }
  .yt-player:not(.live):not(.plain) .yt-shield-b { display: block; }
  .yt-player:not(.ready):not(.plain) .yt-controls { opacity: 0.55; pointer-events: none; }
  .yt-err-code { display: block; margin-top: 0.5rem; font-size: 0.7rem; opacity: 0.65; direction: ltr; }
  .yt-bigplay { position: absolute; inset: 0; z-index: 1; display: none; place-items: center; pointer-events: none; }
  .yt-bigplay span { width: 3.6rem; height: 3.6rem; border-radius: 50%; background: rgba(0,0,0,0.6); color: #fff; display: grid; place-items: center; }
  .yt-bigplay .ic { width: 1.5rem; height: 1.5rem; fill: currentColor; }
  .yt-player:not(.playing):not(.plain):not(.buffering):not(.ended) .yt-bigplay { display: grid; }
  .yt-spinner { position: absolute; top: 50%; left: 50%; width: 2.4rem; height: 2.4rem; margin: -1.2rem 0 0 -1.2rem; z-index: 1; border-radius: 50%; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; animation: ytspin 0.8s linear infinite; display: none; pointer-events: none; }
  .yt-player.buffering .yt-spinner { display: block; }
  @keyframes ytspin { to { transform: rotate(360deg); } }
  .yt-seekfx { position: absolute; top: 0; bottom: 0; width: 36%; z-index: 3; display: grid; place-items: center; color: #fff; background: rgba(255,255,255,0.14); opacity: 0; pointer-events: none; transition: opacity 0.15s ease; }
  .yt-seekfx-l { left: 0; border-radius: 0 60% 60% 0 / 0 50% 50% 0; }
  .yt-seekfx-r { right: 0; border-radius: 60% 0 0 60% / 50% 0 0 50%; }
  .yt-seekfx.show { opacity: 1; }
  .yt-seekfx-in { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; font-size: 0.85rem; font-weight: 700; }
  .yt-seekfx-in .ic { width: 1.7rem; height: 1.7rem; fill: currentColor; }
  .yt-toast { position: absolute; left: 50%; bottom: 0.8rem; transform: translateX(-50%); z-index: 4; display: flex; align-items: center; gap: 0.6rem; background: rgba(0,0,0,0.78); color: #fff; padding: 0.4rem 0.85rem; border-radius: 999px; font-size: 0.8rem; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
  .yt-toast.show { opacity: 1; pointer-events: auto; }
  .yt-toast-btn { width: auto; box-shadow: none; font-family: inherit; cursor: pointer; background: none; color: #fff; border: 1px solid rgba(255,255,255,0.55); border-radius: 999px; padding: 0.15rem 0.65rem; font-size: 0.75rem; font-weight: 600; }
  .yt-end, .yt-err { position: absolute; inset: 0; z-index: 4; display: none; place-items: center; text-align: center; color: #fff; }
  .yt-end { background: rgba(0,0,0,0.88); }
  .yt-err { z-index: 5; background: #000; padding: 1rem; font-size: 0.85rem; line-height: 1.7; }
  .yt-err .ic { width: 1.6rem; height: 1.6rem; display: block; margin: 0 auto 0.4rem; color: #E0A458; }
  .yt-player.ended .yt-end { display: grid; }
  .yt-player.errored .yt-err { display: grid; }
  .yt-replay { width: auto; box-shadow: none; font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.35); border-radius: 999px; padding: 0.6rem 1.1rem; font-size: 0.9rem; font-weight: 700; }
  .yt-controls { display: flex; align-items: center; gap: 0.5rem; padding: 0.35rem 0.6rem; border-radius: 0 0 12px 12px; background: #0F1F1C; color: var(--yt-fg); direction: ltr; transition: opacity 0.25s ease; }
  .yt-controls button { width: auto; box-shadow: none; border: none; font-family: inherit; cursor: pointer; background: none; color: inherit; padding: 0.3rem; min-width: 2.4rem; min-height: 2.4rem; border-radius: 8px; display: grid; place-items: center; font-size: 0.78rem; font-weight: 700; }
  .yt-controls button:hover { background: rgba(255,255,255,0.1); }
  .yt-controls .ic { fill: none; }
  .yt-controls .yt-play .ic { fill: currentColor; }
  .yt-controls .yt-skip, .yt-controls .yt-mute { display: none; }
  @media (pointer: fine) { .yt-controls .yt-skip, .yt-controls .yt-mute { display: grid; } }
  .yt-seek { flex: 1; min-width: 0; accent-color: var(--yt-accent); }
  .yt-time { font-size: 0.75rem; color: var(--yt-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .yt-speedmenu { position: absolute; left: 0.5rem; right: 0.5rem; bottom: 3.4rem; z-index: 6; display: none; flex-wrap: wrap; justify-content: center; gap: 0.3rem; padding: 0.5rem; border-radius: 12px; background: rgba(0,0,0,0.88); direction: ltr; }
  .yt-speedmenu.open { display: flex; }
  .yt-speedmenu button { width: auto; box-shadow: none; font-family: inherit; cursor: pointer; background: none; color: #fff; border: 1px solid rgba(255,255,255,0.28); border-radius: 999px; padding: 0.3rem 0.75rem; font-size: 0.8rem; font-weight: 600; }
  .yt-speedmenu button.on { background: var(--yt-accent); color: #1B2420; border-color: transparent; }
  .yt-player.plain .yt-shield, .yt-player.plain .yt-shield-b, .yt-player.plain .yt-controls, .yt-player.plain .yt-bigplay, .yt-player.plain .yt-seekfx, .yt-player.plain .yt-toast, .yt-player.plain .yt-end, .yt-player.plain .yt-spinner, .yt-player.plain .yt-speedmenu { display: none !important; }
  .yt-help { background: #0F1F1C; color: var(--yt-fg); direction: rtl; border-radius: 0 0 12px 12px; }
  .yt-player:not(.plain) .yt-help { border-radius: 0; }
  .yt-help-btn { width: auto; box-shadow: none; font-family: inherit; cursor: pointer; display: block; margin: 0 auto; background: none; border: none; color: var(--yt-muted); font-size: 0.74rem; font-weight: 600; padding: 0.35rem 0.8rem 0.5rem; text-decoration: underline; text-underline-offset: 2px; }
  .yt-help-panel { display: none; padding: 0.2rem 0.8rem 0.8rem; font-size: 0.8rem; line-height: 1.7; }
  .yt-help-panel.open { display: block; }
  .yt-help-msg { margin: 0 0 0.5rem; color: var(--yt-fg); }
  .yt-help-msg b { color: var(--yt-accent); }
  .yt-help-actions { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.5rem; }
  .yt-help-actions button { width: auto; box-shadow: none; font-family: inherit; cursor: pointer; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.25); border-radius: 999px; padding: 0.3rem 0.8rem; font-size: 0.76rem; font-weight: 600; }
  .yt-help-actions button.on { background: var(--yt-accent); color: #1B2420; border-color: transparent; }
  .yt-report { width: 100%; min-height: 6.5rem; direction: ltr; text-align: left; font-family: monospace; font-size: 0.68rem; line-height: 1.5; background: rgba(0,0,0,0.35); color: #cfe3d8; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; padding: 0.5rem; resize: vertical; }
  .yt-err-try { width: auto; box-shadow: none; font-family: inherit; cursor: pointer; margin-top: 0.6rem; background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.35); border-radius: 999px; padding: 0.35rem 0.9rem; font-size: 0.78rem; font-weight: 600; }
  .yt-player.yt-fs { display: flex; flex-direction: column; border-radius: 0; margin: 0; width: 100%; height: 100%; }
  .yt-player.yt-fs .yt-stage { padding-top: 0; flex: 1; min-height: 0; }
  .yt-player.yt-fs .yt-controls { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0)); padding-bottom: calc(0.35rem + env(safe-area-inset-bottom, 0px)); }
  .yt-player.yt-fs .yt-speedmenu { bottom: calc(3.4rem + env(safe-area-inset-bottom, 0px)); }
  .yt-player.yt-fs .yt-toast { bottom: calc(4.2rem + env(safe-area-inset-bottom, 0px)); }
  .yt-player.yt-fs.hide-controls .yt-controls { opacity: 0; pointer-events: none; }
  .yt-player.yt-fs.hide-controls .yt-speedmenu { display: none; }
  .yt-player.yt-fake { position: fixed; top: 0; left: 0; z-index: 2147483000; transform-origin: 0 0; }
  @media (prefers-reduced-motion: reduce) { .yt-spinner { animation: none; } .yt-seekfx, .yt-toast, .yt-controls { transition: none; } }
  .mat-image { width: 100%; border-radius: 10px; display: block; margin: 0.5rem 0; }
  .mat-pdf-link { display: flex; align-items: center; justify-content: center; gap: 0.5rem; text-align: center; background: var(--c-success); color: var(--c-card) !important; text-decoration: none; padding: 0.7rem; border-radius: 10px; font-weight: 600; font-size: 0.9rem; margin: 0.5rem 0; border: none; width: 100%; cursor: pointer; font-family: inherit; }
  .empty-state { display: flex; flex-direction: column; align-items: center; gap: 0.6rem; text-align: center; padding: 2rem 1.25rem; color: var(--c-muted); }
  .empty-state > .ic { box-sizing: content-box; width: 1.9rem; height: 1.9rem; padding: 0.8rem; stroke-width: 1.5; background: rgba(0,0,0,0.06); border-radius: 50%; }
  .empty-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.05rem; color: var(--c-text); }
  .empty-state p { margin: 0 0 0.6rem; font-size: 0.88rem; line-height: 1.7; }

  /* تجربة الامتحان */
  .exam-bar { position: sticky; top: 0; z-index: 5; background: var(--c-page); padding: 0.5rem 0 0.8rem; margin-bottom: 0.4rem; }
  .exam-title { font-family: 'Fraunces', serif; color: var(--c-onpage); font-size: 1.15rem; margin: 0.2rem 0 0.6rem; }
  .exam-progress-text { display: flex; justify-content: space-between; color: var(--c-mutedonpage); font-size: 0.8rem; margin-bottom: 0.35rem; }
  .exam-progress-track { height: 8px; border-radius: 8px; background: rgba(159,184,173,0.25); overflow: hidden; }
  .exam-progress-fill { height: 100%; width: 0; border-radius: 8px; background: var(--accent); transition: width 0.25s ease; }
  .q-card { border-right: 4px solid transparent; transition: border-color 0.2s ease; }
  .q-card.answered { border-right-color: var(--accent); }
  .q-head { display: flex; align-items: flex-start; gap: 0.65rem; margin-bottom: 0.8rem; }
  .q-num { min-width: 1.9rem; height: 1.9rem; border-radius: 50%; display: grid; place-items: center; font-size: 0.85rem; font-weight: 700; background: rgba(0,0,0,0.07); transition: background 0.2s ease; }
  .q-card.answered .q-num { background: var(--accent); }
  .q-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1rem; line-height: 1.55; margin-top: 0.15rem; unicode-bidi: plaintext; text-align: start; }
  .passage { background: var(--c-cardalt); border-radius: 10px; padding: 0.8rem 1rem; margin-bottom: 0.8rem; font-size: 0.9rem; line-height: 1.7; unicode-bidi: plaintext; text-align: start; }
  .option-row { display: flex; align-items: center; gap: 0.7rem; min-height: 48px; padding: 0.65rem 0.85rem; border: 1px solid rgba(0,0,0,0.12); border-radius: 12px; margin-bottom: 0.5rem; cursor: pointer; background: var(--c-field); transition: border-color 0.15s ease, background 0.15s ease; }
  .option-row input { accent-color: var(--c-success); width: 1.05rem; height: 1.05rem; margin: 0; flex-shrink: 0; }
  .option-row:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
  .option-row.selected { border-color: var(--accent); background: var(--c-warnbg); box-shadow: inset 0 0 0 1px var(--accent); }
  .option-row span { unicode-bidi: plaintext; text-align: start; flex: 1; }
  input[type=text] { width: 100%; padding: 0.7rem 0.85rem; border-radius: 12px; border: 1px solid rgba(0,0,0,0.15); background: var(--c-field); font-size: 0.95rem; font-family: inherit; }
  .submit-hint { display: flex; align-items: center; justify-content: center; gap: 0.4rem; color: var(--c-mutedonpage); font-size: 0.84rem; margin: 0.4rem 0 0.7rem; }
  .submit-hint.pending { color: var(--accent); }
  #submitExamBtn { width: 100%; padding: 0.85rem; font-size: 0.95rem; }

  /* النتيجة */
  .result-card { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; padding: 1.6rem 1.25rem; }
  .score-ring { --tier: var(--c-success); width: 132px; height: 132px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--tier) calc(var(--p) * 1%), rgba(0,0,0,0.08) 0); }
  .score-ring.mid { --tier: var(--c-warnsolid); } .score-ring.low { --tier: var(--c-danger); }
  .score-ring.animate { animation: ringFill 1s ease-out both; }
  @keyframes ringFill { from { --p: 0; } }
  .score-ring-inner { width: 100px; height: 100px; border-radius: 50%; background: var(--c-card); display: grid; place-items: center; }
  .score-pct { font-family: 'Fraunces', serif; font-size: 1.7rem; font-weight: 700; }
  .result-score { font-family: 'Fraunces', serif; font-size: 1.15rem; font-weight: 600; color: var(--c-muted); text-align: center; margin: 0; }
  .tier-chip { font-weight: 600; font-size: 0.86rem; padding: 0.3rem 0.9rem; border-radius: 999px; background: var(--c-successbg); color: var(--c-success); }
  .result-counts { display: flex; gap: 0.6rem; margin-top: 0.3rem; }
  .mini { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.82rem; font-weight: 600; padding: 0.2rem 0.65rem; border-radius: 999px; }
  .mini.ok { background: var(--c-successbg); color: var(--c-success); } .mini.bad { background: var(--c-dangerbg); color: var(--c-dangertext); }
  .review-correct { border-right-color: var(--c-successsolid); }
  .review-wrong { border-right-color: var(--c-danger); }
  .answer-line { display: flex; align-items: flex-start; gap: 0.45rem; font-size: 0.88rem; margin-top: 0.35rem; }
  .answer-line.ok { color: var(--c-success); } .answer-line.bad { color: var(--c-dangertext); }
  .answer-line strong { unicode-bidi: plaintext; }
  @media (prefers-reduced-motion: reduce) { .spinner, .score-ring.animate { animation: none; } .exam-progress-fill { transition: none; } }
</style>

/* ===== تتبّع مدة المشاهدة (بيوصل للمعلم كإحصائيات) ===== */
function trackVideoWatch(box, token) {
  if (!token) return;
  let acc = 0, started = false, startSent = false, last = Date.now();
  const flush = () => {
    const secs = Math.floor(acc);
    if (!secs && !(started && !startSent)) return;
    const body = JSON.stringify({ token, seconds: secs, started: started && !startSent });
    acc -= secs; if (started) startSent = true;
    try { fetch(`${STUDENT_AUTH_WORKER_URL}/video-watch`, { method: "POST", headers: { "Content-Type": "text/plain;charset=UTF-8" }, body, keepalive: true }).catch(() => {}); } catch (e) {}
  };
  const timer = setInterval(() => {
    const now = Date.now(), dt = Math.min((now - last) / 1000, 5); last = now;
    if (!box.isConnected) { flush(); clearInterval(timer); return; }
    if (box._diag && box._diag.state === 1) { acc += dt; if (!started) { started = true; flush(); } }   // state 1 = شغّال
    if (acc >= 60) flush();
  }, 1000);
  document.addEventListener("visibilitychange", () => { if (document.hidden) flush(); });
  window.addEventListener("pagehide", flush);
}

async function loadLazyVideo(lazy) {
  const btn = lazy.querySelector(".yt-lazy-btn"), msg = lazy.querySelector(".yt-lazy-msg");
  const fail = t => { msg.hidden = false; msg.textContent = t; btn.disabled = false; btn.lastChild.textContent = " جرّب تاني"; };
  btn.disabled = true; msg.hidden = true;
  try {
    const idToken = await auth.currentUser.getIdToken();
    const res = await fetch(`${STUDENT_AUTH_WORKER_URL}/content-video?materialId=${encodeURIComponent(lazy.dataset.mid)}`, { headers: { "Authorization": `Bearer ${idToken}` } });
    const data = await res.json().catch(() => ({}));
    if (res.status === 403) return fail("مش مسموحلك تشوف الفيديو ده. الصلاحية ممكن تكون خلصت.");
    if (!res.ok || !data.ok || !data.url) return fail("تعذر تحميل الفيديو. تأكد من النت وحاول تاني.");
    const wrap = document.createElement("div");
    wrap.innerHTML = videoPlayerHtml(data.url);
    const box = wrap.firstElementChild;
    lazy.replaceWith(box);
    ytMount(box, ytVariant(), "");
    trackVideoWatch(box, data.watchToken);
  } catch (e) { fail("تعذر تحميل الفيديو. تأكد من النت وحاول تاني."); }
}
function bindLazyVideos(root) {

}

let ytApiState = "idle", ytQueue = [];
function failYT() { if (ytApiState === "ready") return; ytApiState = "failed"; ytQueue.splice(0).forEach(f => f(false)); }
function ensureYT(cb) {
  if (window.YT && window.YT.Player) return cb(true);
  if (ytApiState === "failed") return cb(false);
  ytQueue.push(cb);
  if (ytApiState === "idle") {
    ytApiState = "loading";
    window.onYouTubeIframeAPIReady = () => { ytApiState = "ready"; ytQueue.splice(0).forEach(f => f(true)); };
    const t = document.createElement("script");
    t.src = "https://www.youtube.com/iframe_api";
    t.onerror = failYT;
    document.head.appendChild(t);
    setTimeout(() => { if (ytApiState !== "ready") failYT(); }, 8000);
  }
}

let ytFrameSeq = 0;
/* طرق التشغيل: 0 = المطوّر (أزرارنا) ، 1 = مشغّل يوتيوب العادي ، 2 = العادي من youtube.com (لو الدومين التاني متحجب) */
function ytVariant() {
  const raw = String(ytStore("ytvariant") || "");
  const [v, t] = raw.split("@");
  const n = parseInt(v, 10), ts = parseInt(t, 10) || 0;
  if (![0, 1, 2].includes(n)) return 0;
  if (ts && Date.now() - ts > 24 * 3600 * 1000) return 0;   // التحويل التلقائي بيخلص بعد 24 ساعة ونجرّب المطوّر تاني
  return n;
}
function ytFrameHtml(id, fid, variant) {
  const origin = encodeURIComponent(location.origin);
  const host = variant === 2 ? "www.youtube.com" : "www.youtube-nocookie.com";
  const q = variant === 0
    ? "enablejsapi=1&controls=0&disablekb=1&fs=0&rel=0&modestbranding=1&iv_load_policy=3&playsinline=1&origin=" + origin
    : "enablejsapi=1&rel=0&modestbranding=1&playsinline=1&origin=" + origin;
  const allow = variant === 0 ? "autoplay; encrypted-media" : "autoplay; encrypted-media; picture-in-picture; fullscreen";
  return `<iframe id="${fid}" src="https://${host}/embed/${id}?${q}" allow="${allow}" referrerpolicy="strict-origin-when-cross-origin"${variant === 0 ? "" : " allowfullscreen"}></iframe>`;
}
function ytInAppName() {
  const ua = navigator.userAgent || "";
  const m = /(FBAN|FBAV|FB_IAB|Instagram|Messenger|Line\/|MicroMessenger|Snapchat|TikTok|BytedanceWebview|Twitter|WhatsApp|GSA\/)/i.exec(ua);
  if (m) return m[1];
  if (/; wv\)/.test(ua) || (/iPhone|iPad|iPod/.test(ua) && !/Safari\//.test(ua))) return "WebView";
  return "";
}
async function ytProbe(id) {
  const ctrl = new AbortController(), tm = setTimeout(() => ctrl.abort(), 6000);
  try {
    const r = await fetch("https://www.youtube.com/oembed?format=json&url=" + encodeURIComponent("https://www.youtube.com/watch?v=" + id), { signal: ctrl.signal });
    if (r.ok) return { ok: true, text: "متاح ومسموح بتضمينه" };
    if (r.status === 401) return { ok: false, text: "صاحب الفيديو مقفّل التضمين (Allow embedding)" };
    if (r.status === 403 || r.status === 404) return { ok: false, text: "الفيديو خاص أو اتحذف" };
    return { ok: null, text: "رد غير متوقع من يوتيوب (" + r.status + ")" };
  } catch (e) {
    return { ok: null, text: "مقدرتش أفحصه من المتصفح (" + (e.name === "AbortError" ? "انتهت المهلة" : "الشبكة أو CORS") + ")" };
  } finally { clearTimeout(tm); }
}
const YT_VARIANT_NAMES = ["المطوّر", "يوتيوب العادي (nocookie)", "يوتيوب العادي (youtube.com)"];
function ytReport(box, probeText) {

function initVideoPlayers(root) {

}

    ensureYT(ok => {

function renderItemRow(it, isExpired) {

    const typeIcon = it.mediaType === "video" ? "video" : it.mediaType === "image" ? "image" : "file";

    if (isExpired || it.unavailable || !hasContent) return unavailable(typeIcon, it.title);
    let bodyHtml = "";
    if (it.mediaType === "video") bodyHtml = it.url ? videoPlayerHtml(it.url) : `<div class="yt-lazy" data-mid="${escapeHtml(it.id)}"><div><button type="button" class="yt-lazy-btn">${icon("play")} تشغيل الفيديو</button><span class="yt-lazy-msg" hidden></span></div></div>`;
    else if (it.mediaType === "image") bodyHtml = `<img class="mat-image" src="${escapeHtml(it.url)}" alt="${escapeHtml(it.title)}">`;
    else if (it.mediaType === "pdf") bodyHtml = `<button type="button" class="mat-pdf-link" data-pdf-id="${escapeHtml(it.id)}">${icon("file")} افتح ملف الـPDF</button>`;
    return `<div><div class="item-row"><span class="item-title">${icon(typeIcon)} ${escapeHtml(it.title)}</span></div>${bodyHtml}</div>`;
  }
  if (it.type === "exam") {
    if (isExpired) return unavailable("clipboard", it.title);
    const pct = it.total > 0 ? Math.round((it.score / it.total) * 100) : 0;
    const actionHtml = it.submitted
      ? `<button class="score-chip ${tierOf(pct)}" data-exam-open="${escapeHtml(String(it.id))}">${it.score}/${it.total}</button>`
      : `<button data-exam-open="${escapeHtml(String(it.id))}">ابدأ الامتحان</button>`;
    return `<div class="item-row"><span class="item-title">${icon("clipboard")} ${escapeHtml(it.title)}</span>${actionHtml}</div>`;
  }
  return "";
}

async function openExam(examId, isFreshSubmission) {
  const content = document.getElementById("content");
  content.innerHTML = `<div class="loading"><span class="spinner"></span>جاري تحميل الامتحان...</div>`;
  clearError();
  try {
    const idToken = await auth.currentUser.getIdToken();
    const res = await fetch(`${STUDENT_AUTH_WORKER_URL}/voucher-exam?examId=${encodeURIComponent(examId)}`, {
      headers: { "Authorization": `Bearer ${idToken}` }
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) throw new Error(data.error || "load_failed");
    if (data.alreadySubmitted) {
      renderExamReview(data, !!isFreshSubmission);
      return;
    }
    currentExam = { examId, title: data.title, questions: data.questions };
    currentAnswers = {};
    renderExamForm();
  } catch (err) {
    showError("تعذر تحميل الامتحان. حاول تاني.");
    renderAccessList();
  }
}

function isAnswered(i) {
  const v = currentAnswers[i];
  return typeof v === "number" || (typeof v === "string" && v.trim() !== "");
}
function updateExamProgress() {
  const total = currentExam.questions.length;
  let answered = 0;
  currentExam.questions.forEach((q, i) => {
    const ok = isAnswered(i);
    if (ok) answered++;
    const card = document.getElementById("qcard_" + i);
    if (card) card.classList.toggle("answered", ok);
  });
  const left = total - answered;
  document.getElementById("examProgressText").innerHTML = `<span>أجبت على ${answered} من ${total}</span><span>${total ? Math.round((answered / total) * 100) : 0}%</span>`;
  document.getElementById("examProgressFill").style.width = (total ? (answered / total) * 100 : 0) + "%";
  const hint = document.getElementById("submitHint");
  hint.className = "submit-hint" + (left > 0 ? " pending" : "");
  hint.innerHTML = left > 0 ? `${icon("alert")} لسه ${left} ${left === 1 ? "سؤال" : "أسئلة"} من غير إجابة` : `${icon("check-circle")} جاوبت على كل الأسئلة، تقدر تسلّم`;
}

function renderExamForm() {
  const content = document.getElementById("content");
  const backBtn = `<button class="link-btn" id="backBtn">${icon("arrow-right")} رجوع لمحتواي</button>`;
  const questionsHtml = currentExam.questions.map((q, i) => {
    const passageHtml = q.passage ? `<div class="passage">${escapeHtml(q.passage)}</div>` : "";
    let bodyHtml = "";
    if (q.type === "mcq" || q.type === "translation_mcq") {
      bodyHtml = (q.options || []).map((opt, oi) => `
        <div class="option-row${currentAnswers[i] === oi ? " selected" : ""}" data-q="${i}" data-opt="${oi}">
          <input type="radio" name="q_${i}" ${currentAnswers[i] === oi ? "checked" : ""}>
          <span>${escapeHtml(opt)}</span>
        </div>`).join("");
    } else {
      bodyHtml = `<input type="text" data-q-text="${i}" value="${escapeHtml(currentAnswers[i] || "")}" placeholder="اكتب إجابتك هنا">`;
    }
    return `<div class="card q-card" id="qcard_${i}">
      <div class="q-head"><span class="q-num">${i + 1}</span><div class="q-title">${escapeHtml(q.prompt)}</div></div>
      ${passageHtml}${bodyHtml}
    </div>`;
  }).join("");

  content.innerHTML = `${backBtn}
    <div class="exam-bar">
      <h2 class="exam-title">${escapeHtml(currentExam.title)}</h2>
      <div class="exam-progress-text" id="examProgressText"></div>
      <div class="exam-progress-track"><div class="exam-progress-fill" id="examProgressFill"></div></div>
    </div>
    ${questionsHtml}
    <div class="submit-hint" id="submitHint"></div>
    <button id="submitExamBtn">تسليم الإجابات</button>`;

  document.getElementById("backBtn").addEventListener("click", renderAccessList);
  content.querySelectorAll(".option-row").forEach(row => {
    row.addEventListener("click", () => {
      const qi = Number(row.dataset.q);
      const oi = Number(row.dataset.opt);
      currentAnswers[qi] = oi;
      row.parentElement.querySelectorAll(".option-row").forEach(r => {
        const on = r === row;
        r.classList.toggle("selected", on);
        r.querySelector("input").checked = on;
      });
      updateExamProgress();
    });
  });
  content.querySelectorAll("[data-q-text]").forEach(input => {
    input.addEventListener("input", () => {
      currentAnswers[Number(input.dataset.qText)] = input.value;
      updateExamProgress();
    });
  });
  document.getElementById("submitExamBtn").addEventListener("click", submitCurrentExam);
  updateExamProgress();
}

async function submitCurrentExam() {
  const btn = document.getElementById("submitExamBtn");
  btn.disabled = true;
  btn.textContent = "جاري التسليم...";
  const answers = currentExam.questions.map((q, i) => ({ questionIndex: i, given: currentAnswers[i] ?? null }));
  try {
    const idToken = await auth.currentUser.getIdToken();
    const res = await fetch(`${STUDENT_AUTH_WORKER_URL}/voucher-submit-result`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${idToken}` },
      body: JSON.stringify({ examId: currentExam.examId, answers }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) throw new Error("submit_failed");
    openExam(currentExam.examId, true);
  } catch (err) {
    showError("تعذر تسليم الإجابات. حاول تاني.");
    btn.disabled = false;
    btn.textContent = "تسليم الإجابات";
  }
}

// ============ صوت ظهور النتيجة (Web Audio API — بدون ملفات خارجية) ============
let examAudioCtx = null;
function getExamAudioCtx() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!examAudioCtx) examAudioCtx = new AC();
  if (examAudioCtx.state === "suspended") examAudioCtx.resume();
  return examAudioCtx;
}
function playExamResultSound() {
  const ctx = getExamAudioCtx();
  if (!ctx) return;
  [
    { freq: 659.25, start: 0, duration: 0.12 },
    { freq: 783.99, start: 0.12, duration: 0.12 },
    { freq: 987.77, start: 0.24, duration: 0.24 },
  ].forEach(n => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = n.freq;
    const startAt = ctx.currentTime + n.start;
    gain.gain.setValueAtTime(0.0001, startAt);
    gain.gain.exponentialRampToValueAtTime(0.22, startAt + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, startAt + n.duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(startAt);
    osc.stop(startAt + n.duration + 0.02);
  });
}

function renderExamReview(data, isFreshSubmission) {
  if (isFreshSubmission) playExamResultSound();
  const backBtn = `<button class="link-btn" id="backBtn">${icon("arrow-right")} رجوع لمحتواي</button>`;
  const questions = data.questions || [];
  const answers = data.answers || [];
  const itemsHtml = questions.map((q, i) => {
    const ad = answers.find(a => a.questionIndex === i) || {};
    let givenText = "", correctText = "";
    if (q.type === "mcq" || q.type === "translation_mcq") {
      const opts = q.options || [];
      givenText = (typeof ad.given === "number" && opts[ad.given] !== undefined) ? opts[ad.given] : "(لم يُجب)";
      correctText = opts[q.correctIndex] !== undefined ? opts[q.correctIndex] : "";
    } else {
      givenText = ad.given || "(لم يُجب)";
      correctText = (q.correctAnswers && q.correctAnswers[0]) || "";
    }
    return `<div class="card q-card ${ad.correct ? 'review-correct' : 'review-wrong'}">
      <div class="q-head"><span class="q-num">${i + 1}</span><div class="q-title">${escapeHtml(q.prompt)}</div></div>
      <div class="answer-line ${ad.correct ? 'ok' : 'bad'}">${icon(ad.correct ? "check-circle" : "x-circle")}<span>إجابتك: <strong>${escapeHtml(givenText)}</strong></span></div>
      ${!ad.correct ? `<div class="answer-line ok">${icon("check-circle")}<span>الإجابة الصحيحة: <strong>${escapeHtml(correctText)}</strong></span></div>` : ""}
    </div>`;
  }).join("");

  const total = Number(data.total) || questions.length || 0;
  const score = Number(data.score) || 0;
  const pct = total > 0 ? Math.round((score / total) * 100) : 0;
  const tier = tierOf(pct);
  const tierText = { high: "ممتاز، كمّل كده", mid: "كويس، راجع الأخطاء تحت", low: "محتاج مراجعة، راجع الأخطاء تحت" }[tier];

  document.getElementById("content").innerHTML = `${backBtn}
    <div class="card result-card">
      <div class="score-ring ${tier}${isFreshSubmission ? " animate" : ""}" style="--p:${pct}"><div class="score-ring-inner"><span class="score-pct">${pct}%</span></div></div>
      <div class="result-score">${score} / ${total}</div>
      <div class="tier-chip ${tier}">${tierText}</div>
      <div class="result-counts">
        <span class="mini ok">${icon("check-circle")} ${score} صح</span>
        <span class="mini bad">${icon("x-circle")} ${Math.max(0, total - score)} غلط</span>
      </div>
    </div>
    ${itemsHtml}`;
  document.getElementById("backBtn").addEventListener("click", renderAccessList);
}

auth.onAuthStateChanged(user => {
  if (user) loadMyAccess();
  else window.location.href = "redeem.html";
});
</script>
