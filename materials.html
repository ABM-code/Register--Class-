<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#16302B">
<title>المكتبة التعليمية</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --accent: #D4A93B; --accent-rgb: 212,169,59;
    --c-page: #16302B; --c-card: #F5F1E6; --c-cardalt: #EAEAE4; --c-field: #FFFDF8; --c-soft: #EFF5F0;
    --c-text: #1B2420; --c-muted: #6B6B60; --c-onpage: #F5F1E6; --c-mutedonpage: #9FB8AD;
    --c-success: #3F6B4A; --c-successbg: #E4EEE5; --c-successsolid: #5E9468;
    --c-danger: #C15B3C; --c-dangertext: #9C4B32; --c-dangerbg: #F6E7E2;
    --c-warnbg: #FBF0DE; --c-warntext: #8A6A1F; --c-warnsolid: #C99A2B;
  }
  @property --p { syntax: '<number>'; inherits: false; initial-value: 0; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: var(--c-page); color: var(--c-text); min-height: 100vh; }
  h1 { font-family: 'Fraunces', serif; color: var(--c-onpage); font-size: 1.4rem; margin: 0 0 0.3rem; }
  p.sub { color: var(--c-mutedonpage); font-size: 0.88rem; margin: 0 0 1.5rem; }
  .ic { width: 1.15em; height: 1.15em; vertical-align: -0.2em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; pointer-events: none; }
  .card { background: var(--c-card); border-radius: 16px; padding: 1.25rem; margin-bottom: 1rem; box-shadow: 0 8px 24px rgba(0,0,0,0.18); }
  label { display: block; font-size: 0.82rem; color: var(--c-muted); margin-bottom: 0.4rem; font-weight: 500; }
  select, input[type=text], input[type=email], input[type=password], textarea { width: 100%; padding: 0.65rem 0.8rem; border-radius: 10px; border: 1px solid rgba(0,0,0,0.15); background: var(--c-field); font-size: 0.95rem; color: var(--c-text); font-family: inherit; transition: border-color 0.15s ease, box-shadow 0.15s ease; }
  select:focus, input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),0.18); }
  button, .btn-primary { font-family: inherit; background: var(--accent); color: var(--c-text); border: none; border-radius: 12px; padding: 0.75rem 1.2rem; font-weight: 700; font-size: 0.95rem; cursor: pointer; width: 100%; transition: filter 0.15s ease, transform 0.08s ease; box-shadow: 0 3px 10px rgba(var(--accent-rgb),0.3); }
  .btn-primary { display: flex; align-items: center; justify-content: center; gap: 0.45rem; text-decoration: none; }
  button:hover:not(:disabled), .btn-primary:hover { filter: brightness(1.05); }
  button:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
  button:active:not(:disabled) { transform: scale(0.98); }
  button:focus-visible, .btn-primary:focus-visible, .page-link:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-green { background: var(--c-success); color: var(--c-card); box-shadow: none; }
  .link-btn { display: flex; align-items: center; justify-content: center; gap: 0.4rem; background: none; box-shadow: none; color: var(--c-mutedonpage); font-weight: 600; font-size: 0.85rem; padding: 0.5rem; }
  .page-link { display: flex; align-items: center; justify-content: center; gap: 0.45rem; color: var(--c-onpage); font-size: 0.9rem; text-decoration: none; padding: 0.6rem; margin-top: 0.4rem; }
  #errorBox { display: none; align-items: flex-start; gap: 0.5rem; background: var(--c-dangerbg); color: var(--c-dangertext); padding: 0.65rem 0.9rem; border-radius: 10px; font-size: 0.88rem; margin-bottom: 1rem; }
  .empty-state { display: flex; flex-direction: column; align-items: center; gap: 0.6rem; text-align: center; padding: 2rem 1.25rem; color: var(--c-muted); }
  .empty-state > .ic { box-sizing: content-box; width: 1.9rem; height: 1.9rem; padding: 0.8rem; stroke-width: 1.5; background: rgba(0,0,0,0.06); border-radius: 50%; }
  .empty-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.05rem; color: var(--c-text); }
  .empty-state p { margin: 0 0 0.4rem; font-size: 0.88rem; line-height: 1.7; }
  .spinner { width: 1.1rem; height: 1.1rem; border-radius: 50%; border: 2px solid rgba(159,184,173,0.35); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading { display: flex; align-items: center; justify-content: center; gap: 0.6rem; color: var(--c-mutedonpage); padding: 2rem 0; }
  .student-suggestions { margin-top: 0.4rem; border-radius: 10px; overflow: hidden; display: none; box-shadow: 0 4px 14px rgba(0,0,0,0.12); }
  .student-suggestion-item { display: block; width: 100%; text-align: right; background: var(--c-field); color: var(--c-text); border: 1px solid rgba(0,0,0,0.12); border-top: none; padding: 0.7rem 0.8rem; font-size: 0.92rem; font-weight: 500; cursor: pointer; border-radius: 0; box-shadow: none; transition: background 0.12s ease; }
  .student-suggestion-item:first-child { border-top: 1px solid rgba(0,0,0,0.12); border-radius: 10px 10px 0 0; }
  .student-suggestion-item:last-child { border-radius: 0 0 10px 10px; }
  .student-suggestion-item:hover, .student-suggestion-item:active { background: var(--c-warnbg); filter: none; }
  .student-suggestion-empty { padding: 0.65rem 0.8rem; font-size: 0.85rem; color: var(--c-dangertext); background: var(--c-dangerbg); border-radius: 10px; }
  @media (pointer: coarse) { select, input[type=text], input[type=email], input[type=password], textarea { font-size: 16px; } }
  @media (prefers-reduced-motion: reduce) { .spinner, .score-ring.animate { animation: none; } .exam-progress-fill { transition: none; } }
  .wrap { max-width: 480px; margin: 0 auto; padding: 1.75rem 1.25rem 3rem; }
  .card select, .card input { margin-bottom: 0.2rem; }
  .category-pills { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; }
  .category-pill { width: auto; box-shadow: none; background: rgba(245,241,230,0.12); color: var(--c-onpage); border: 1px solid rgba(245,241,230,0.25); border-radius: 999px; padding: 0.4rem 0.9rem; font-size: 0.82rem; font-weight: 500; }
  .category-pill:hover:not(:disabled) { background: rgba(245,241,230,0.2); filter: none; }
  .category-pill.active { background: var(--accent); color: var(--c-text); border-color: var(--accent); font-weight: 700; }
  .banner { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; text-align: center; padding: 0.7rem; margin-bottom: 0.8rem; font-weight: 600; font-size: 0.85rem; }
  .banner .banner-line { display: inline-flex; align-items: center; gap: 0.45rem; }
  .banner.ok { color: var(--c-success); } .banner.lock { color: var(--c-dangertext); }
  .banner p { margin: 0; font-size: 0.78rem; font-weight: 400; color: var(--c-muted); }
  .mat-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1rem; margin-bottom: 0.3rem; }
  .mat-category { font-size: 0.78rem; color: var(--c-muted); margin-bottom: 0.7rem; }
  /* مشغّل الفيديو الداخلي: بدون أي روابط قابلة للضغط لليوتيوب */
  .yt-player { margin: 0.5rem 0; border-radius: 12px; overflow: hidden; background: #000; }
  .yt-stage { position: relative; width: 100%; padding-top: 56.25%; }
  .yt-stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .yt-shield { position: absolute; inset: 0; z-index: 2; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .yt-bigplay { position: absolute; inset: 0; z-index: 1; display: none; place-items: center; pointer-events: none; }
  .yt-bigplay span { width: 3.6rem; height: 3.6rem; border-radius: 50%; background: rgba(0,0,0,0.6); color: #fff; display: grid; place-items: center; }
  .yt-bigplay .ic { width: 1.5rem; height: 1.5rem; fill: currentColor; }
  .yt-player:not(.playing):not(.plain) .yt-bigplay { display: grid; }
  .yt-controls { display: flex; align-items: center; gap: 0.5rem; padding: 0.35rem 0.6rem; background: #0F1F1C; color: var(--c-card); direction: ltr; }
  .yt-controls button { width: auto; box-shadow: none; background: none; color: inherit; padding: 0.3rem; min-width: 2.4rem; min-height: 2.4rem; border-radius: 8px; display: grid; place-items: center; font-size: 0.78rem; font-weight: 700; }
  .yt-controls button:hover { background: rgba(255,255,255,0.1); }
  .yt-controls .ic { fill: none; }
  .yt-controls .yt-play .ic { fill: currentColor; }
  .yt-seek { flex: 1; min-width: 0; accent-color: var(--accent); }
  .yt-time { font-size: 0.75rem; color: var(--c-mutedonpage); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .yt-player.plain .yt-shield, .yt-player.plain .yt-controls, .yt-player.plain .yt-bigplay { display: none; }
  .yt-player:fullscreen { display: flex; flex-direction: column; border-radius: 0; }
  .yt-player:fullscreen .yt-stage { padding-top: 0; flex: 1; }
  .yt-player:-webkit-full-screen { display: flex; flex-direction: column; border-radius: 0; }
  .yt-player:-webkit-full-screen .yt-stage { padding-top: 0; flex: 1; }
  @media (pointer: coarse) { select, input[type=text] { font-size: 16px; } }
  .mat-image { width: 100%; border-radius: 10px; display: block; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
  .mat-pdf-link { display: flex; align-items: center; justify-content: center; gap: 0.5rem; background: var(--c-success); color: var(--c-card) !important; text-decoration: none; padding: 0.75rem; border-radius: 10px; font-weight: 600; font-size: 0.9rem; border: none; width: 100%; cursor: pointer; font-family: inherit; box-shadow: none; }
  .mat-pdf-link:hover { filter: brightness(1.1); }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true"><symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></symbol><symbol id="i-pause" viewBox="0 0 24 24"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></symbol><symbol id="i-maximize" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></symbol><symbol id="i-ticket" viewBox="0 0 24 24"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></symbol><symbol id="i-check-circle" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></symbol><symbol id="i-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol><symbol id="i-file" viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></symbol><symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol><symbol id="i-inbox" viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol></svg>
<div class="wrap">
  <h1 id="pageTitle">المكتبة التعليمية</h1>
  <p class="sub" id="pageSub">اختر مرحلتك وادخل عشان تشوف المحتوى</p>
  <div id="errorBox"></div>
  <div id="content"></div>
  <p id="brandFooterText" style="text-align:center; color:var(--c-mutedonpage); font-size:0.75rem; opacity:0.8; margin:2rem 0 0; display:none;"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
const TEACHER_NAME = "أ/ عبد الرحمن منير";
// إعدادات هوية المعلم — حدّثها يدويًا كل ما تغيّرها من لوحة "الهوية" في التطبيق الرئيسي
// إعدادات هوية المعلم — دي قيم افتراضية احتياطية (fallback) لو الـ Worker مرجعش هوية،
// وبتتحدّث تلقائيًا من رد /materials-students (حقل teacherBrand) لو موجود.
let TEACHER_CENTER_NAME = "";
let TEACHER_BRAND_COLOR = "#D4A93B";
let TEACHER_FOOTER_TEXT = "";
let TEACHER_DISPLAY_LINE = TEACHER_CENTER_NAME ? (TEACHER_CENTER_NAME + " — " + TEACHER_NAME) : TEACHER_NAME;

function hexToRgbTriplet(hex) {
  const c = (hex || "").replace("#", "");
  if (c.length !== 6) return "212,169,59";
  const r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
  return `${r},${g},${b}`;
}
function applyBrandColor(color) {
  if (!color) return;
  document.documentElement.style.setProperty("--accent", color);
  document.documentElement.style.setProperty("--accent-rgb", hexToRgbTriplet(color));
}
applyBrandColor(TEACHER_BRAND_COLOR);
function renderBrandFooter() {
  const el = document.getElementById("brandFooterText");
  if (!el) return;
  if (TEACHER_FOOTER_TEXT) { el.textContent = TEACHER_FOOTER_TEXT; el.style.display = "block"; }
  else { el.style.display = "none"; }
}
renderBrandFooter();

// بتاخد حقل teacherBrand من رد الـ Worker (لو موجود) وتستبدل بيه القيم الاحتياطية،
// بعدين تعيد تطبيق اللون والفوتر. لو teacherBrand مش موجود أو فاضي، بتسيب القيم الاحتياطية زي ما هي.
function applyTeacherBrandFromServer(brand) {
  if (!brand) return;
  if (brand.centerName) TEACHER_CENTER_NAME = brand.centerName;
  if (brand.brandColor) TEACHER_BRAND_COLOR = brand.brandColor;
  if (brand.footerText) TEACHER_FOOTER_TEXT = brand.footerText;
  TEACHER_DISPLAY_LINE = TEACHER_CENTER_NAME ? (TEACHER_CENTER_NAME + " — " + TEACHER_NAME) : TEACHER_NAME;
  applyBrandColor(TEACHER_BRAND_COLOR);
  renderBrandFooter();
}

const STUDENT_AUTH_WORKER_URL = "https://register-class-auth.abm319.workers.dev";
const firebaseConfig = {
  apiKey: "AIzaSyBcWhyLvCSnpyLSLWw9rHVSvODYgK67Wh0",
  authDomain: "register-class-302e6.firebaseapp.com",
  projectId: "register-class-302e6",
  storageBucket: "register-class-302e6.firebasestorage.app",
  messagingSenderId: "230991294181",
  appId: "1:230991294181:web:167cb0a370c68b6a6f6e0c"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

const STAGES = ["Prep 1", "Prep 2", "Prep 3", "Sec 1", "Sec 2", "Sec 3"];

function icon(name) { return '<svg class="ic" aria-hidden="true"><use href="#i-' + name + '"/></svg>'; }
function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function normalizeArabic(str) {
  if (!str) return "";
  return String(str)
    .replace(/[إأآا]/g, "ا")
    .replace(/ى/g, "ي")
    .replace(/ة/g, "ه")
    .replace(/\s+/g, "")
    .toLowerCase();
}
function icon(name) { return '<svg class="ic" aria-hidden="true"><use href="#i-' + name + '"/></svg>'; }
function showError(msg) {
  const box = document.getElementById("errorBox");
  box.innerHTML = icon("alert") + "<span></span>";
  box.lastChild.textContent = msg;
  box.style.display = "flex";
}
function clearError() {
  document.getElementById("errorBox").style.display = "none";
}

let selectedStage = "";
let studentsInStage = [];
let selectedStudent = null;
let studentClaims = null;
let allMaterials = [];
let activeCategory = "الكل";
let lockedCount = 0;
let isSubscribed = false;
let subscriptionExpiry = null;

function init() {
  renderStagePicker();
}

function renderStagePicker() {
  const content = document.getElementById("content");
  content.innerHTML = `
    <div class="card">
      <label>اختر مرحلتك</label>
      <select id="stageSelect">
        <option value="">— اختر المرحلة —</option>
        ${STAGES.map(s => `<option value="${s}">${s}</option>`).join("")}
      </select>
    </div>
    <button id="stageNextBtn" disabled>التالي</button>
    <a href="redeem.html" class="page-link">${icon("ticket")} عندك كود شراء محتوى؟ فعّله من هنا</a>
  `;
  const select = document.getElementById("stageSelect");
  const nextBtn = document.getElementById("stageNextBtn");
  select.addEventListener("change", () => {
    nextBtn.disabled = !select.value;
  });
  nextBtn.addEventListener("click", async () => {
    clearError();
    selectedStage = select.value;
    if (!selectedStage) return;
    nextBtn.disabled = true;
    nextBtn.textContent = "جاري التحميل...";
    try {
      const res = await fetch(`${STUDENT_AUTH_WORKER_URL}/materials-students?stage=${encodeURIComponent(selectedStage)}`);
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) throw new Error("load_failed");
      applyTeacherBrandFromServer(data.teacherBrand);
      studentsInStage = (data.students || []).sort((a,b) => (a.name||"").localeCompare(b.name||""));
      renderStudentPicker();
    } catch (err) {
      nextBtn.disabled = false;
      nextBtn.textContent = "التالي";
      showError("تعذر تحميل بيانات المرحلة. تأكد من اتصالك بالإنترنت وحاول تاني.");
    }
  });
}

function renderStudentPicker() {
  document.getElementById("pageSub").textContent = selectedStage + " — " + TEACHER_DISPLAY_LINE;
  const content = document.getElementById("content");
  content.innerHTML = `
    <div class="card">
      <label>اكتب اسمك للبحث</label>
      <input type="text" id="studentSearchInput" placeholder="اكتب أول كام حرف من اسمك" autocomplete="off">
      <div class="student-suggestions" id="studentSuggestions"></div>
    </div>
    <div class="card" id="pinCard" style="display:none;">
      <label>اكتب الرمز السري بتاعك (4 أرقام)</label>
      <input type="text" id="pinInput" placeholder="4 أرقام" maxlength="4" inputmode="numeric">
      <p id="pinMsg" style="font-size:0.82rem; margin:0.5rem 0 0; display:none;"></p>
    </div>
    <button id="enterBtn" disabled>ادخل المكتبة</button>
    <a href="redeem.html" class="page-link">${icon("ticket")} مش لاقي اسمك؟ لو معاك كود شراء فعّله من هنا</a>
  `;
  const searchInput = document.getElementById("studentSearchInput");
  const suggestionsBox = document.getElementById("studentSuggestions");
  const pinCard = document.getElementById("pinCard");
  const pinInput = document.getElementById("pinInput");
  const pinMsg = document.getElementById("pinMsg");
  const enterBtn = document.getElementById("enterBtn");

  function hideSuggestions() {
    suggestionsBox.style.display = "none";
    suggestionsBox.innerHTML = "";
  }

  function resetPin() {
    pinCard.style.display = "none";
    pinInput.value = "";
    pinMsg.style.display = "none";
    enterBtn.disabled = true;
  }

  searchInput.addEventListener("input", () => {
    if (selectedStudent) { selectedStudent = null; resetPin(); }
    const q = searchInput.value.trim();
    if (q.length < 2) { hideSuggestions(); return; }
    const normQ = normalizeArabic(q.toLowerCase());
    const matches = studentsInStage.filter(s => normalizeArabic((s.name || "").toLowerCase()).includes(normQ)).slice(0, 6);
    if (matches.length === 0) {
      suggestionsBox.innerHTML = `<div class="student-suggestion-empty">مفيش اسم متطابق. تأكد من كتابة اسمك صح.</div>`;
      suggestionsBox.style.display = "block";
      return;
    }
    suggestionsBox.innerHTML = matches.map(s => `<button type="button" class="student-suggestion-item" data-id="${s.id}">${escapeHtml(s.name)}</button>`).join("");
    suggestionsBox.style.display = "block";
    suggestionsBox.querySelectorAll(".student-suggestion-item").forEach(btn => {
      btn.addEventListener("click", () => {
        selectedStudent = studentsInStage.find(s => s.id === btn.dataset.id) || null;
        searchInput.value = selectedStudent ? selectedStudent.name : "";
        hideSuggestions();
        resetPin();
        if (selectedStudent) {
          pinCard.style.display = "block";
          pinInput.focus();
        }
      });
    });
  });

  pinInput.addEventListener("input", () => {
    const typed = pinInput.value.replace(/\D/g, "");
    pinInput.value = typed;
    pinMsg.style.display = "none";
    enterBtn.disabled = typed.length !== 4 || !selectedStudent;
  });

  enterBtn.addEventListener("click", async () => {
    if (!selectedStudent) return;
    enterBtn.disabled = true;
    enterBtn.textContent = "جاري التحقق...";
    try {
      const res = await fetch(`${STUDENT_AUTH_WORKER_URL}/materials-login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ studentId: selectedStudent.id, pin: pinInput.value })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok || !data.customToken) {
        const err = new Error(data.error || "invalid_pin");
        err.remainingMin = data.remainingMin;
        throw err;
      }
      await auth.signInWithCustomToken(data.customToken);
      const idTokenResult = await auth.currentUser.getIdTokenResult();
      studentClaims = idTokenResult.claims;
      await loadMaterials();
    } catch (err) {
      pinMsg.textContent = err.message === "locked"
        ? `تم قفل الدخول مؤقتًا بسبب محاولات كتيرة غلط. حاول تاني بعد ${err.remainingMin || 5} دقايق.`
        : (err.message === "invalid_pin" ? "الرمز غير صحيح." : "تعذر التحقق. حاول تاني.");
      pinMsg.style.color = "var(--c-danger)";
      pinMsg.style.display = "block";
      enterBtn.disabled = false;
      enterBtn.textContent = "ادخل المكتبة";
    }
  });
}

async function loadMaterials() {
  const content = document.getElementById("content");
  content.innerHTML = `<div class="loading"><span class="spinner"></span>جاري تحميل المحتوى...</div>`;
  try {
    const idToken = await auth.currentUser.getIdToken();
    const res = await fetch(`${STUDENT_AUTH_WORKER_URL}/materials-list`, {
      headers: { "Authorization": `Bearer ${idToken}` }
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) throw new Error("load_failed");
    allMaterials = data.materials || [];
    lockedCount = data.lockedCount || 0;
    isSubscribed = !!data.isSubscribed;
    subscriptionExpiry = data.subscriptionExpiry || null;
    allMaterials.sort((a, b) => {
      const at = a.createdAt ? new Date(a.createdAt).getTime() : 0;
      const bt = b.createdAt ? new Date(b.createdAt).getTime() : 0;
      return bt - at;
    });
    activeCategory = "الكل";
    renderMaterialsBrowser();
  } catch (err) {
    content.innerHTML = "";
    showError("تعذر تحميل المحتوى. تأكد من اتصالك بالإنترنت وحاول تاني.");
  }
}

function renderMaterialsBrowser() {
  clearError();
  document.getElementById("pageSub").textContent = selectedStudent.name + " — " + selectedStage;
  const content = document.getElementById("content");
  const categories = ["الكل", ...Array.from(new Set(allMaterials.map(m => m.category || "عام")))];
  const filtered = activeCategory === "الكل" ? allMaterials : allMaterials.filter(m => (m.category || "عام") === activeCategory);

  const pillsHtml = categories.map(c => `<button type="button" class="category-pill ${c === activeCategory ? 'active' : ''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join("");

  let bannerHtml = "";
  if (isSubscribed && subscriptionExpiry) {
    bannerHtml = `<div class="card banner ok"><span class="banner-line">${icon("check-circle")} اشتراكك ساري لحد ${escapeHtml(subscriptionExpiry)}</span></div>`;
  } else if (lockedCount > 0) {
    bannerHtml = `<div class="card banner lock"><span class="banner-line">${icon("lock")} فيه ${lockedCount} محتوى إضافي للمشتركين بس</span><p>كلّم المعلم عشان تشترك</p></div>`;
  }

  const itemsHtml = filtered.length === 0
    ? `<div class="card empty-state">${icon("inbox")}<p>لسه مفيش محتوى في التصنيف ده.</p></div>`
    : filtered.map(m => renderMaterialCard(m)).join("");

  content.innerHTML = `
    ${bannerHtml}
    <div class="category-pills">${pillsHtml}</div>
    ${itemsHtml}
  `;

  content.querySelectorAll(".category-pill").forEach(pill => {
    pill.addEventListener("click", () => {
      activeCategory = pill.dataset.cat;
      renderMaterialsBrowser();
    });
  });
  initVideoPlayers(content);
}

/* ===== مشغّل فيديو داخلي ===== */
let ytApiState = "idle", ytQueue = [];
function failYT() { if (ytApiState === "ready") return; ytApiState = "failed"; ytQueue.splice(0).forEach(f => f(false)); }
function ensureYT(cb) {
  if (window.YT && window.YT.Player) return cb(true);
  if (ytApiState === "failed") return cb(false);
  ytQueue.push(cb);
  if (ytApiState === "idle") {
    ytApiState = "loading";
    window.onYouTubeIframeAPIReady = () => { ytApiState = "ready"; ytQueue.splice(0).forEach(f => f(true)); };
    const t = document.createElement("script");
    t.src = "https://www.youtube.com/iframe_api";
    t.onerror = failYT;
    document.head.appendChild(t);
    setTimeout(() => { if (ytApiState !== "ready") failYT(); }, 8000);
  }
}
function ytIdFromUrl(u) {
  const m = /(?:embed\/|[?&]v=|youtu\.be\/)([A-Za-z0-9_-]{11})/.exec(u || "");
  return m ? m[1] : null;
}
function videoPlayerHtml(url) {
  return `<div class="yt-player" data-src="${escapeHtml(url)}">
    <div class="yt-stage"><div class="yt-bigplay"><span>${icon("play")}</span></div><div class="yt-shield"></div></div>
    <div class="yt-controls">
      <button type="button" class="yt-play" aria-label="تشغيل">${icon("play")}</button>
      <input type="range" class="yt-seek" min="0" max="0" step="1" value="0" aria-label="التقدّم في الفيديو">
      <span class="yt-time">0:00 / 0:00</span>
      <button type="button" class="yt-speed" aria-label="سرعة التشغيل">1x</button>
      <button type="button" class="yt-fs" aria-label="ملء الشاشة">${icon("maximize")}</button>
    </div>
  </div>`;
}
function initVideoPlayers(root) {
  root.querySelectorAll(".yt-player:not([data-ready])").forEach(box => {
    box.setAttribute("data-ready", "1");
    const url = box.getAttribute("data-src");
    const id = ytIdFromUrl(url);
    const stage = box.querySelector(".yt-stage");
    const plain = () => { box.classList.add("plain"); stage.insertAdjacentHTML("afterbegin", `<iframe src="${escapeHtml(url)}" allowfullscreen></iframe>`); };
    if (!id) return plain();
    ensureYT(ok => ok ? buildVideoPlayer(box, stage, id) : plain());
  });
}
function buildVideoPlayer(box, stage, id) {
  const q = "enablejsapi=1&controls=0&disablekb=1&fs=0&rel=0&modestbranding=1&iv_load_policy=3&playsinline=1&origin=" + encodeURIComponent(location.origin);
  stage.insertAdjacentHTML("afterbegin", `<iframe src="https://www.youtube-nocookie.com/embed/${id}?${q}" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>`);
  const frame = stage.querySelector("iframe");
  const $ = s => box.querySelector(s);
  const btnPlay = $(".yt-play"), seek = $(".yt-seek"), time = $(".yt-time"), btnFs = $(".yt-fs"), btnSpeed = $(".yt-speed"), shield = $(".yt-shield");
  const speeds = [1, 1.25, 1.5, 0.75];
  let player = null, timer = null, dragging = false, speedIdx = 0;
  const fmt = t => { t = Math.max(0, Math.floor(t || 0)); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); };
  const toggle = () => { if (player && player.getPlayerState) (player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo()); };
  function tick() {
    if (!box.isConnected) { clearInterval(timer); return; }
    if (!player || dragging || !player.getCurrentTime) return;
    const d = player.getDuration() || 0, c = player.getCurrentTime() || 0;
    seek.max = d; seek.value = c;
    time.textContent = fmt(c) + " / " + fmt(d);
  }
  player = new YT.Player(frame, { events: {
    onReady: () => { box.classList.add("ready"); tick(); },
    onStateChange: e => {
      const playing = e.data === 1;
      box.classList.toggle("playing", playing);
      btnPlay.innerHTML = icon(playing ? "pause" : "play");
      btnPlay.setAttribute("aria-label", playing ? "إيقاف مؤقت" : "تشغيل");
      clearInterval(timer);
      if (playing) timer = setInterval(tick, 500);
      tick();
    }
  }});
  shield.addEventListener("click", toggle);
  shield.addEventListener("contextmenu", e => e.preventDefault());
  btnPlay.addEventListener("click", toggle);
  seek.addEventListener("input", () => { dragging = true; time.textContent = fmt(seek.value) + " / " + fmt(seek.max); });
  seek.addEventListener("change", () => { if (player && player.seekTo) player.seekTo(Number(seek.value), true); dragging = false; tick(); });
  btnSpeed.addEventListener("click", () => {
    speedIdx = (speedIdx + 1) % speeds.length;
    if (player && player.setPlaybackRate) player.setPlaybackRate(speeds[speedIdx]);
    btnSpeed.textContent = speeds[speedIdx] + "x";
  });
  const reqFs = box.requestFullscreen || box.webkitRequestFullscreen;
  if (!reqFs) btnFs.hidden = true;
  btnFs.addEventListener("click", () => {
    if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else reqFs.call(box);
  });
}

function renderMaterialCard(m) {
  let bodyHtml = "";
  if (m.type === "video") {
    bodyHtml = videoPlayerHtml(m.url);
  } else if (m.type === "image") {
    bodyHtml = `<img class="mat-image" src="${escapeHtml(m.url)}" alt="${escapeHtml(m.title)}">`;
  } else if (m.type === "pdf") {
    bodyHtml = `<button type="button" class="mat-pdf-link" data-pdf-id="${escapeHtml(m.id)}" data-pdf-title="${escapeHtml(m.title || '')}">${icon("file")} افتح ملف الـPDF</button>`;
  }
  return `
    <div class="card">
      <div class="mat-title">${escapeHtml(m.title || "")}</div>
      <div class="mat-category">${escapeHtml(m.category || "عام")}</div>
      ${bodyHtml}
    </div>`;
}

async function openPdfContent(materialId, titleForFile) {
  try {
    const idToken = await auth.currentUser.getIdToken();
    const res = await fetch(`${STUDENT_AUTH_WORKER_URL}/content-pdf?materialId=${encodeURIComponent(materialId)}`, {
      headers: { "Authorization": `Bearer ${idToken}` }
    });
    if (!res.ok) throw new Error("failed");
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    window.open(blobUrl, "_blank");
  } catch (err) {
    alert("تعذر فتح الملف. حاول تاني.");
  }
}
document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-pdf-id]");
  if (btn) openPdfContent(btn.dataset.pdfId, btn.dataset.pdfTitle);
});

init();
