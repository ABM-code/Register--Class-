<script>
const TEACHER_NAME = "أ/ عبد الرحمن منير";
// إعدادات هوية المعلم — حدّثها يدويًا كل ما تغيّرها من لوحة "الهوية" في التطبيق الرئيسي
// إعدادات هوية المعلم — دي قيم افتراضية احتياطية (fallback) لو الـ Worker مرجعش هوية،
// وبتتحدّث تلقائيًا من رد /materials-students (حقل teacherBrand) لو موجود.
let TEACHER_CENTER_NAME = "";
let TEACHER_BRAND_COLOR = "#D4A93B";
let TEACHER_FOOTER_TEXT = "";
let TEACHER_DISPLAY_LINE = TEACHER_CENTER_NAME ? (TEACHER_CENTER_NAME + " — " + TEACHER_NAME) : TEACHER_NAME;

function hexToRgbTriplet(hex) {
  const c = (hex || "").replace("#", "");
  if (c.length !== 6) return "212,169,59";
  const r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
  return `${r},${g},${b}`;
}
function applyBrandColor(color) {
  if (!color) return;
  document.documentElement.style.setProperty("--accent", color);
  document.documentElement.style.setProperty("--accent-rgb", hexToRgbTriplet(color));
}
applyBrandColor(TEACHER_BRAND_COLOR);
function renderBrandFooter() {
  const el = document.getElementById("brandFooterText");
  if (!el) return;
  if (TEACHER_FOOTER_TEXT) { el.textContent = TEACHER_FOOTER_TEXT; el.style.display = "block"; }
  else { el.style.display = "none"; }
}
renderBrandFooter();

// بتاخد حقل teacherBrand من رد الـ Worker (لو موجود) وتستبدل بيه القيم الاحتياطية،
// بعدين تعيد تطبيق اللون والفوتر. لو teacherBrand مش موجود أو فاضي، بتسيب القيم الاحتياطية زي ما هي.
function applyTeacherBrandFromServer(brand) {
  if (!brand) return;
  if (brand.centerName) TEACHER_CENTER_NAME = brand.centerName;
  if (brand.brandColor) TEACHER_BRAND_COLOR = brand.brandColor;
  if (brand.footerText) TEACHER_FOOTER_TEXT = brand.footerText;
  TEACHER_DISPLAY_LINE = TEACHER_CENTER_NAME ? (TEACHER_CENTER_NAME + " — " + TEACHER_NAME) : TEACHER_NAME;
  applyBrandColor(TEACHER_BRAND_COLOR);
  renderBrandFooter();
}

const STUDENT_AUTH_WORKER_URL = "https://register-class-auth.abm319.workers.dev";
const firebaseConfig = {
  apiKey: "AIzaSyBcWhyLvCSnpyLSLWw9rHVSvODYgK67Wh0",
  authDomain: "register-class-302e6.firebaseapp.com",
  projectId: "register-class-302e6",
  storageBucket: "register-class-302e6.firebasestorage.app",
  messagingSenderId: "230991294181",
  appId: "1:230991294181:web:167cb0a370c68b6a6f6e0c"
};
/* تطبيق Firebase مستقل (باسم "student") عشان دخول الطالب هنا ما يبدّلش جلسة المعلم في التطبيق الرئيسي.
   قبل كده الاتنين كانوا بيشاركوا نفس الجلسة، فأي دخول للمكتبة كان بيطرد المعلم. */

const auth = studentApp.auth();
try { auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {}); } catch (e) {}

/* زرار «الصفحة الرئيسية»: تسجيل خروج فوري للطالب (من جلسة المكتبة المنفصلة بس) وبعدها نرجع للرئيسية */
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest(".home-back");
  if (!a) return;
  e.preventDefault();
  const go = () => { location.href = a.getAttribute("href") || "index.html"; };
  let done = false;
  const once = () => { if (!done) { done = true; go(); } };
  setTimeout(once, 1500); // لو الخروج اتأخر، منعلّقش المستخدم

});

const STAGES = ["Prep 1", "Prep 2", "Prep 3", "Sec 1", "Sec 2", "Sec 3"];

function icon(name) { return '<svg class="ic" aria-hidden="true"><use href="#i-' + name + '"/></svg>'; }
function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function normalizeArabic(str) {
  if (!str) return "";
  return String(str)
    .replace(/[إأآا]/g, "ا")
    .replace(/ى/g, "ي")
    .replace(/ة/g, "ه")
    .replace(/\s+/g, "")
    .toLowerCase();
}
function icon(name) { return '<svg class="ic" aria-hidden="true"><use href="#i-' + name + '"/></svg>'; }
function showError(msg) {
  const box = document.getElementById("errorBox");
  box.innerHTML = icon("alert") + "<span></span>";
  box.lastChild.textContent = msg;
  box.style.display = "flex";
}
function clearError() {
  document.getElementById("errorBox").style.display = "none";
}

let selectedStage = "";
let studentsInStage = [];
let selectedStudent = null;
let studentClaims = null;
let allMaterials = [];
let activeCategory = "الكل";
let lockedCount = 0;
let isSubscribed = false;
let subscriptionExpiry = null;

function init() {
  renderStagePicker();
}

function renderStagePicker() {
  const content = document.getElementById("content");
  content.innerHTML = `
    <div class="card">
      <label>اختر مرحلتك</label>
      <select id="stageSelect">
        <option value="">— اختر المرحلة —</option>
        ${STAGES.map(s => `<option value="${s}">${s}</option>`).join("")}
      </select>
    </div>
    <button id="stageNextBtn" disabled>التالي</button>
    <a href="redeem.html" class="page-link">${icon("ticket")} عندك كود شراء محتوى؟ فعّله من هنا</a>
  `;
  const select = document.getElementById("stageSelect");
  const nextBtn = document.getElementById("stageNextBtn");
  select.addEventListener("change", () => {
    nextBtn.disabled = !select.value;
  });
  nextBtn.addEventListener("click", async () => {
    clearError();
    selectedStage = select.value;
    if (!selectedStage) return;
    nextBtn.disabled = true;
    nextBtn.textContent = "جاري التحميل...";
    try {
      const res = await fetch(`${STUDENT_AUTH_WORKER_URL}/materials-students?stage=${encodeURIComponent(selectedStage)}`);
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) throw new Error("load_failed");
      applyTeacherBrandFromServer(data.teacherBrand);
      studentsInStage = (data.students || []).sort((a,b) => (a.name||"").localeCompare(b.name||""));
      renderStudentPicker();
    } catch (err) {
      nextBtn.disabled = false;
      nextBtn.textContent = "التالي";
      showError("تعذر تحميل بيانات المرحلة. تأكد من اتصالك بالإنترنت وحاول تاني.");
    }
  });
}

function renderStudentPicker() {
  document.getElementById("pageSub").textContent = selectedStage + " — " + TEACHER_DISPLAY_LINE;
  const content = document.getElementById("content");
  content.innerHTML = `
    <div class="card">
      <label>اكتب اسمك للبحث</label>
      <input type="text" id="studentSearchInput" placeholder="اكتب أول كام حرف من اسمك" autocomplete="off">
      <div class="student-suggestions" id="studentSuggestions"></div>
    </div>
    <div class="card" id="pinCard" style="display:none;">
      <label>اكتب الرمز السري بتاعك (4 أرقام)</label>
      <input type="text" id="pinInput" placeholder="4 أرقام" maxlength="4" inputmode="numeric">
      <p id="pinMsg" style="font-size:0.82rem; margin:0.5rem 0 0; display:none;"></p>
    </div>
    <button id="enterBtn" disabled>ادخل المكتبة</button>
    <a href="redeem.html" class="page-link">${icon("ticket")} مش لاقي اسمك؟ لو معاك كود شراء فعّله من هنا</a>
  `;
  const searchInput = document.getElementById("studentSearchInput");
  const suggestionsBox = document.getElementById("studentSuggestions");
  const pinCard = document.getElementById("pinCard");
  const pinInput = document.getElementById("pinInput");
  const pinMsg = document.getElementById("pinMsg");
  const enterBtn = document.getElementById("enterBtn");

  function hideSuggestions() {
    suggestionsBox.style.display = "none";
    suggestionsBox.innerHTML = "";
  }

  /* ===== عدّاد القفل بعد 5 محاولات غلط (القفل نفسه بيتفرض من السيرفر، ده عرض بس) ===== */
  const lockUntilByStudent = {};
  let lockTimer = null;
  function stopLockTimer() {
    if (lockTimer) { clearInterval(lockTimer); lockTimer = null; }
    pinInput.disabled = false;
  }
  function startLockCountdown(studentId, endMs) {
    stopLockTimer();
    pinInput.disabled = true;
    pinInput.value = "";
    enterBtn.disabled = true;
    enterBtn.textContent = "ادخل المكتبة";
    const tick = () => {
      const left = Math.ceil((endMs - Date.now()) / 1000);
      if (left <= 0) {
        stopLockTimer();
        delete lockUntilByStudent[studentId];
        pinMsg.style.display = "none";
        if (selectedStudent && selectedStudent.id === studentId) pinInput.focus();
        return;
      }
      const mm = String(Math.floor(left / 60)).padStart(2, "0");
      const ss = String(left % 60).padStart(2, "0");
      pinMsg.textContent = `تم قفل الدخول مؤقتًا بسبب محاولات كتيرة غلط. تقدر تحاول تاني بعد ${mm}:${ss}`;
      pinMsg.style.color = "var(--c-danger)";
      pinMsg.style.display = "block";
    };
    tick();
    lockTimer = setInterval(tick, 1000);
  }

  function resetPin() {
    stopLockTimer();
    pinCard.style.display = "none";
    pinInput.value = "";
    pinMsg.style.display = "none";
    enterBtn.disabled = true;
  }

  searchInput.addEventListener("input", () => {
    if (selectedStudent) { selectedStudent = null; resetPin(); }
    const q = searchInput.value.trim();
    if (q.length < 2) { hideSuggestions(); return; }
    const normQ = normalizeArabic(q.toLowerCase());
    const matches = studentsInStage.filter(s => normalizeArabic((s.name || "").toLowerCase()).includes(normQ)).slice(0, 6);
    if (matches.length === 0) {
      suggestionsBox.innerHTML = `<div class="student-suggestion-empty">مفيش اسم متطابق. تأكد من كتابة اسمك صح.</div>`;
      suggestionsBox.style.display = "block";
      return;
    }
    suggestionsBox.innerHTML = matches.map(s => `<button type="button" class="student-suggestion-item" data-id="${s.id}">${escapeHtml(s.name)}</button>`).join("");
    suggestionsBox.style.display = "block";
    suggestionsBox.querySelectorAll(".student-suggestion-item").forEach(btn => {
      btn.addEventListener("click", () => {
        selectedStudent = studentsInStage.find(s => s.id === btn.dataset.id) || null;
        searchInput.value = selectedStudent ? selectedStudent.name : "";
        hideSuggestions();
        resetPin();
        if (selectedStudent) {
          pinCard.style.display = "block";
          const lu = lockUntilByStudent[selectedStudent.id];
          if (lu && lu > Date.now()) startLockCountdown(selectedStudent.id, lu);
          else pinInput.focus();
        }
      });
    });
  });

  pinInput.addEventListener("input", () => {
    const typed = pinInput.value.replace(/\D/g, "");
    pinInput.value = typed;
    pinMsg.style.display = "none";
    enterBtn.disabled = typed.length !== 4 || !selectedStudent;
  });

  enterBtn.addEventListener("click", async () => {
    if (!selectedStudent) return;
    enterBtn.disabled = true;
    enterBtn.textContent = "جاري التحقق...";
    try {
      const res = await fetch(`${STUDENT_AUTH_WORKER_URL}/materials-login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ studentId: selectedStudent.id, pin: pinInput.value })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok || !data.customToken) {
        const err = new Error(data.error || "invalid_pin");
        err.remainingMin = data.remainingMin;
        throw err;
      }
      await auth.signInWithCustomToken(data.customToken);
      const idTokenResult = await auth.currentUser.getIdTokenResult();
      studentClaims = idTokenResult.claims;
      await loadMaterials();
    } catch (err) {
      if (err.message === "locked") {
        const endMs = Date.now() + (Number(err.remainingMin) || 5) * 60000;
        lockUntilByStudent[selectedStudent.id] = endMs;
        startLockCountdown(selectedStudent.id, endMs);
        return;
      }
      pinMsg.textContent = err.message === "invalid_pin" ? "الرمز غير صحيح." : "تعذر التحقق. حاول تاني.";
      pinMsg.style.color = "var(--c-danger)";
      pinMsg.style.display = "block";
      enterBtn.disabled = false;
      enterBtn.textContent = "ادخل المكتبة";
    }
  });
}

async function loadMaterials() {
  const content = document.getElementById("content");
  content.innerHTML = `<div class="loading"><span class="spinner"></span>جاري تحميل المحتوى...</div>`;
  try {
    const idToken = await auth.currentUser.getIdToken();
    const res = await fetch(`${STUDENT_AUTH_WORKER_URL}/materials-list`, {
      headers: { "Authorization": `Bearer ${idToken}` }
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) throw new Error("load_failed");
    allMaterials = data.materials || [];
    lockedCount = data.lockedCount || 0;
    isSubscribed = !!data.isSubscribed;
    subscriptionExpiry = data.subscriptionExpiry || null;
    allMaterials.sort((a, b) => {
      const at = a.createdAt ? new Date(a.createdAt).getTime() : 0;
      const bt = b.createdAt ? new Date(b.createdAt).getTime() : 0;
      return bt - at;
    });
    activeCategory = "الكل";
    renderMaterialsBrowser();
  } catch (err) {
    content.innerHTML = "";
    showError("تعذر تحميل المحتوى. تأكد من اتصالك بالإنترنت وحاول تاني.");
  }
}

function renderMaterialsBrowser() {
  clearError();
  document.getElementById("pageSub").textContent = selectedStudent.name + " — " + selectedStage;
  const content = document.getElementById("content");
  const categories = ["الكل", ...Array.from(new Set(allMaterials.map(m => m.category || "عام")))];
  const filtered = activeCategory === "الكل" ? allMaterials : allMaterials.filter(m => (m.category || "عام") === activeCategory);

  const pillsHtml = categories.map(c => `<button type="button" class="category-pill ${c === activeCategory ? 'active' : ''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join("");

  let bannerHtml = "";
  if (isSubscribed && subscriptionExpiry) {
    bannerHtml = `<div class="card banner ok"><span class="banner-line">${icon("check-circle")} اشتراكك ساري لحد ${escapeHtml(subscriptionExpiry)}</span></div>`;
  } else if (lockedCount > 0) {
    bannerHtml = `<div class="card banner lock"><span class="banner-line">${icon("lock")} فيه ${lockedCount} محتوى إضافي للمشتركين بس</span><p>كلّم المعلم عشان تشترك</p></div>`;
  }

  const itemsHtml = filtered.length === 0
    ? `<div class="card empty-state">${icon("inbox")}<p>لسه مفيش محتوى في التصنيف ده.</p></div>`
    : filtered.map(m => renderMaterialCard(m)).join("");

  content.innerHTML = `
    ${bannerHtml}
    <div class="category-pills">${pillsHtml}</div>
    ${itemsHtml}
  `;

  content.querySelectorAll(".category-pill").forEach(pill => {
    pill.addEventListener("click", () => {
      activeCategory = pill.dataset.cat;
      renderMaterialsBrowser();
    });
  });
  initVideoPlayers(content);
  bindLazyVideos(content);
}

/* ===== تتبّع مدة المشاهدة (بيوصل للمعلم كإحصائيات) ===== */
function trackVideoWatch(box, token) {
  if (!token) return;
  let acc = 0, started = false, startSent = false, last = Date.now();
  const flush = () => {
    const secs = Math.floor(acc);
    if (!secs && !(started && !startSent)) return;
    const body = JSON.stringify({ token, seconds: secs, started: started && !startSent });
    acc -= secs; if (started) startSent = true;
    try { fetch(`${STUDENT_AUTH_WORKER_URL}/video-watch`, { method: "POST", headers: { "Content-Type": "text/plain;charset=UTF-8" }, body, keepalive: true }).catch(() => {}); } catch (e) {}
  };
  const timer = setInterval(() => {
    const now = Date.now(), dt = Math.min((now - last) / 1000, 5); last = now;
    if (!box.isConnected) { flush(); clearInterval(timer); return; }
    if (box._diag && box._diag.state === 1) { acc += dt; if (!started) { started = true; flush(); } }   // state 1 = شغّال
    if (acc >= 60) flush();
  }, 1000);
  document.addEventListener("visibilitychange", () => { if (document.hidden) flush(); });
  window.addEventListener("pagehide", flush);
}

/* ===== تحميل الفيديو بعد التحقق من الصلاحية (/content-video) ===== */
async function loadLazyVideo(lazy) {
  const btn = lazy.querySelector(".yt-lazy-btn"), msg = lazy.querySelector(".yt-lazy-msg");
  const fail = t => { msg.hidden = false; msg.textContent = t; btn.disabled = false; btn.lastChild.textContent = " جرّب تاني"; };
  btn.disabled = true; msg.hidden = true;
  try {
    const idToken = await auth.currentUser.getIdToken();
    const res = await fetch(`${STUDENT_AUTH_WORKER_URL}/content-video?materialId=${encodeURIComponent(lazy.dataset.mid)}`, { headers: { "Authorization": `Bearer ${idToken}` } });
    const data = await res.json().catch(() => ({}));
    if (res.status === 403) return fail("مش مسموحلك تشوف الفيديو ده. لو مشترك كلّم المعلم.");
    if (!res.ok || !data.ok || !data.url) return fail("تعذر تحميل الفيديو. تأكد من النت وحاول تاني.");
    const wrap = document.createElement("div");
    wrap.innerHTML = videoPlayerHtml(data.url, lazy.dataset.keys || "");
    const box = wrap.firstElementChild;
    lazy.replaceWith(box);
    ytMount(box, ytVariant(), "");
    trackVideoWatch(box, data.watchToken);
  } catch (e) { fail("تعذر تحميل الفيديو. تأكد من النت وحاول تاني."); }
}
function bindLazyVideos(root) {
  root.querySelectorAll(".yt-lazy:not([data-bound])").forEach(l => {
    l.setAttribute("data-bound", "1");
    l.querySelector(".yt-lazy-btn").addEventListener("click", () => loadLazyVideo(l));
  });
}

async function ytProbe(id) {

function ytMount(box, variant, note) {

  box.addEventListener("pointerdown", () => { box._touched = true; }, { once: true });
  ytBindHelp(box);

/* اختصارات الكيبورد (للكمبيوتر): بتشتغل بس لو الماوس فوق الفيديو أو هو ملء الشاشة */
function ytBindKeys() {
  if (ytKeysBound) return;
  ytKeysBound = true;
  document.addEventListener("keydown", e => {
    const box = ytActiveBox, api = box && box._ytApi;
    if (!api || !box.isConnected || e.ctrlKey || e.metaKey || e.altKey) return;
    const t = e.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (t && t.isContentEditable)) return;
    if (!(api.isFs() || box.matches(":hover") || box.contains(document.activeElement))) return;
    switch (e.key) {
      case " ": if (tag === "BUTTON") return; e.preventDefault(); api.toggle(); break;
      case "k": case "K": api.toggle(); break;
      case "ArrowLeft": case "j": case "J": e.preventDefault(); api.seek(-1); break;
      case "ArrowRight": case "l": case "L": e.preventDefault(); api.seek(1); break;
      case "ArrowUp": e.preventDefault(); api.volume(10); break;
      case "ArrowDown": e.preventDefault(); api.volume(-10); break;
      case "m": case "M": api.mute(); break;
      case "f": case "F": api.fs(); break;
      case "<": api.speed(-1); break;
      case ">": api.speed(1); break;

    }

  function zoneOf(e) {
    const r = stage.getBoundingClientRect();
    const rotated = box.classList.contains("yt-fake") && /rotate/.test(box.style.transform || "");
    const f = rotated ? (e.clientY - r.top) / r.height : (e.clientX - r.left) / r.width;
    return f < 0.35 ? "left" : f > 0.65 ? "right" : "mid";
  }
  const onShield = e => {
    speedMenu.classList.remove("open");
    const now = Date.now(), zone = zoneOf(e), dir = zone === "left" ? -1 : zone === "right" ? 1 : 0;
    if (dir && streak.dir === dir && now - streak.last < 700) { clearTimeout(tapTimer); lastTap = { t: 0, zone: "" }; doSeek(dir); return; }   // ضغطات سريعة زيادة = 10 ثواني كمان
    if (lastTap.zone === zone && now - lastTap.t < 300) {                                                                                      // ضغط مزدوج
      clearTimeout(tapTimer); lastTap = { t: 0, zone: "" };
      if (dir) doSeek(dir); else (fsMode ? exitFs() : enterFs(false));
      return;
    }
    lastTap = { t: now, zone };
    clearTimeout(tapTimer);
    // التشغيل لازم يتنفذ فورًا جوه الضغطة نفسها (شرط الآيفون)؛ الانتظار (للتمييز عن الضغط المزدوج) بس قبل الإيقاف
    if (!isPlaying()) { toggle(); poke(); return; }
    tapTimer = setTimeout(() => { lastTap = { t: 0, zone: "" }; toggle(); poke(); }, 280);
  };
  shield.addEventListener("click", onShield);
  shieldB.addEventListener("click", onShield);
  shield.addEventListener("contextmenu", e => e.preventDefault());
  shieldB.addEventListener("contextmenu", e => e.preventDefault());

  /* ملء الشاشة + تدوير: نظام الجهاز لو متاح، وإلا تدوير بالـCSS (آيفون) */
  function poke() {
    box.classList.remove("hide-controls");
    clearTimeout(hideTimer);
    if (fsMode && box.classList.contains("playing")) hideTimer = setTimeout(() => box.classList.add("hide-controls"), 3000);
  }
  function layoutFake() {
    if (fsMode !== "fake") return;
    const w = window.innerWidth, h = window.innerHeight;
    if (h > w) { box.style.width = h + "px"; box.style.height = w + "px"; box.style.transform = "translateX(" + w + "px) rotate(90deg)"; }
    else { box.style.width = w + "px"; box.style.height = h + "px"; box.style.transform = "none"; }
  }
  async function enterFs(auto) {
    if (fsMode) return;
    autoFs = !!auto;
    const reqFs = box.requestFullscreen || box.webkitRequestFullscreen;
    if (!auto && reqFs) {
      try {
        const r = reqFs.call(box);
        if (r && r.then) await r;
        fsMode = "native";
        try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape"); } catch (e) {}
      } catch (e) { fsMode = null; }
    }
    if (!fsMode) {
      fsMode = "fake";
      box.classList.add("yt-fake");
      document.body.style.overflow = "hidden";
      layoutFake();
    }
    box.classList.add("yt-fs");
    btnFs.innerHTML = icon("minimize");
    btnFs.setAttribute("aria-label", "الخروج من ملء الشاشة");
    poke();
  }
  function exitFs(fromEvent) {
    const mode = fsMode;
    if (!mode) return;
    fsMode = null; autoFs = false;
    if (mode === "native") {
      if (!fromEvent) { try { const p = (document.exitFullscreen || document.webkitExitFullscreen).call(document); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
      try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
    } else {
      box.classList.remove("yt-fake");
      box.style.width = box.style.height = box.style.transform = "";
      document.body.style.overflow = "";
    }
    box.classList.remove("yt-fs", "hide-controls");
    btnFs.innerHTML = icon("maximize");
    btnFs.setAttribute("aria-label", "ملء الشاشة");
    clearTimeout(hideTimer);
  }
  const onFsChange = () => { if (fsMode === "native" && document.fullscreenElement !== box && document.webkitFullscreenElement !== box) exitFs(true); };
  document.addEventListener("fullscreenchange", onFsChange);
  document.addEventListener("webkitfullscreenchange", onFsChange);
  window.addEventListener("resize", layoutFake);
  window.addEventListener("orientationchange", () => setTimeout(layoutFake, 250));
  document.addEventListener("keydown", e => { if (e.key === "Escape" && fsMode === "fake") exitFs(); });
  const mqLand = window.matchMedia("(orientation: landscape)");
  const onOrient = () => {
    if (!box.isConnected) { mqLand.removeEventListener && mqLand.removeEventListener("change", onOrient); return; }
    if (mqLand.matches) {
      if (!fsMode && box.classList.contains("playing") && window.matchMedia("(pointer: coarse)").matches) enterFs(true);
    } else if (autoFs && fsMode) exitFs();
  };
  if (mqLand.addEventListener) mqLand.addEventListener("change", onOrient);
  btnFs.addEventListener("click", () => { fsMode ? exitFs() : enterFs(false); });
  box.addEventListener("pointerdown", () => { ytActiveBox = box; poke(); });
  box.addEventListener("mouseenter", () => { ytActiveBox = box; });
  box.addEventListener("mousemove", poke);

  /* السرعة (القائمة بتفتح فوق الأزرار، والاختيار بيتحفظ للفيديوهات الجاية) */
  function applySpeed(r, persist) {
    speed = r;
    if (player && player.setPlaybackRate) player.setPlaybackRate(r);
    btnSpeed.textContent = r + "x";
    speedMenu.querySelectorAll("button").forEach(b => b.classList.toggle("on", Number(b.dataset.r) === r));
    if (persist) ytStore("ytspeed", r);
  }
  function buildSpeedMenu() {
    let rates = [];
    try { rates = (player.getAvailablePlaybackRates && player.getAvailablePlaybackRates()) || []; } catch (e) {}
    const list = YT_SPEEDS.filter(r => !rates.length || rates.includes(r));
    speedList = list.length ? list : YT_SPEEDS.slice();
    speedMenu.innerHTML = speedList.map(r => `<button type="button" data-r="${r}"${r === speed ? ' class="on"' : ""}>${r}x</button>`).join("");
  }
  btnSpeed.addEventListener("click", () => { speedMenu.classList.toggle("open"); poke(); });
  speedMenu.addEventListener("click", e => {
    const b = e.target.closest("button[data-r]");
    if (!b) return;
    applySpeed(Number(b.dataset.r), true);
    speedMenu.classList.remove("open");
    if (e.detail > 0) b.blur();
    poke();
  });

  /* الصوت (على الكمبيوتر بس؛ على الموبايل بزراير الجهاز) */
  function syncMute() { const m = player && player.isMuted && player.isMuted(); btnMute.innerHTML = icon(m ? "volume-x" : "volume-2"); btnMute.setAttribute("aria-label", m ? "تشغيل الصوت" : "كتم الصوت"); }
  function toggleMute() {
    if (!player || !player.isMuted) return;
    if (player.isMuted()) player.unMute(); else player.mute();
    syncMute();
    showToast(player.isMuted() ? "الصوت مكتوم" : "تم تشغيل الصوت", 1000);
  }
  function changeVolume(d) {
    if (!player || !player.getVolume) return;
    const v = Math.min(100, Math.max(0, (player.getVolume() || 0) + d));
    player.setVolume(v);
    if (v > 0 && player.isMuted && player.isMuted()) player.unMute();
    syncMute();
    showToast("الصوت " + v + "%", 1000);
  }
  btnMute.addEventListener("click", toggleMute);
  // بعد الضغط بالماوس/اللمس بنشيل التركيز من الزرار، عشان زرار المسافة يفضل للتشغيل/الإيقاف مش يكرّر آخر زرار اتضغط
  $(".yt-controls").addEventListener("click", e => { if (e.detail > 0) { const b = e.target.closest("button"); if (b) b.blur(); } });
  $(".yt-back").addEventListener("click", () => doSeek(-1));
  $(".yt-fwd").addEventListener("click", () => doSeek(1));

  /* كمّل من آخر مكان وقفت عنده (على نفس الجهاز) */
  function maybeResume() {
    const d = player.getDuration() || 0;
    if (savedPos > 5 && (!d || savedPos < d - 10) && (player.getCurrentTime() || 0) < 3) {
      player.seekTo(savedPos, true);
      showToast(`<span>كمّلنا من ${fmt(savedPos)}</span><button type="button" class="yt-toast-btn">من الأول</button>`, 6000);
    }
  }
  toast.addEventListener("click", e => {
    if (!e.target.closest(".yt-toast-btn")) return;
    if (player && player.seekTo) player.seekTo(0, true);
    toast.classList.remove("show");
  });
  $(".yt-replay").addEventListener("click", () => {
    if (!player) return;
    player.seekTo(0, true); player.playVideo();
    box.classList.remove("ended");
  });
  window.addEventListener("pagehide", () => { if (box.classList.contains("playing")) savePos(false); });

  // الضغط جوه الفيديو نفسه (مش على غطاءنا) بيعمل blur للنافذة: نراقب إن التشغيل بدأ
  window.addEventListener("blur", () => { setTimeout(() => { if (box.isConnected && document.activeElement === frame) armStartWatch(); }, 0); });
  readyTimer = setTimeout(() => { if (!diag.ready) ytAutoFallback(box, "المشغّل المطوّر ما استجابش"); }, 7000);
  player = new YT.Player(frame, { events: {
    onReady: () => { diag.ready = true; clearTimeout(readyTimer); box.classList.add("ready"); buildSpeedMenu(); syncMute(); tick(); },
    onStateChange: e => {
      const st = e.data, playing = st === 1;
      diag.state = st;
      if (playing || st === 3) clearTimeout(startTimer);
      box.classList.toggle("playing", playing);
      if (playing) { box.classList.add("live"); clearTimeout(wdTimer); }
      box.classList.toggle("buffering", st === 3);
      box.classList.toggle("ended", st === 0);
      btnPlay.innerHTML = icon(playing ? "pause" : "play");
      btnPlay.setAttribute("aria-label", playing ? "إيقاف مؤقت" : "تشغيل");
      clearInterval(timer);
      if (playing) timer = setInterval(tick, 500);
      if (playing && !speedApplied) { speedApplied = true; if (speed !== 1) applySpeed(speed, false); }
      if (playing && !resumeDone) { resumeDone = true; maybeResume(); }
      if (st === 2) savePos(false);
      if (st === 0) savePos(true);
      tick(); poke();
    },
    onError: e => { clearTimeout(startTimer); ytShowError(box, e.data); }
  }});
  seek.addEventListener("input", () => { dragging = true; time.textContent = fmt(seek.value) + " / " + fmt(seek.max); });
  seek.addEventListener("change", () => { if (player && player.seekTo) player.seekTo(Number(seek.value), true); dragging = false; tick(); seek.blur(); });
  btnPlay.addEventListener("click", toggle);

  box._ytApi = {
    toggle, isFs: () => !!fsMode, fs: () => (fsMode ? exitFs() : enterFs(false)),
    seek: d => doSeek(d > 0 ? 1 : -1), volume: changeVolume, mute: toggleMute,
    speed: step => { const i = speedList.indexOf(speed); const n = speedList[Math.min(speedList.length - 1, Math.max(0, (i < 0 ? speedList.indexOf(1) : i) + step))]; applySpeed(n, true); showToast(n + "x", 900); },
  };
  ytBindKeys();
}

function renderMaterialCard(m) {
  let bodyHtml = "";
  if (m.type === "video") {
    if (m.url || m.hasVideo === false) {
      bodyHtml = videoPlayerHtml(matVideoSrc(m), Object.keys(m).join(","));
    } else {
      bodyHtml = `<div class="yt-lazy" data-mid="${escapeHtml(m.id)}" data-keys="${escapeHtml(Object.keys(m).join(","))}"><div><button type="button" class="yt-lazy-btn">${icon("play")} تشغيل الفيديو</button><span class="yt-lazy-msg" hidden></span></div></div>`;
    }
  } else if (m.type === "image") {
    bodyHtml = `<img class="mat-image" src="${escapeHtml(m.url)}" alt="${escapeHtml(m.title)}">`;
  } else if (m.type === "pdf") {
    bodyHtml = `<button type="button" class="mat-pdf-link" data-pdf-id="${escapeHtml(m.id)}" data-pdf-title="${escapeHtml(m.title || '')}">${icon("file")} افتح ملف الـPDF</button>`;
  }
  return `
    <div class="card">
      <div class="mat-title">${escapeHtml(m.title || "")}</div>
      <div class="mat-category">${escapeHtml(m.category || "عام")}</div>
      ${bodyHtml}
    </div>`;
}

async function openPdfContent(materialId, titleForFile) {
  try {
    const idToken = await auth.currentUser.getIdToken();
    const res = await fetch(`${STUDENT_AUTH_WORKER_URL}/content-pdf?materialId=${encodeURIComponent(materialId)}`, {
      headers: { "Authorization": `Bearer ${idToken}` }
    });
    if (!res.ok) throw new Error("failed");
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    window.open(blobUrl, "_blank");
  } catch (err) {
    alert("تعذر فتح الملف. حاول تاني.");
  }
}
document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-pdf-id]");
  if (btn) openPdfContent(btn.dataset.pdfId, btn.dataset.pdfTitle);
});

init();
</script>
