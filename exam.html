
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#16302B">
<title>امتحان</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #16302B; color: #1B2420; min-height: 100vh; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 1.75rem 1.25rem 3rem; }
  .timer-bar {
    position: sticky; top: 0; z-index: 50; background: #16302B; border-bottom: 1px solid rgba(245,241,230,0.15);
    padding: 0.6rem 1.25rem; margin: -1.75rem -1.25rem 1.25rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
  }
  .timer-bar .timer-value { font-family: 'Fraunces', serif; font-weight: 700; font-size: 1.1rem; color: #D4A93B; }
  .timer-bar.timer-warning .timer-value { color: #C15B3C; }
  h1 { font-family: 'Fraunces', serif; color: #F5F1E6; font-size: 1.4rem; margin: 0 0 0.3rem; }
  p.sub { color: #9FB8AD; font-size: 0.88rem; margin: 0 0 1.5rem; }
  .card { background: #F5F1E6; border-radius: 14px; padding: 1.25rem; margin-bottom: 1rem; box-shadow: 0 8px 24px rgba(0,0,0,0.18); }
  label { display: block; font-size: 0.82rem; color: #6B6B60; margin-bottom: 0.4rem; font-weight: 500; }
  select, input[type=text] {
    width: 100%; padding: 0.65rem 0.8rem; border-radius: 9px; border: 1px solid rgba(0,0,0,0.15);
    background: #FFFDF8; font-size: 0.95rem; color: #1B2420; font-family: inherit;
  }
  select:focus, input:focus { outline: none; border-color: #D4A93B; box-shadow: 0 0 0 3px rgba(212,169,59,0.18); }
  button {
    font-family: inherit; background: #D4A93B; color: #1B2420; border: none; border-radius: 10px;
    padding: 0.75rem 1.2rem; font-weight: 700; font-size: 0.95rem; cursor: pointer; width: 100%;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button:active:not(:disabled) { transform: scale(0.98); }
  .passage { background: #EAEAE4; border-radius: 9px; padding: 0.8rem 1rem; margin-bottom: 0.8rem; font-size: 0.9rem; line-height: 1.6; color: #3a3a34; white-space: pre-wrap; unicode-bidi: plaintext; text-align: start; }
  .q-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1rem; margin-bottom: 0.7rem; unicode-bidi: plaintext; text-align: start; }
  .q-num { color: #6B6B60; font-size: 0.8rem; margin-bottom: 0.2rem; }
  .option-row { display: flex; align-items: center; gap: 0.6rem; padding: 0.6rem 0.75rem; border: 1px solid rgba(0,0,0,0.12); border-radius: 9px; margin-bottom: 0.5rem; cursor: pointer; background: #FFFDF8; }
  .option-row span { unicode-bidi: plaintext; text-align: start; flex: 1; }
  .option-row input { accent-color: #3F6B4A; width: 17px; height: 17px; flex-shrink: 0; }
  .option-row.selected { border-color: #D4A93B; background: #FBF3DF; }
  #errorBox { background: #F6E7E2; color: #9C4B32; padding: 0.65rem 0.9rem; border-radius: 8px; font-size: 0.88rem; margin-bottom: 1rem; display: none; }
  .result-score { font-family: 'Fraunces', serif; font-size: 2.4rem; font-weight: 700; color: #3F6B4A; text-align: center; margin: 0.4rem 0; }
  .result-label { text-align: center; color: #6B6B60; font-size: 0.9rem; }
  .review-card { border-right: 4px solid transparent; }
  .review-correct { border-right-color: #5E9468; }
  .review-wrong { border-right-color: #C15B3C; }
  .review-row { display: flex; align-items: baseline; gap: 0.4rem; font-size: 0.88rem; margin-top: 0.4rem; flex-wrap: wrap; }
  .review-icon { font-weight: 700; }
  .review-correct .review-row .review-icon { color: #3F6B4A; }
  .review-wrong .review-row .review-icon { color: #C15B3C; }
  .review-label { color: #6B6B60; }
  .review-value { color: #1B2420; font-weight: 600; unicode-bidi: plaintext; }
  .review-correct-text { color: #3F6B4A; }
  .loading { color: #9FB8AD; text-align: center; padding: 2rem 0; }
  .student-suggestions { margin-top: 0.4rem; border-radius: 9px; overflow: hidden; display: none; }
  .student-suggestion-item {
    display: block; width: 100%; text-align: right; background: #FFFDF8; color: #1B2420;
    border: 1px solid rgba(0,0,0,0.12); border-top: none; padding: 0.65rem 0.8rem;
    font-size: 0.92rem; font-weight: 500; cursor: pointer; border-radius: 0;
  }
  .student-suggestion-item:first-child { border-top: 1px solid rgba(0,0,0,0.12); border-radius: 9px 9px 0 0; }
  .student-suggestion-item:last-child { border-radius: 0 0 9px 9px; }
  .student-suggestion-item:active { background: #FBF3DF; }
  .student-suggestion-empty { padding: 0.65rem 0.8rem; font-size: 0.85rem; color: #9C4B32; background: #F6E7E2; border-radius: 9px; }
  .explain-actions { display: flex; gap: 0.5rem; margin-top: 0.7rem; flex-wrap: wrap; }
  .explain-btn {
    background: none; border: 1px solid rgba(0,0,0,0.15); color: #4A5A50; border-radius: 8px;
    padding: 0.4rem 0.75rem; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 0.3rem;
  }
  .explain-btn:active { background: rgba(0,0,0,0.05); }
  .explain-btn[disabled] { opacity: 0.5; cursor: default; }
  .explain-box {
    margin-top: 0.6rem; background: #EFF5F0; border-radius: 9px; padding: 0.7rem 0.85rem;
    font-size: 0.85rem; line-height: 1.6; color: #3a3a34; unicode-bidi: plaintext; text-align: start;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="examTitle">جاري التحميل…</h1>
  <p class="sub" id="examSub"></p>
  <div id="errorBox"></div>
  <div id="content"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
const TEACHER_NAME = "أ/ عبد الرحمن منير";
const STUDENT_AUTH_WORKER_URL = "https://register-class-auth.abm319.workers.dev";
const AI_EXPLAIN_WORKER_URL = "https://register-class.abm319.workers.dev/explain";
const firebaseConfig = {
  apiKey: "AIzaSyBcWhyLvCSnpyLSLWw9rHVSvODYgK67Wh0",
  authDomain: "register-class-302e6.firebaseapp.com",
  projectId: "register-class-302e6",
  storageBucket: "register-class-302e6.firebasestorage.app",
  messagingSenderId: "230991294181",
  appId: "1:230991294181:web:167cb0a370c68b6a6f6e0c"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function normalizeArabic(str) {
  if (!str) return "";
  return String(str)
    .replace(/[إأآا]/g, "ا")
    .replace(/ى/g, "ي")
    .replace(/ة/g, "ه")
    .replace(/\s+/g, "")
    .toLowerCase();
}
function showError(msg) {
  const box = document.getElementById("errorBox");
  box.textContent = msg;
  box.style.display = "block";
}

const params = new URLSearchParams(window.location.search);
const examId = params.get("examId");
let exam = null;
let studentsInStage = [];
let selectedStudent = null;

async function init() {
  if (!examId) {
    document.getElementById("examTitle").textContent = "رابط غير صالح";
    showError("مفيش امتحان محدد في الرابط ده.");
    return;
  }
  try {
    const res = await fetch(`${STUDENT_AUTH_WORKER_URL}/student-exam?examId=${encodeURIComponent(examId)}`);
    if (!res.ok) throw new Error("exam_lookup_failed");
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "exam_lookup_failed");
    exam = { id: examId, title: data.title || "امتحان", stage: data.stage || "" };
    document.getElementById("examTitle").textContent = exam.title;
    document.getElementById("examSub").textContent = (exam.stage || "") + " — " + TEACHER_NAME;
    studentsInStage = (data.students || []).sort((a,b) => (a.name||"").localeCompare(b.name||""));
    renderStudentPicker();
  } catch (err) {
    document.getElementById("examTitle").textContent = "تعذر فتح الامتحان";
    showError("تعذر تحميل الامتحان. تأكد من الرابط والإنترنت وحاول تاني.");
  }
}

function renderStudentPicker() {
  const content = document.getElementById("content");
  content.innerHTML = `
    <div class="card">
      <label>اكتب اسمك للبحث</label>
      <input type="text" id="studentSearchInput" placeholder="اكتب أول كام حرف من اسمك" autocomplete="off">
      <div class="student-suggestions" id="studentSuggestions"></div>
    </div>
    <div class="card" id="pinCard" style="display:none;">
      <label id="pinLabel"></label>
      <input type="text" id="pinInput" placeholder="4 أرقام" maxlength="4" inputmode="numeric">
      <p id="pinMsg" style="font-size:0.82rem; margin:0.5rem 0 0; display:none;"></p>
    </div>
    <div id="alreadySubmittedMsg"></div>
    <button id="startBtn" disabled>ابدأ الامتحان</button>
  `;
  const searchInput = document.getElementById("studentSearchInput");
  const suggestionsBox = document.getElementById("studentSuggestions");
  const startBtn = document.getElementById("startBtn");
  const msgBox = document.getElementById("alreadySubmittedMsg");
  const pinCard = document.getElementById("pinCard");
  const pinLabel = document.getElementById("pinLabel");
  const pinInput = document.getElementById("pinInput");
  const pinMsg = document.getElementById("pinMsg");

  let pinVerified = false;

  function resetStart() {
    msgBox.innerHTML = "";
    startBtn.disabled = true;
    startBtn.textContent = "ابدأ الامتحان";
  }

  function resetPin() {
    pinVerified = false;
    pinCard.style.display = "none";
    pinInput.value = "";
    pinMsg.style.display = "none";
  }

  function hideSuggestions() {
    suggestionsBox.style.display = "none";
    suggestionsBox.innerHTML = "";
  }

  async function onStudentChosen() {
    hideSuggestions();
    resetStart();
    resetPin();
    if (!selectedStudent) return;
    pinLabel.textContent = "اكتب الرمز السري بتاعك (4 أرقام)";
    pinCard.style.display = "block";
    pinInput.focus();
  }

  searchInput.addEventListener("input", () => {
    if (selectedStudent) {
      selectedStudent = null;
      resetStart();
      resetPin();
    }
    const q = searchInput.value.trim();
    if (q.length < 2) { hideSuggestions(); return; }
    const normQ = normalizeArabic(q.toLowerCase());
    const matches = studentsInStage.filter(s => normalizeArabic((s.name || "").toLowerCase()).includes(normQ)).slice(0, 6);
    if (matches.length === 0) {
      suggestionsBox.innerHTML = `<div class="student-suggestion-empty">مفيش اسم متطابق. تأكد من كتابة اسمك صح.</div>`;
      suggestionsBox.style.display = "block";
      return;
    }
    suggestionsBox.innerHTML = matches.map(s => `<button type="button" class="student-suggestion-item" data-id="${s.id}">${escapeHtml(s.name)}</button>`).join("");
    suggestionsBox.style.display = "block";
    suggestionsBox.querySelectorAll(".student-suggestion-item").forEach(btn => {
      btn.addEventListener("click", () => {
        const chosen = studentsInStage.find(s => s.id === btn.dataset.id) || null;
        selectedStudent = chosen;
        searchInput.value = chosen ? chosen.name : "";
        onStudentChosen();
      });
    });
  });

  async function checkAlreadySubmitted() {
    startBtn.disabled = true;
    startBtn.textContent = "جاري التحقق...";
    try {
      let snapDoc = null;
      if (selectedStudent.id) {
        const snap = await db.collection("examResults")
          .where("examId", "==", exam.id)
          .where("studentId", "==", selectedStudent.id)
          .limit(1)
          .get();
        if (!snap.empty) snapDoc = snap.docs[0];
      } else {
        const snap = await db.collection("examResults")
          .where("examId", "==", exam.id)
          .get();
        const targetNorm = normalizeArabic(selectedStudent.name);
        const match = snap.docs.find(d => normalizeArabic(d.data().studentName) === targetNorm);
        if (match) snapDoc = match;
      }
      if (snapDoc) {
        const prev = snapDoc.data();
        const pct = prev.total > 0 ? Math.round((prev.score / prev.total) * 100) : 0;
        msgBox.innerHTML = `<div class="card" style="border-right:4px solid #C15B3C;">
          <strong>لقد قدّمت هذا الامتحان من قبل</strong>
          <p style="margin:0.4rem 0 0.7rem; color:#6B6B60; font-size:0.88rem;">نتيجتك السابقة: ${prev.score} / ${prev.total} (${pct}%)</p>
          <button id="reviewPrevBtn" style="background:#3F6B4A; color:#F5F1E6;">مراجعة إجاباتك</button>
        </div>`;
        document.getElementById("reviewPrevBtn").addEventListener("click", () => {
          renderResult(prev.score, prev.total, prev.answers || [], false);
        });
        startBtn.disabled = true;
        startBtn.textContent = "لا يمكنك إعادة الامتحان";
      } else {
        startBtn.disabled = false;
        startBtn.textContent = "ابدأ الامتحان";
      }
    } catch (err) {
      showError("تعذر التحقق من محاولاتك السابقة. تأكد من اتصالك بالإنترنت.");
      startBtn.disabled = true;
      startBtn.textContent = "ابدأ الامتحان";
    }
  }

  pinInput.addEventListener("input", async () => {
    const typed = pinInput.value.replace(/\D/g, "");
    pinInput.value = typed;
    if (typed.length < 4 || !selectedStudent) {
      pinMsg.style.display = "none";
      startBtn.disabled = true;
      return;
    }
    startBtn.disabled = true;
    startBtn.textContent = "جاري التحقق...";
    try {
      const res = await fetch(`${STUDENT_AUTH_WORKER_URL}/student-login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ examId: exam.id, studentId: selectedStudent.id, pin: typed })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok || !data.customToken) {
        throw new Error(data.error || "invalid_pin");
      }
      await auth.signInWithCustomToken(data.customToken);
      selectedStudent = { ...selectedStudent, ...(data.student || {}) };
      pinMsg.textContent = "✓ تم التأكيد";
      pinMsg.style.color = "#3F6B4A";
      pinMsg.style.display = "block";
      await checkAlreadySubmitted();
    } catch (err) {
      pinMsg.textContent = err.message === "invalid_pin" ? "الرمز غير صحيح." : "تعذر التحقق. حاول تاني.";
      pinMsg.style.color = "#C15B3C";
      pinMsg.style.display = "block";
      startBtn.disabled = true;
      startBtn.textContent = "ابدأ الامتحان";
    }
  });

  startBtn.addEventListener("click", renderExam);
}

let answers = {};
let examTimerInterval = null;

function getTimerStorageKey() {
  const studentKey = selectedStudent.id || normalizeArabic(selectedStudent.name);
  return "examTimerStart_" + exam.id + "_" + studentKey;
}

async function renderExam() {
  try {
    if (!auth.currentUser || auth.currentUser.isAnonymous) throw new Error("not_authenticated");
    const doc = await db.collection("exams").doc(exam.id).get();
    if (!doc.exists) throw new Error("exam_missing");
    exam = { id: doc.id, ...doc.data() };
  } catch (e) {
    showError("تعذر فتح أسئلة الامتحان. حاول تسجيل الدخول بالرمز مرة أخرى.");
    return;
  }
  answers = {};
  const content = document.getElementById("content");
  const questions = exam.questions || [];

  const timerHtml = exam.timeLimitMinutes
    ? `<div class="timer-bar" id="timerBar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D4A93B" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span>الوقت المتبقي:</span> <span class="timer-value" id="timerValue">--:--</span>
      </div>`
    : "";

  content.innerHTML = `
    ${timerHtml}
    <div class="card" style="margin-bottom:0.5rem;">
      <strong>${escapeHtml(selectedStudent.name)}</strong>
    </div>
    ${questions.map((q, i) => renderQuestion(q, i)).join("")}
    <button id="submitBtn">تسليم الإجابات</button>
  `;

  questions.forEach((q, i) => {
    if (q.type === "mcq") {
      document.querySelectorAll(`.option-row[data-qidx="${i}"]`).forEach(row => {
        row.addEventListener("click", () => {
          document.querySelectorAll(`.option-row[data-qidx="${i}"]`).forEach(r => r.classList.remove("selected"));
          row.classList.add("selected");
          row.querySelector('input').checked = true;
          answers[i] = parseInt(row.dataset.optIdx, 10);
        });
      });
    } else {
      const input = document.getElementById(`answer_${i}`);
      if (input) input.addEventListener("input", () => { answers[i] = input.value; });
    }
  });

  document.getElementById("submitBtn").addEventListener("click", () => submitExam(false));

  if (exam.timeLimitMinutes) {
    startExamTimer();
  }
}

function startExamTimer() {
  const key = getTimerStorageKey();
  let startTime;
  try {
    startTime = parseInt(localStorage.getItem(key) || "0", 10);
  } catch (e) { startTime = 0; }
  if (!startTime) {
    startTime = Date.now();
    try { localStorage.setItem(key, String(startTime)); } catch (e) {}
  }
  const totalMs = exam.timeLimitMinutes * 60 * 1000;

  function tick() {
    const remaining = startTime + totalMs - Date.now();
    const timerValue = document.getElementById("timerValue");
    const timerBar = document.getElementById("timerBar");
    if (!timerValue) { clearInterval(examTimerInterval); return; }
    if (remaining <= 0) {
      timerValue.textContent = "00:00";
      clearInterval(examTimerInterval);
      submitExam(true);
      return;
    }
    const mins = Math.floor(remaining / 60000);
    const secs = Math.floor((remaining % 60000) / 1000);
    timerValue.textContent = String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0");
    if (remaining <= 60000 && timerBar) timerBar.classList.add("timer-warning");
  }
  tick();
  examTimerInterval = setInterval(tick, 1000);
}

function renderQuestion(q, i) {
  const passageHtml = q.passage ? `<div class="passage">${escapeHtml(q.passage)}</div>` : "";
  let bodyHtml = "";
  if (q.type === "mcq") {
    bodyHtml = (q.options || []).map((opt, oi) => `
      <div class="option-row" data-qidx="${i}" data-opt-idx="${oi}">
        <input type="radio" name="q${i}">
        <span>${escapeHtml(opt)}</span>
      </div>`).join("");
  } else {
    const placeholders = {
      complete: "اكتب إجابتك هنا",
      rewrite: "أعد كتابة الجملة هنا",
      correct: "اكتب الجملة بعد التصحيح هنا",
    };
    bodyHtml = `<input type="text" id="answer_${i}" dir="auto" placeholder="${placeholders[q.type] || placeholders.complete}">`;
  }
  return `
    <div class="card">
      <div class="q-num">سؤال ${i + 1} من ${(exam.questions||[]).length}</div>
      ${passageHtml}
      <div class="q-title">${escapeHtml(q.prompt)}</div>
      ${bodyHtml}
    </div>`;
}

function normalizeExactText(str) {
  // Rewrite / Correct: exact match after ignoring ONLY case and the requested punctuation.
  // Ignored: . ? , _ apostrophe (straight/curly). Whitespace and all other characters remain significant.
  return (str ?? "")
    .toLocaleLowerCase("en-US")
    .replace(/[.?,_\'’؟،]/g, "");
}

function normalizeLooseText(str) {
  return (str || "")
    .toLowerCase()
    .replace(/[.,!?;:'"()،؛؟]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function gradeExam() {
  const questions = exam.questions || [];
  let score = 0;
  let total = 0;
  const answerDetails = [];
  questions.forEach((q, i) => {
    const points = q.points || 1;
    total += points;
    let correct = false;
    const given = answers[i];
    if (q.type === "mcq") {
      correct = given === q.correctIndex;
    } else if (q.type === "rewrite" || q.type === "correct") {
      // For Rewrite/Correct, the teacher requested a true 100% match,
      // with only case and the specified punctuation ignored.
      const givenNorm = normalizeExactText(given);
      const accepted = (q.correctAnswers || []).map(a => normalizeExactText(a));
      correct = accepted.includes(givenNorm);
    } else {
      // Preserve the previous behavior for other non-MCQ question types.
      const givenNorm = normalizeLooseText(given);
      const accepted = (q.correctAnswers || []).map(a => normalizeLooseText(a));
      correct = accepted.includes(givenNorm);
    }
    if (correct) score += points;
    answerDetails.push({ questionIndex: i, given: given ?? null, correct });
  });
  return { score, total, answerDetails };
}

async function submitExam(isTimeout) {
  if (examTimerInterval) { clearInterval(examTimerInterval); examTimerInterval = null; }
  const submitBtn = document.getElementById("submitBtn");
  if (submitBtn) {
    submitBtn.disabled = true;
    submitBtn.textContent = isTimeout ? "انتهى الوقت، جاري التسليم..." : "جاري التسليم...";
  }
  const { answerDetails } = gradeExam();
  try {
    if (!auth.currentUser || auth.currentUser.isAnonymous || !selectedStudent?.id) throw new Error("not_authenticated");
    const res = await fetch(`${STUDENT_AUTH_WORKER_URL}/submit-result`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${await auth.currentUser.getIdToken()}`
      },
      body: JSON.stringify({
        examId: exam.id,
        answers: answerDetails.map(a => ({ questionIndex: a.questionIndex, given: a.given })),
        timedOut: !!isTimeout
      })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) throw new Error(data.error || "submit_failed");
    try { localStorage.removeItem(getTimerStorageKey()); } catch (e) {}
    renderResult(data.score, data.total, data.answerDetails || answerDetails, true, isTimeout);
  } catch (err) {
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.textContent = "تسليم الإجابات";
    }
    showError("تعذر تسليم الإجابات. تأكد من اتصالك بالإنترنت وحاول تاني.");
  }
}

function renderResult(score, total, answerDetails, isFreshSubmission = true, wasTimedOut = false) {
  const pct = total > 0 ? Math.round((score / total) * 100) : 0;
  const content = document.getElementById("content");
  const questions = exam.questions || [];

  const reviewHtml = answerDetails.map(ad => {
    const q = questions[ad.questionIndex];
    if (!q) return "";
    const passageHtml = q.passage ? `<div class="passage">${escapeHtml(q.passage)}</div>` : "";
    let givenText = "";
    let correctText = "";
    if (q.type === "mcq") {
      const opts = q.options || [];
      givenText = (typeof ad.given === "number" && opts[ad.given] !== undefined) ? opts[ad.given] : "(لم يُجب)";
      correctText = opts[q.correctIndex] !== undefined ? opts[q.correctIndex] : "";
    } else {
      givenText = ad.given ? ad.given : "(لم يُجب)";
      correctText = (q.correctAnswers && q.correctAnswers[0]) || "";
    }
    const explainId = `explain_${ad.questionIndex}`;
    const payload = {
      type: q.type,
      passage: q.passage || "",
      prompt: q.prompt || "",
      options: q.type === "mcq" ? (q.options || []) : [],
      correctAnswer: correctText,
      studentAnswer: givenText === "(لم يُجب)" ? "" : givenText,
    };
    const payloadAttr = escapeHtml(JSON.stringify(payload));
    return `
      <div class="card review-card ${ad.correct ? 'review-correct' : 'review-wrong'}">
        <div class="q-num">سؤال ${ad.questionIndex + 1}</div>
        ${passageHtml}
        <div class="q-title">${escapeHtml(q.prompt)}</div>
        <div class="review-row">
          <span class="review-icon">${ad.correct ? '✓' : '✗'}</span>
          <span class="review-label">إجابتك:</span>
          <span class="review-value">${escapeHtml(givenText)}</span>
        </div>
        ${!ad.correct ? `
        <div class="review-row">
          <span class="review-icon" style="visibility:hidden;">✓</span>
          <span class="review-label">الإجابة الصحيحة:</span>
          <span class="review-value review-correct-text">${escapeHtml(correctText)}</span>
        </div>` : ""}
        <div class="explain-actions">
          <button class="explain-btn" id="${explainId}_explainBtn" data-payload="${payloadAttr}" onclick="requestExplain('${explainId}', 'explain', this)">💡 اشرحلي السبب</button>
          <button class="explain-btn" id="${explainId}_translateBtn" data-payload="${payloadAttr}" onclick="requestExplain('${explainId}', 'translate', this)">🌐 ترجملي السؤال</button>
        </div>
        <div class="explain-box" id="${explainId}_box" style="display:none;"></div>
      </div>`;
  }).join("");

  const subMessage = !isFreshSubmission
    ? "مراجعة إجابتك السابقة."
    : (wasTimedOut ? "انتهى وقت الامتحان، وتم تسليم إجاباتك تلقائيًا." : "تم إرسال نتيجتك للمدرّس بنجاح.");

  content.innerHTML = `
    <div class="card">
      <div class="result-label">نتيجتك</div>
      <div class="result-score">${score} / ${total}</div>
      <div class="result-label">(${pct}%)</div>
    </div>
    <p style="color:#9FB8AD; text-align:center; font-size:0.85rem; margin-bottom:1rem;">${subMessage}</p>
    ${reviewHtml}
  `;
}

async function requestExplain(explainId, action, btnEl) {
  const box = document.getElementById(`${explainId}_box`);
  const explainBtn = document.getElementById(`${explainId}_explainBtn`);
  const translateBtn = document.getElementById(`${explainId}_translateBtn`);
  if (!box || !btnEl) return;

  const payload = JSON.parse(btnEl.getAttribute("data-payload"));
  payload.action = action;

  explainBtn.disabled = true;
  translateBtn.disabled = true;
  const originalText = btnEl.textContent;
  btnEl.textContent = "جاري التحميل...";
  box.style.display = "block";
  box.textContent = "";

  try {
    const res = await fetch(AI_EXPLAIN_WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await res.json().catch(() => null);
    if (!res.ok || !data || !data.text) {
      box.textContent = "معلش، حصلت مشكلة وإحنا بنجيب الشرح. جربي تاني كمان شوية.";
    } else {
      box.textContent = data.text;
    }
  } catch (err) {
    box.textContent = "معلش، حصلت مشكلة في الاتصال. جربي تاني كمان شوية.";
  } finally {
    explainBtn.disabled = false;
    translateBtn.disabled = false;
    btnEl.textContent = originalText;
  }
}

init();
</script>
