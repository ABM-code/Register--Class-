<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#16302B">
<title>امتحان</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --accent: #D4A93B; --accent-rgb: 212,169,59;
    --c-page: #16302B; --c-card: #F5F1E6; --c-cardalt: #EAEAE4; --c-field: #FFFDF8; --c-soft: #EFF5F0;
    --c-text: #1B2420; --c-muted: #6B6B60; --c-onpage: #F5F1E6; --c-mutedonpage: #9FB8AD;
    --c-success: #3F6B4A; --c-successbg: #E4EEE5; --c-successsolid: #5E9468;
    --c-danger: #C15B3C; --c-dangertext: #9C4B32; --c-dangerbg: #F6E7E2;
    --c-warnbg: #FBF0DE; --c-warntext: #8A6A1F; --c-warnsolid: #C99A2B;
  }
  @property --p { syntax: '<number>'; inherits: false; initial-value: 0; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: var(--c-page); color: var(--c-text); min-height: 100vh; }
  h1 { font-family: 'Fraunces', serif; color: var(--c-onpage); font-size: 1.4rem; margin: 0 0 0.3rem; }
  p.sub { color: var(--c-mutedonpage); font-size: 0.88rem; margin: 0 0 1.5rem; }
  .ic { width: 1.15em; height: 1.15em; vertical-align: -0.2em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; pointer-events: none; }
  .card { background: var(--c-card); border-radius: 16px; padding: 1.25rem; margin-bottom: 1rem; box-shadow: 0 8px 24px rgba(0,0,0,0.18); }
  label { display: block; font-size: 0.82rem; color: var(--c-muted); margin-bottom: 0.4rem; font-weight: 500; }
  select, input[type=text], input[type=email], input[type=password], textarea { width: 100%; padding: 0.65rem 0.8rem; border-radius: 10px; border: 1px solid rgba(0,0,0,0.15); background: var(--c-field); font-size: 0.95rem; color: var(--c-text); font-family: inherit; transition: border-color 0.15s ease, box-shadow 0.15s ease; }
  select:focus, input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),0.18); }
  button, .btn-primary { font-family: inherit; background: var(--accent); color: var(--c-text); border: none; border-radius: 12px; padding: 0.75rem 1.2rem; font-weight: 700; font-size: 0.95rem; cursor: pointer; width: 100%; transition: filter 0.15s ease, transform 0.08s ease; box-shadow: 0 3px 10px rgba(var(--accent-rgb),0.3); }
  .btn-primary { display: flex; align-items: center; justify-content: center; gap: 0.45rem; text-decoration: none; }
  button:hover:not(:disabled), .btn-primary:hover { filter: brightness(1.05); }
  button:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
  button:active:not(:disabled) { transform: scale(0.98); }
  button:focus-visible, .btn-primary:focus-visible, .page-link:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-green { background: var(--c-success); color: var(--c-card); box-shadow: none; }
  .link-btn { display: flex; align-items: center; justify-content: center; gap: 0.4rem; background: none; box-shadow: none; color: var(--c-mutedonpage); font-weight: 600; font-size: 0.85rem; padding: 0.5rem; }
  .page-link { display: flex; align-items: center; justify-content: center; gap: 0.45rem; color: var(--c-onpage); font-size: 0.9rem; text-decoration: none; padding: 0.6rem; margin-top: 0.4rem; }
  #errorBox { display: none; align-items: flex-start; gap: 0.5rem; background: var(--c-dangerbg); color: var(--c-dangertext); padding: 0.65rem 0.9rem; border-radius: 10px; font-size: 0.88rem; margin-bottom: 1rem; }
  .empty-state { display: flex; flex-direction: column; align-items: center; gap: 0.6rem; text-align: center; padding: 2rem 1.25rem; color: var(--c-muted); }
  .empty-state > .ic { box-sizing: content-box; width: 1.9rem; height: 1.9rem; padding: 0.8rem; stroke-width: 1.5; background: rgba(0,0,0,0.06); border-radius: 50%; }
  .empty-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.05rem; color: var(--c-text); }
  .empty-state p { margin: 0 0 0.4rem; font-size: 0.88rem; line-height: 1.7; }
  .spinner { width: 1.1rem; height: 1.1rem; border-radius: 50%; border: 2px solid rgba(159,184,173,0.35); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading { display: flex; align-items: center; justify-content: center; gap: 0.6rem; color: var(--c-mutedonpage); padding: 2rem 0; }
  .student-suggestions { margin-top: 0.4rem; border-radius: 10px; overflow: hidden; display: none; box-shadow: 0 4px 14px rgba(0,0,0,0.12); }
  .student-suggestion-item { display: block; width: 100%; text-align: right; background: var(--c-field); color: var(--c-text); border: 1px solid rgba(0,0,0,0.12); border-top: none; padding: 0.7rem 0.8rem; font-size: 0.92rem; font-weight: 500; cursor: pointer; border-radius: 0; box-shadow: none; transition: background 0.12s ease; }
  .student-suggestion-item:first-child { border-top: 1px solid rgba(0,0,0,0.12); border-radius: 10px 10px 0 0; }
  .student-suggestion-item:last-child { border-radius: 0 0 10px 10px; }
  .student-suggestion-item:hover, .student-suggestion-item:active { background: var(--c-warnbg); filter: none; }
  .student-suggestion-empty { padding: 0.65rem 0.8rem; font-size: 0.85rem; color: var(--c-dangertext); background: var(--c-dangerbg); border-radius: 10px; }
  @media (pointer: coarse) { select, input[type=text], input[type=email], input[type=password], textarea { font-size: 16px; } }
  @media (prefers-reduced-motion: reduce) { .spinner, .score-ring.animate { animation: none; } .exam-progress-fill { transition: none; } }
  .wrap { max-width: 640px; margin: 0 auto; padding: 1.75rem 1.25rem 3rem; }
  textarea { resize: vertical; }
  .who { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; padding: 0.9rem 1.25rem; }
  .who .ic { color: var(--c-muted); }
  .exam-bar { position: sticky; top: 0; z-index: 50; background: var(--c-page); border-bottom: 1px solid rgba(245,241,230,0.15); padding: 0.6rem 1.25rem 0.7rem; margin: 0 -1.25rem 1.25rem; }
  .exam-bar-top { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; color: var(--c-mutedonpage); font-size: 0.82rem; margin-bottom: 0.4rem; min-height: 1.5rem; }
  .timer-chip { display: inline-flex; align-items: center; gap: 0.4rem; }
  .timer-chip .ic { color: var(--accent); }
  .timer-value { font-family: 'Fraunces', serif; font-weight: 700; font-size: 1.05rem; color: var(--accent); }
  .timer-chip.timer-warning .timer-value, .timer-chip.timer-warning .ic { color: var(--c-danger); }
  .exam-progress-track { height: 8px; border-radius: 8px; background: rgba(159,184,173,0.25); overflow: hidden; }
  .exam-progress-fill { height: 100%; width: 0; border-radius: 8px; background: var(--accent); transition: width 0.25s ease; }
  .restored { display: flex; align-items: center; gap: 0.5rem; background: var(--c-soft); padding: 0.6rem 0.9rem; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--c-success); }
  .note-card { border-right: 4px solid transparent; }
  .note-card.ok { border-right-color: var(--c-success); } .note-card.bad { border-right-color: var(--c-danger); }
  .note-card strong { display: flex; align-items: center; gap: 0.45rem; }
  .note-card p { margin: 0.4rem 0 0.7rem; color: var(--c-muted); font-size: 0.88rem; }
  .q-card { border-right: 4px solid transparent; transition: border-color 0.2s ease; }
  .q-card.answered { border-right-color: var(--accent); }
  .q-head { display: flex; align-items: flex-start; gap: 0.65rem; margin-bottom: 0.8rem; }
  .q-num { min-width: 1.9rem; height: 1.9rem; border-radius: 50%; display: grid; place-items: center; font-size: 0.85rem; font-weight: 700; background: rgba(0,0,0,0.07); transition: background 0.2s ease; }
  .q-card.answered .q-num { background: var(--accent); }
  .q-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1rem; line-height: 1.55; margin-top: 0.15rem; unicode-bidi: plaintext; text-align: start; }
  .passage { background: var(--c-cardalt); border-radius: 10px; padding: 0.8rem 1rem; margin-bottom: 0.8rem; font-size: 0.9rem; line-height: 1.7; color: #3a3a34; white-space: pre-wrap; unicode-bidi: plaintext; text-align: start; }
  .option-row { display: flex; align-items: center; gap: 0.7rem; min-height: 48px; padding: 0.65rem 0.85rem; border: 1px solid rgba(0,0,0,0.12); border-radius: 12px; margin-bottom: 0.5rem; cursor: pointer; background: var(--c-field); transition: border-color 0.15s ease, background 0.15s ease; }
  .option-row:hover { border-color: rgba(var(--accent-rgb),0.5); }
  .option-row:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
  .option-row span { unicode-bidi: plaintext; text-align: start; flex: 1; }
  .option-row input { accent-color: var(--c-success); width: 1.05rem; height: 1.05rem; margin: 0; flex-shrink: 0; }
  .option-row.selected { border-color: var(--accent); background: var(--c-warnbg); box-shadow: inset 0 0 0 1px var(--accent); }
  .submit-hint { display: flex; align-items: center; justify-content: center; gap: 0.4rem; color: var(--c-mutedonpage); font-size: 0.84rem; margin: 0.4rem 0 0.7rem; }
  .submit-hint.pending { color: var(--accent); }
  #submitBtn { padding: 0.85rem; }
  .result-card { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; padding: 1.6rem 1.25rem; }
  .score-ring { --tier: var(--c-success); width: 132px; height: 132px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--tier) calc(var(--p) * 1%), rgba(0,0,0,0.08) 0); }
  .score-ring.mid { --tier: var(--c-warnsolid); } .score-ring.low { --tier: var(--c-danger); }
  .score-ring.animate { animation: ringFill 1s ease-out both; }
  @keyframes ringFill { from { --p: 0; } }
  .score-ring-inner { width: 100px; height: 100px; border-radius: 50%; background: var(--c-card); display: grid; place-items: center; }
  .score-pct { font-family: 'Fraunces', serif; font-size: 1.7rem; font-weight: 700; }
  .result-score { font-family: 'Fraunces', serif; font-size: 1.15rem; font-weight: 600; color: var(--c-muted); text-align: center; margin: 0; }
  .tier-chip { font-weight: 600; font-size: 0.86rem; padding: 0.3rem 0.9rem; border-radius: 999px; background: var(--c-successbg); color: var(--c-success); }
  .tier-chip.mid { background: var(--c-warnbg); color: var(--c-warntext); } .tier-chip.low { background: var(--c-dangerbg); color: var(--c-dangertext); }
  .result-counts { display: flex; gap: 0.6rem; margin-top: 0.3rem; }
  .mini { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.82rem; font-weight: 600; padding: 0.2rem 0.65rem; border-radius: 999px; }
  .mini.ok { background: var(--c-successbg); color: var(--c-success); } .mini.bad { background: var(--c-dangerbg); color: var(--c-dangertext); }
  .result-msg { color: var(--c-mutedonpage); text-align: center; font-size: 0.85rem; margin: 0 0 1rem; }
  .review-correct { border-right-color: var(--c-successsolid); }
  .review-wrong { border-right-color: var(--c-danger); }
  .review-row { display: flex; align-items: flex-start; gap: 0.45rem; font-size: 0.88rem; margin-top: 0.4rem; flex-wrap: wrap; }
  .review-row.ok .ic { color: var(--c-success); } .review-row.bad .ic { color: var(--c-danger); }
  .review-label { color: var(--c-muted); }
  .review-value { color: var(--c-text); font-weight: 600; unicode-bidi: plaintext; }
  .review-correct-text { color: var(--c-success); }
  .explain-actions { display: flex; gap: 0.5rem; margin-top: 0.7rem; flex-wrap: wrap; }
  .explain-btn { background: none; border: 1px solid rgba(0,0,0,0.15); color: #4A5A50; border-radius: 9px; padding: 0.45rem 0.75rem; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 0.35rem; width: auto; box-shadow: none; transition: background 0.15s ease, border-color 0.15s ease; }
  .explain-btn:hover { background: rgba(0,0,0,0.04); border-color: rgba(0,0,0,0.25); filter: none; }
  .explain-btn[disabled] { opacity: 0.5; cursor: default; }
  .explain-box { margin-top: 0.6rem; background: var(--c-soft); border-radius: 10px; padding: 0.7rem 0.85rem; font-size: 0.85rem; line-height: 1.6; color: #3a3a34; unicode-bidi: plaintext; text-align: start; }
</style>
</head>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script>
const TEACHER_NAME = "أ/ عبد الرحمن منير";
// إعدادات هوية المعلم — حدّثها يدويًا كل ما تغيّرها من لوحة "الهوية" في التطبيق الرئيسي
// إعدادات هوية المعلم — دي قيم افتراضية احتياطية (fallback) لو الـ Worker مرجعش هوية،
// وبتتحدّث تلقائيًا من رد /student-exam (حقل teacherBrand) لو موجود.
let TEACHER_CENTER_NAME = "";
let TEACHER_BRAND_COLOR = "#D4A93B";
let TEACHER_FOOTER_TEXT = "";
let TEACHER_DISPLAY_LINE = TEACHER_CENTER_NAME ? (TEACHER_CENTER_NAME + " — " + TEACHER_NAME) : TEACHER_NAME;

function hexToRgbTriplet(hex) {
  const c = (hex || "").replace("#", "");
  if (c.length !== 6) return "212,169,59";
  const r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
  return `${r},${g},${b}`;
}
function applyBrandColor(color) {
  if (!color) return;
  document.documentElement.style.setProperty("--accent", color);
  document.documentElement.style.setProperty("--accent-rgb", hexToRgbTriplet(color));
}
applyBrandColor(TEACHER_BRAND_COLOR);
function renderBrandFooter() {
  const el = document.getElementById("brandFooterText");
  if (!el) return;
  if (TEACHER_FOOTER_TEXT) { el.textContent = TEACHER_FOOTER_TEXT; el.style.display = "block"; }
  else { el.style.display = "none"; }
}
renderBrandFooter();

// بتاخد حقل teacherBrand من رد الـ Worker (لو موجود) وتستبدل بيه القيم الاحتياطية،
// بعدين تعيد تطبيق اللون والفوتر. لو teacherBrand مش موجود أو فاضي، بتسيب القيم الاحتياطية زي ما هي.
function applyTeacherBrandFromServer(brand) {
  if (!brand) return;
  if (brand.centerName) TEACHER_CENTER_NAME = brand.centerName;
  if (brand.brandColor) TEACHER_BRAND_COLOR = brand.brandColor;
  if (brand.footerText) TEACHER_FOOTER_TEXT = brand.footerText;
  TEACHER_DISPLAY_LINE = TEACHER_CENTER_NAME ? (TEACHER_CENTER_NAME + " — " + TEACHER_NAME) : TEACHER_NAME;
  applyBrandColor(TEACHER_BRAND_COLOR);
  renderBrandFooter();
}

const STUDENT_AUTH_WORKER_URL = "https://register-class-auth.abm319.workers.dev";
const AI_EXPLAIN_WORKER_URL = "https://register-class.abm319.workers.dev/explain";
const firebaseConfig = {
  apiKey: "AIzaSyBcWhyLvCSnpyLSLWw9rHVSvODYgK67Wh0",
  authDomain: "register-class-302e6.firebaseapp.com",
  projectId: "register-class-302e6",
  storageBucket: "register-class-302e6.firebasestorage.app",
  messagingSenderId: "230991294181",
  appId: "1:230991294181:web:167cb0a370c68b6a6f6e0c"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function normalizeArabic(str) {
  if (!str) return "";
  return String(str)
    .replace(/[إأآا]/g, "ا")
    .replace(/ى/g, "ي")
    .replace(/ة/g, "ه")
    .replace(/\s+/g, "")
    .toLowerCase();
}
function icon(name) { return '<svg class="ic" aria-hidden="true"><use href="#i-' + name + '"/></svg>'; }
function tierOf(pct) { return pct >= 85 ? "high" : pct >= 50 ? "mid" : "low"; }
function showError(msg) {
  const box = document.getElementById("errorBox");
  box.innerHTML = icon("alert") + "<span></span>";
  box.lastChild.textContent = msg;
  box.style.display = "flex";
}

const params = new URLSearchParams(window.location.search);
const examId = params.get("examId");
let exam = null;
let studentsInStage = [];
let selectedStudent = null;

async function init() {
  if (!examId) {
    document.getElementById("examTitle").textContent = "رابط غير صالح";
    document.getElementById("content").innerHTML = "";
    showError("مفيش امتحان محدد في الرابط ده.");
    return;
  }
  try {
    const res = await fetch(`${STUDENT_AUTH_WORKER_URL}/student-exam?examId=${encodeURIComponent(examId)}`);
    const data = await res.json().catch(() => ({}));
    if (!res.ok && data.error === "exam_closed") {
      document.getElementById("examTitle").textContent = data.title || "الامتحان مقفول";
      document.getElementById("content").innerHTML = `<div class="card empty-state">${icon("lock")}
        <div class="empty-title">الامتحان ده مقفول دلوقتي ومحدش يقدر يفتحه.</div>
        <p>كلّم المعلم لو محتاج تفتحه تاني.</p>
      </div>`;
      return;
    }
    if (!res.ok && data.error === "exam_paid") {
      document.getElementById("examTitle").textContent = data.title || "امتحان مدفوع";
      document.getElementById("content").innerHTML = `<div class="card empty-state">${icon("banknote")}
        <div class="empty-title">الامتحان ده متاح فقط لمن اشترى كود الوصول الخاص بيه.</div>
        <p>لو معاك كود وصول، افتحه من صفحة تفعيل الكود.</p>
        <a href="redeem.html" class="btn-primary">${icon("key")} تفعيل كود</a>
      </div>`;
      return;
    }
    if (!res.ok) throw new Error("exam_lookup_failed");
    if (!data.ok) throw new Error(data.error || "exam_lookup_failed");
    applyTeacherBrandFromServer(data.teacherBrand);
    exam = { id: examId, title: data.title || "امتحان", stage: data.stage || "" };
    document.getElementById("examTitle").textContent = exam.title;
    document.getElementById("examSub").textContent = (exam.stage || "") + " — " + TEACHER_DISPLAY_LINE;
    studentsInStage = (data.students || []).sort((a,b) => (a.name||"").localeCompare(b.name||""));
    renderStudentPicker();
  } catch (err) {
    document.getElementById("examTitle").textContent = "تعذر فتح الامتحان";
    document.getElementById("content").innerHTML = "";
    showError("تعذر تحميل الامتحان. تأكد من الرابط والإنترنت وحاول تاني.");
  }
}

function renderStudentPicker() {
  const content = document.getElementById("content");

      <label>اكتب اسمك للبحث</label>
      <input type="text" id="studentSearchInput" placeholder="اكتب أول كام حرف من اسمك" autocomplete="off">

  const searchInput = document.getElementById("studentSearchInput");

  let pinVerified = false;

  function resetStart() {

    startBtn.disabled = true;

  function resetPin() {

          .where("studentId", "==", selectedStudent.id)
          .limit(1)

      } else {

          .where("examId", "==", exam.id)

let answers = {};
let examTimerInterval = null;

function getTimerStorageKey() {
  const studentKey = selectedStudent.id || normalizeArabic(selectedStudent.name);
  return "examTimerStart_" + exam.id + "_" + studentKey;
}

function getAnswersStorageKey() {
  const studentKey = selectedStudent.id || normalizeArabic(selectedStudent.name);
  return "examAnswers_" + exam.id + "_" + studentKey;
}

function saveAnswersToStorage() {
  try { localStorage.setItem(getAnswersStorageKey(), JSON.stringify(answers)); } catch (e) { /* تجاهل لو التخزين مش متاح */ }
}

function loadAnswersFromStorage() {
  try {
    const raw = localStorage.getItem(getAnswersStorageKey());
    if (!raw) return {};
    const parsed = JSON.parse(raw);
    return (parsed && typeof parsed === "object") ? parsed : {};
  } catch (e) {
    return {};
  }
}

function isAnswered(i) {
  const v = answers[i];
  return typeof v === "number" || (typeof v === "string" && v.trim() !== "");
}
function updateExamProgress() {
  const qs = (exam && exam.questions) || [];
  const total = qs.length;
  let done = 0;
  qs.forEach((q, i) => {
    const ok = isAnswered(i);
    if (ok) done++;
    const card = document.getElementById("qcard_" + i);
    if (card) card.classList.toggle("answered", ok);
  });
  const left = total - done;
  const t = document.getElementById("examProgressText");
  if (t) t.textContent = `أجبت على ${done} من ${total}`;
  const f = document.getElementById("examProgressFill");
  if (f) f.style.width = (total ? (done / total) * 100 : 0) + "%";
  const h = document.getElementById("submitHint");
  if (h) {
    h.className = "submit-hint" + (left > 0 ? " pending" : "");
    h.innerHTML = left > 0
      ? `${icon("alert")} لسه ${left} ${left === 1 ? "سؤال" : "أسئلة"} من غير إجابة`
      : `${icon("check-circle")} جاوبت على كل الأسئلة، تقدر تسلّم`;
  }
}

async function renderExam() {
  try {
    if (!auth.currentUser || auth.currentUser.isAnonymous) throw new Error("not_authenticated");
    const doc = await db.collection("exams").doc(exam.id).get();
    if (!doc.exists) throw new Error("exam_missing");
    exam = { id: doc.id, ...doc.data() };
  } catch (e) {
    showError("تعذر فتح أسئلة الامتحان. حاول تسجيل الدخول بالرمز مرة أخرى.");
    return;
  }
  answers = loadAnswersFromStorage();
  const hasRestoredAnswers = Object.keys(answers).length > 0;
  const content = document.getElementById("content");
  const questions = exam.questions || [];

  const timerChip = exam.timeLimitMinutes
    ? `<span class="timer-chip" id="timerBar">${icon("clock")}<span>الوقت المتبقي:</span> <span class="timer-value" id="timerValue">--:--</span></span>`
    : `<span></span>`;
  const barHtml = `<div class="exam-bar">
      <div class="exam-bar-top">${timerChip}<span id="examProgressText"></span></div>
      <div class="exam-progress-track"><div class="exam-progress-fill" id="examProgressFill"></div></div>
    </div>`;

  const restoredNoticeHtml = hasRestoredAnswers
    ? `<div class="card restored">${icon("refresh")}<span>رجّعنالك إجاباتك اللي كتبتها قبل كده في نفس الامتحان.</span></div>`
    : "";

  content.innerHTML = `
    ${barHtml}
    <div class="card who">${icon("user")}<strong>${escapeHtml(selectedStudent.name)}</strong></div>
    ${restoredNoticeHtml}
    ${renderQuestionsHtml(questions)}
    <div class="submit-hint" id="submitHint"></div>
    <button id="submitBtn">تسليم الإجابات</button>
  `;

  questions.forEach((q, i) => {
    if (q.type === "mcq" || q.type === "translation_mcq") {
      document.querySelectorAll(`.option-row[data-qidx="${i}"]`).forEach(row => {
        if (answers[i] !== undefined && parseInt(row.dataset.optIdx, 10) === answers[i]) {
          row.classList.add("selected");
          row.querySelector('input').checked = true;
        }
        row.addEventListener("click", () => {
          document.querySelectorAll(`.option-row[data-qidx="${i}"]`).forEach(r => r.classList.remove("selected"));
          row.classList.add("selected");
          row.querySelector('input').checked = true;
          answers[i] = parseInt(row.dataset.optIdx, 10);
          saveAnswersToStorage();
          updateExamProgress();
        });
      });
    } else {
      const input = document.getElementById(`answer_${i}`);
      if (input) {
        if (answers[i] !== undefined) input.value = answers[i];
        input.addEventListener("input", () => { answers[i] = input.value; saveAnswersToStorage(); updateExamProgress(); });
      }
    }
  });

  document.getElementById("submitBtn").addEventListener("click", () => submitExam(false));
  updateExamProgress();

  if (exam.timeLimitMinutes) {
    startExamTimer();
  }
}

function startExamTimer() {
  const key = getTimerStorageKey();
  let startTime;
  try {
    startTime = parseInt(localStorage.getItem(key) || "0", 10);
  } catch (e) { startTime = 0; }
  if (!startTime) {
    startTime = Date.now();
    try { localStorage.setItem(key, String(startTime)); } catch (e) {}
  }
  const totalMs = exam.timeLimitMinutes * 60 * 1000;

  function tick() {
    const remaining = startTime + totalMs - Date.now();
    const timerValue = document.getElementById("timerValue");
    const timerBar = document.getElementById("timerBar");
    if (!timerValue) { clearInterval(examTimerInterval); return; }
    if (remaining <= 0) {
      timerValue.textContent = "00:00";
      clearInterval(examTimerInterval);
      submitExam(true);
      return;
    }
    const mins = Math.floor(remaining / 60000);
    const secs = Math.floor((remaining % 60000) / 1000);
    timerValue.textContent = String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0");
    if (remaining <= 60000 && timerBar) timerBar.classList.add("timer-warning");
  }
  tick();
  examTimerInterval = setInterval(tick, 1000);
}

function groupQuestionsByPassage(questions) {
  const groups = [];
  questions.forEach((q, i) => {
    const last = groups[groups.length - 1];
    if (last && q.passage && q.passage === last.passage) {
      last.items.push(i);
    } else {
      groups.push({ passage: q.passage || "", items: [i] });
    }
  });
  return groups;
}

function renderQuestionsHtml(questions) {
  const groups = groupQuestionsByPassage(questions);
  return groups.map(g => {
    const passageHtml = g.passage ? `<div class="passage">${escapeHtml(g.passage)}</div>` : "";
    const itemsHtml = g.items.map(i => renderQuestionBody(questions[i], i, questions.length)).join("");
    return passageHtml ? `<div class="card" style="padding-bottom:0.4rem;">${passageHtml}</div>${itemsHtml}` : itemsHtml;
  }).join("");
}

function renderQuestionBody(q, i, totalCount) {
  let bodyHtml = "";
  if (q.type === "mcq" || q.type === "translation_mcq") {
    bodyHtml = (q.options || []).map((opt, oi) => `
      <div class="option-row" data-qidx="${i}" data-opt-idx="${oi}">
        <input type="radio" name="q${i}">
        <span>${escapeHtml(opt)}</span>
      </div>`).join("");
  } else {
    const placeholders = {
      complete: "اكتب إجابتك هنا",
      rewrite: "أعد كتابة الجملة هنا",
      correct: "اكتب الجملة بعد التصحيح هنا",
      dialogue: "اكتب السطر الناقص هنا",
      essay: "اكتب إجابتك هنا",
    };
    const isLong = q.type === "essay";
    bodyHtml = isLong
      ? `<textarea id="answer_${i}" dir="auto" rows="4" placeholder="${placeholders.essay}"></textarea>`
      : `<input type="text" id="answer_${i}" dir="auto" placeholder="${placeholders[q.type] || placeholders.complete}">`;
  }
  return `
    <div class="card q-card" id="qcard_${i}">
      <div class="q-head"><span class="q-num">${i + 1}</span><div class="q-title">${escapeHtml(q.prompt)}</div></div>
      ${bodyHtml}
    </div>`;
}



function normalizeExactText(str) {
  // Rewrite / Correct: exact match after ignoring ONLY case and the requested punctuation.
  // Ignored: . ? , _ apostrophe (straight/curly). Whitespace and all other characters remain significant.
  return (str ?? "")
    .toLocaleLowerCase("en-US")
    .replace(/[.?,_\'’؟،]/g, "");
}

function normalizeLooseText(str) {
  return (str || "")
    .toLowerCase()
    .replace(/[.,!?;:'"()،؛؟]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function gradeExam() {
  const questions = exam.questions || [];
  let score = 0;
  let total = 0;
  const answerDetails = [];
  questions.forEach((q, i) => {
    const points = q.points || 1;
    total += points;
    let correct = false;
    const given = answers[i];
    if (q.type === "mcq" || q.type === "translation_mcq") {
      correct = given === q.correctIndex;
    } else if (q.type === "rewrite" || q.type === "correct") {
      // For Rewrite/Correct, the teacher requested a true 100% match,
      // with only case and the specified punctuation ignored.
      const givenNorm = normalizeExactText(given);
      const accepted = (q.correctAnswers || []).map(a => normalizeExactText(a));
      correct = accepted.includes(givenNorm);
    } else {
      // Preserve the previous behavior for other non-MCQ question types.
      const givenNorm = normalizeLooseText(given);
      const accepted = (q.correctAnswers || []).map(a => normalizeLooseText(a));
      correct = accepted.includes(givenNorm);
    }
    if (correct) score += points;
    answerDetails.push({ questionIndex: i, given: given ?? null, correct });
  });
  return { score, total, answerDetails };
}

async function submitExam(isTimeout) {
  if (examTimerInterval) { clearInterval(examTimerInterval); examTimerInterval = null; }
  const submitBtn = document.getElementById("submitBtn");
  if (submitBtn) {
    submitBtn.disabled = true;
    submitBtn.textContent = isTimeout ? "انتهى الوقت، جاري التسليم..." : "جاري التسليم...";
  }
  const { answerDetails } = gradeExam();
  try {
    if (!auth.currentUser || auth.currentUser.isAnonymous || !selectedStudent?.id) throw new Error("not_authenticated");
    const res = await fetch(`${STUDENT_AUTH_WORKER_URL}/submit-result`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${await auth.currentUser.getIdToken()}`
      },
      body: JSON.stringify({
        examId: exam.id,
        answers: answerDetails.map(a => ({ questionIndex: a.questionIndex, given: a.given })),
        timedOut: !!isTimeout
      })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) throw new Error(data.error || "submit_failed");
    try { localStorage.removeItem(getTimerStorageKey()); } catch (e) {}
    try { localStorage.removeItem(getAnswersStorageKey()); } catch (e) {}
    renderResult(data.score, data.total, data.answerDetails || answerDetails, true, isTimeout);
  } catch (err) {
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.textContent = "تسليم الإجابات";
    }
    showError("تعذر تسليم الإجابات. تأكد من اتصالك بالإنترنت وحاول تاني.");
  }
}

// ============ صوت ظهور النتيجة (Web Audio API — بدون ملفات خارجية) ============
let examAudioCtx = null;
function getExamAudioCtx() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!examAudioCtx) examAudioCtx = new AC();
  if (examAudioCtx.state === "suspended") examAudioCtx.resume();
  return examAudioCtx;
}
function playExamResultSound() {
  const ctx = getExamAudioCtx();
  if (!ctx) return;
  [
    { freq: 659.25, start: 0, duration: 0.12 },
    { freq: 783.99, start: 0.12, duration: 0.12 },
    { freq: 987.77, start: 0.24, duration: 0.24 },
  ].forEach(n => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = n.freq;
    const startAt = ctx.currentTime + n.start;
    gain.gain.setValueAtTime(0.0001, startAt);
    gain.gain.exponentialRampToValueAtTime(0.22, startAt + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, startAt + n.duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(startAt);
    osc.stop(startAt + n.duration + 0.02);
  });
}

function renderResult(score, total, answerDetails, isFreshSubmission = true, wasTimedOut = false) {
  if (isFreshSubmission) playExamResultSound();
  const pct = total > 0 ? Math.round((score / total) * 100) : 0;
  const content = document.getElementById("content");
  const questions = exam.questions || [];

  const groups = groupQuestionsByPassage(questions);
  const reviewHtml = groups.map(g => {
    const passageHtml = g.passage ? `<div class="passage">${escapeHtml(g.passage)}</div>` : "";
    const passageWrapHtml = passageHtml ? `<div class="card" style="padding-bottom:0.4rem;">${passageHtml}</div>` : "";
    const itemsHtml = g.items.map(qIndex => {
      const ad = answerDetails.find(a => a.questionIndex === qIndex);
      const q = questions[qIndex];
      if (!ad || !q) return "";
      let givenText = "";
      let correctText = "";
      if (q.type === "mcq" || q.type === "translation_mcq") {
        const opts = q.options || [];
        givenText = (typeof ad.given === "number" && opts[ad.given] !== undefined) ? opts[ad.given] : "(لم يُجب)";
        correctText = opts[q.correctIndex] !== undefined ? opts[q.correctIndex] : "";
      } else {
        givenText = ad.given ? ad.given : "(لم يُجب)";
        correctText = (q.correctAnswers && q.correctAnswers[0]) || "";
      }
      const explainId = `explain_${qIndex}`;
      const payload = {
        type: q.type,
        passage: q.passage || "",
        prompt: q.prompt || "",
        options: (q.type === "mcq" || q.type === "translation_mcq") ? (q.options || []) : [],
        correctAnswer: correctText,
        studentAnswer: givenText === "(لم يُجب)" ? "" : givenText,
      };
      const payloadAttr = escapeHtml(JSON.stringify(payload));
      return `
        <div class="card q-card ${ad.correct ? 'review-correct' : 'review-wrong'}">
          <div class="q-head"><span class="q-num">${qIndex + 1}</span><div class="q-title">${escapeHtml(q.prompt)}</div></div>
          <div class="review-row ${ad.correct ? 'ok' : 'bad'}">
            ${icon(ad.correct ? "check-circle" : "x-circle")}
            <span class="review-label">إجابتك:</span>
            <span class="review-value">${escapeHtml(givenText)}</span>
          </div>
          ${!ad.correct ? `
          <div class="review-row ok">
            ${icon("check-circle")}
            <span class="review-label">الإجابة الصحيحة:</span>
            <span class="review-value review-correct-text">${escapeHtml(correctText)}</span>
          </div>` : ""}
          <div class="explain-actions">
            <button class="explain-btn" id="${explainId}_explainBtn" data-payload="${payloadAttr}" onclick="requestExplain('${explainId}', 'explain', this)">${icon("lightbulb")} اشرحلي السبب</button>
            <button class="explain-btn" id="${explainId}_translateBtn" data-payload="${payloadAttr}" onclick="requestExplain('${explainId}', 'translate', this)">${icon("globe")} ترجملي السؤال</button>
          </div>
          <div class="explain-box" id="${explainId}_box" style="display:none;"></div>
        </div>`;
    }).join("");
    return passageWrapHtml + itemsHtml;
  }).join("");

  const subMessage = !isFreshSubmission
    ? "مراجعة إجابتك السابقة."
    : (wasTimedOut ? "انتهى وقت الامتحان، وتم تسليم إجاباتك تلقائيًا." : "تم إرسال نتيجتك للمدرّس بنجاح.");

  const tier = tierOf(pct);
  const tierText = { high: "ممتاز، كمّل كده", mid: "كويس، راجع الأخطاء تحت", low: "محتاج مراجعة، راجع الأخطاء تحت" }[tier];
  const correctCount = (answerDetails || []).filter(a => a.correct).length;
  const wrongCount = Math.max(0, questions.length - correctCount);
  content.innerHTML = `
    <div class="card result-card">
      <div class="score-ring ${tier}${isFreshSubmission ? " animate" : ""}" style="--p:${pct}"><div class="score-ring-inner"><span class="score-pct">${pct}%</span></div></div>
      <div class="result-score">${score} / ${total}</div>
      <div class="tier-chip ${tier}">${tierText}</div>
      <div class="result-counts">
        <span class="mini ok">${icon("check-circle")} ${correctCount} صح</span>
        <span class="mini bad">${icon("x-circle")} ${wrongCount} غلط</span>
      </div>
    </div>
    <p class="result-msg">${subMessage}</p>
    ${reviewHtml}
  `;
  window.scrollTo({ top: 0 });
}

async function requestExplain(explainId, action, btnEl) {
  const box = document.getElementById(`${explainId}_box`);
  const explainBtn = document.getElementById(`${explainId}_explainBtn`);
  const translateBtn = document.getElementById(`${explainId}_translateBtn`);
  if (!box || !btnEl) return;

  const payload = JSON.parse(btnEl.getAttribute("data-payload"));
  payload.action = action;

  explainBtn.disabled = true;
  translateBtn.disabled = true;
  const originalHtml = btnEl.innerHTML;
  btnEl.textContent = "جاري التحميل...";
  box.style.display = "block";
  box.textContent = "";

  try {
    const res = await fetch(AI_EXPLAIN_WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await res.json().catch(() => null);
    if (!res.ok || !data || !data.text) {
      if (data && data.error === "quota_exceeded" && data.scope === "daily") {
        box.textContent = "الشرح والترجمة مش متاحين دلوقتي لأن حد الاستخدام اليومي خلص. جرّب تاني بكرة أو اسأل المعلم.";
      } else if (data && (data.error === "quota_exceeded" || data.error === "ai_busy")) {
        box.textContent = `الخدمة مشغولة دلوقتي. جرّب تاني بعد ${Math.max(5, data.retryAfterSec || 15)} ثانية تقريبًا.`;
      } else {
        box.textContent = "معلش، حصلت مشكلة وإحنا بنجيب الشرح. جربي تاني كمان شوية.";
      }
    } else {
      box.textContent = data.text;
    }
  } catch (err) {
    box.textContent = "معلش، حصلت مشكلة في الاتصال. جربي تاني كمان شوية.";
  } finally {
    explainBtn.disabled = false;
    translateBtn.disabled = false;
    btnEl.innerHTML = originalHtml;
  }
}

init();
</script>
</body>
</html>
