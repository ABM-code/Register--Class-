<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta name="app-version" content="v89 - 2026-10-06">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جاري فتح الامتحان...</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #16302B; color: #F5F1E6; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; text-align: center; padding: 1.5rem; }
  p { font-size: 1.05rem; line-height: 1.9; }
  a { color: #D4A93B; }
</style>
</head>
<body>
<p id="msg">جاري فتح الامتحان...</p>
<script>
/* الرابط القصير: .../e/ABC123 → بنسأل الـWorker عن الامتحان وبنحوّل لـexam.html.
   GitHub Pages بيعرض الصفحة دي لأي مسار مش موجود، فبنتعامل بس مع شكل /e/كود. */
const WORKER = "https://register-class-auth.abm319.workers.dev";
const m = /^(.*)\/e\/([A-Za-z0-9]{6})\/?$/.exec(location.pathname);
const msg = document.getElementById("msg");
function bad(t) { msg.innerHTML = t + "<br><a href=\"" + (m ? m[1] : "") + "/\">الصفحة الرئيسية</a>"; }
if (!m) {
  bad("الصفحة دي مش موجودة.");
} else {
  fetch(WORKER + "/resolve-exam?code=" + encodeURIComponent(m[2].toUpperCase()))
    .then(r => r.json().catch(() => ({})))
    .then(d => {
      if (d && d.ok && d.examId) location.replace(m[1] + "/exam.html?examId=" + encodeURIComponent(d.examId));
      else if (d && d.error === "exam_code_invalid") bad("رابط الامتحان غير صالح أو الامتحان اتحذف. اطلب الرابط من المعلم تاني.");
      else bad("الخدمة مش متاحة دلوقتي. جرّب بعد دقيقة، ولو المشكلة فضلت بلّغ المعلم.");
    })
    .catch(() => bad("مقدرتش أفتح الامتحان. تأكد من النت وحاول تاني."));
}
</script>
</body>
</html>
