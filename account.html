<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حساب الطالب</title>
<style>
  :root { color-scheme: light; --bg:#f5f6f8; --card:#ffffff; --text:#1d2330; --muted:#6b7280; --accent:#1f6feb; --danger:#c62828; --ok:#1b7f3b; --border:#d7dbe2; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; --bg:#14171c; --card:#1e232b; --text:#e8ebf0; --muted:#9aa3b2; --accent:#4d8dff; --danger:#ff6b6b; --ok:#4cc875; --border:#333b47; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --bg:#14171c; --card:#1e232b; --text:#e8ebf0; --muted:#9aa3b2; --accent:#4d8dff; --danger:#ff6b6b; --ok:#4cc875; --border:#333b47; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
  body { padding: env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px); }
  .wrap { max-width: 420px; margin: 0 auto; padding: 1rem; }
  h1 { font-size: 1.35rem; margin: 0.5rem 0 1rem; text-align:center; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:1rem; margin-bottom:1rem; }
  .tabs { display:flex; gap:0.4rem; margin-bottom:0.8rem; }
  .tab { flex:1; padding:0.6rem; border:1px solid var(--border); background:transparent; color:var(--text); border-radius:10px; cursor:pointer; font-size:0.95rem; }
  .tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  label { display:block; font-size:0.85rem; color:var(--muted); margin:0.6rem 0 0.25rem; }
  input { width:100%; padding:0.75rem; border:1px solid var(--border); border-radius:10px; background:var(--bg); color:var(--text); font-size:1rem; }
  .ltr { direction:ltr; text-align:left; letter-spacing:0.12em; font-weight:700; }
  .btn { width:100%; margin-top:0.8rem; padding:0.8rem; border:none; border-radius:10px; background:var(--accent); color:#fff; font-size:1rem; font-weight:600; cursor:pointer; }
  .btn:disabled { opacity:0.6; cursor:default; }
  .btn.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  .btn.google { background:#fff; color:#1d2330; border:1px solid #c9ced6; display:flex; align-items:center; justify-content:center; gap:0.5rem; }
  .divider { text-align:center; color:var(--muted); font-size:0.85rem; margin:0.9rem 0; }
  .link { background:none; border:none; color:var(--accent); cursor:pointer; padding:0.4rem 0; font-size:0.9rem; text-decoration:underline; }
  .msg { padding:0.7rem 0.9rem; border-radius:10px; margin-bottom:1rem; font-size:0.92rem; display:none; }
  .msg.show { display:block; }
  .msg.err { background:rgba(198,40,40,0.12); color:var(--danger); }
  .msg.ok { background:rgba(27,127,59,0.12); color:var(--ok); }
  .muted { color:var(--muted); font-size:0.9rem; line-height:1.6; }
  .center { text-align:center; }
  .big { font-size:1.4rem; font-weight:700; margin:0.3rem 0; }
  a.btn { display:block; text-align:center; text-decoration:none; }
  .sec-title { font-size:1.1rem; font-weight:700; margin-bottom:0.6rem; }
  .item { border:1px solid var(--border); border-radius:12px; padding:0.8rem; margin-bottom:0.7rem; }
  .item-title { font-weight:700; margin-bottom:0.4rem; }
  .badge { display:inline-block; padding:0.15rem 0.6rem; border-radius:999px; font-size:0.82rem; font-weight:600; border:1px solid var(--border); }
  .badge.go { color:var(--accent); border-color:var(--accent); }
  .badge.ok { color:var(--ok); border-color:var(--ok); }
  .badge.warn { color:#b26a00; border-color:#b26a00; }
  .badge.off { color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>حساب الطالب</h1>
  <div id="msg" class="msg"></div>
  <div id="view"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
const STUDENT_AUTH_WORKER_URL = "https://register-class-auth.abm319.workers.dev";
const firebaseConfig = {
  apiKey: "AIzaSyBcWhyLvCSnpyLSLWw9rHVSvODYgK67Wh0",
  authDomain: "register-class-302e6.firebaseapp.com",
  projectId: "register-class-302e6",
  storageBucket: "register-class-302e6.firebasestorage.app",
  messagingSenderId: "230991294181",
  appId: "1:230991294181:web:167cb0a370c68b6a6f6e0c"
};
// نفس التطبيق الثانوي اللي بتستخدمه صفحة الامتحان، عشان الجلسة تتشارك بينهم
const studentApp = firebase.apps.find(a => a.name === "student") || firebase.initializeApp(firebaseConfig, "student");
const auth = studentApp.auth();
try { auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {}); } catch (e) {}

// ---------- أدوات مساعدة ----------
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function setMsg(text, kind) {
  const m = document.getElementById("msg");
  if (!text) { m.className = "msg"; m.textContent = ""; return; }
  m.className = "msg show " + (kind === "ok" ? "ok" : "err");
  m.textContent = text;
}
function setView(html) { document.getElementById("view").innerHTML = html; }
function setBusy(btn, busy, label) {
  if (!btn) return;
  btn.disabled = busy;
  if (label) btn.textContent = busy ? "جاري..." : label;
}

function authErrorText(err) {
  const map = {
    "auth/invalid-email": "الإيميل مش صحيح.",
    "auth/missing-password": "اكتب الباسورد.",
    "auth/invalid-credential": "الإيميل أو الباسورد غلط.",
    "auth/wrong-password": "الإيميل أو الباسورد غلط.",
    "auth/user-not-found": "الإيميل أو الباسورد غلط.",
    "auth/email-already-in-use": "الإيميل ده مسجل قبل كده. ادخل بيه بدل ما تسجل من جديد.",
    "auth/weak-password": "الباسورد لازم يكون 6 حروف أو أرقام على الأقل.",
    "auth/too-many-requests": "محاولات كتير. استنى شوية وحاول تاني.",
    "auth/network-request-failed": "مفيش اتصال بالإنترنت. تأكد من الشبكة وحاول تاني.",
    "auth/account-exists-with-different-credential": "الإيميل ده مسجل بطريقة دخول تانية. ادخل بالإيميل والباسورد.",
    "auth/popup-closed-by-user": "اتقفل اختيار الحساب. حاول تاني.",
    "auth/cancelled-popup-request": "اتقفل اختيار الحساب. حاول تاني.",
    "auth/user-disabled": "الحساب ده موقوف. كلم المدرس.",
    "auth/unauthorized-domain": "الموقع ده مش مسموح بالدخول بجوجل. كلم المدرس.",
  };
  return map[err && err.code] || "حصل خطأ، حاول تاني.";
}

function linkErrorText(code, status) {
  const map = {
    invalid_code: "الكود مش صحيح. اتأكد منه وحاول تاني.",
    code_expired: "الكود ده انتهت صلاحيته. اطلب كود جديد من المدرس.",
    card_already_linked: "الكارت ده مربوط بحساب تاني. كلم المدرس عشان يفك الربط.",
    already_linked: "حسابك مربوط بالفعل.",
    too_many_attempts: "محاولات كتير. استنى شوية وحاول تاني.",
    invalid_auth: "انتهت الجلسة. سجّل دخول تاني.",
    missing_auth: "انتهت الجلسة. سجّل دخول تاني.",
  };
  return map[code] || ("حصل خطأ، حاول تاني." + ((code || status) ? " (" + (code || status) + ")" : ""));
}

async function workerFetch(path, options = {}) {
  const token = await auth.currentUser.getIdToken();
  const res = await fetch(STUDENT_AUTH_WORKER_URL + path, {
    ...options,
    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}`, ...(options.headers || {}) },
  });
  const data = await res.json().catch(() => ({}));
  return { res, data };
}

// ---------- الشاشات ----------
function renderAuthChoice(tab = "login") {
  setView(`
    <div class="card">
      <div class="tabs">
        <button class="tab ${tab === "login" ? "active" : ""}" id="tabLogin">دخول</button>
        <button class="tab ${tab === "register" ? "active" : ""}" id="tabRegister">حساب جديد</button>
      </div>

      <button class="btn google" id="googleBtn">
        <span>G</span><span>الدخول بحساب Google</span>
      </button>
      <div class="divider">أو بالإيميل والباسورد</div>

      <form id="authForm" novalidate>
        <label for="email">الإيميل</label>
        <input id="email" type="email" class="ltr" autocomplete="email" required>
        <label for="password">الباسورد</label>
        <input id="password" type="password" class="ltr" autocomplete="${tab === "login" ? "current-password" : "new-password"}" required>
        ${tab === "register" ? `
          <label for="password2">أكّد الباسورد</label>
          <input id="password2" type="password" class="ltr" autocomplete="new-password" required>
        ` : ""}
        <button class="btn" id="submitBtn" type="submit">${tab === "login" ? "دخول" : "إنشاء حساب"}</button>
      </form>

      ${tab === "login" ? `<div class="center" style="margin-top:0.6rem;"><button class="link" id="forgotBtn">نسيت الباسورد؟</button></div>` : ""}
    </div>
  `);

  document.getElementById("tabLogin").onclick = () => renderAuthChoice("login");
  document.getElementById("tabRegister").onclick = () => renderAuthChoice("register");
  document.getElementById("googleBtn").onclick = startGoogleSignIn;

  document.getElementById("authForm").onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const btn = document.getElementById("submitBtn");
    setMsg("");
    if (!email) return setMsg("اكتب الإيميل.");
    if (!password) return setMsg("اكتب الباسورد.");

    if (tab === "register") {
      const password2 = document.getElementById("password2").value;
      if (password.length < 6) return setMsg("الباسورد لازم يكون 6 حروف أو أرقام على الأقل.");
      if (password !== password2) return setMsg("الباسورد التاني مش نفس الأول.");
      setBusy(btn, true);
      try {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        await cred.user.sendEmailVerification();
        // onAuthStateChanged هيعرض شاشة التحقق من الإيميل
      } catch (err) {
        setMsg(authErrorText(err), "err");
      } finally { setBusy(btn, false, "إنشاء حساب"); }
    } else {
      setBusy(btn, true);
      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (err) {
        setMsg(authErrorText(err), "err");
      } finally { setBusy(btn, false, "دخول"); }
    }
  };

  const forgot = document.getElementById("forgotBtn");
  if (forgot) forgot.onclick = async () => {
    const email = document.getElementById("email").value.trim();
    if (!email) return setMsg("اكتب الإيميل الأول، وبعدين اضغط نسيت الباسورد.");
    try {
      await auth.sendPasswordResetEmail(email);
      setMsg("ابعتنالك رسالة على الإيميل. افتحها واتبع الخطوات.", "ok");
    } catch (err) {
      setMsg(authErrorText(err), "err");
    }
  };
}

function startGoogleSignIn() {
  setMsg("");
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });
  // الـredirect أضمن من الـpopup على موبايل Chrome
  auth.signInWithRedirect(provider).catch(err => setMsg(authErrorText(err), "err"));
}

function renderVerify(user) {
  setView(`
    <div class="card center">
      <div class="big">افتح إيميلك</div>
      <p class="muted">بعتنالك رسالة تأكيد على <strong class="ltr">${esc(user.email)}</strong>.<br>
      اضغط الرابط اللي فيها، وبعدين ارجع هنا واضغط "أنا أكدت الإيميل".</p>
      <button class="btn" id="checkVerifiedBtn">أنا أكدت الإيميل</button>
      <button class="btn secondary" id="resendBtn">ابعت الرسالة تاني</button>
      <div class="center" style="margin-top:0.6rem;"><button class="link" id="signOutBtn">تسجيل خروج</button></div>
    </div>
  `);
  document.getElementById("checkVerifiedBtn").onclick = async (e) => {
    setBusy(e.target, true);
    try {
      await auth.currentUser.reload();
      if (auth.currentUser.emailVerified) await render(auth.currentUser);
      else setMsg("الإيميل لسه مش متأكد. افتح الرسالة واضغط الرابط.");
    } catch (err) { setMsg(authErrorText(err), "err"); }
    finally { setBusy(e.target, false, "أنا أكدت الإيميل"); }
  };
  document.getElementById("resendBtn").onclick = async (e) => {
    setBusy(e.target, true);
    try {
      await auth.currentUser.sendEmailVerification();
      setMsg("اتبعتت رسالة تأكيد جديدة.", "ok");
    } catch (err) { setMsg(authErrorText(err), "err"); }
    finally { setBusy(e.target, false, "ابعت الرسالة تاني"); }
  };
  document.getElementById("signOutBtn").onclick = () => auth.signOut();
}

function renderPinSession() {
  setView(`
    <div class="card center">
      <p class="muted">أنت داخل بالرمز السري للامتحان، مش بحساب شخصي.<br>
      عشان تربط حسابك لازم تسجل خروج الأول.</p>
      <button class="btn" id="signOutBtn">تسجيل خروج</button>
    </div>
  `);
  document.getElementById("signOutBtn").onclick = () => auth.signOut();
}

async function renderLinkState(user) {
  setView(`<div class="card center"><p class="muted">جاري التحقق من حسابك...</p></div>`);
  let data;
  try {
    ({ data } = await workerFetch("/my-link", { method: "GET" }));
  } catch (err) {
    setView(`
      <div class="card center">
        <p class="muted">تعذر التحقق من الحساب. تأكد من الإنترنت.</p>
        <button class="btn" id="retryBtn">حاول تاني</button>
        <div class="center" style="margin-top:0.6rem;"><button class="link" id="signOutBtn">تسجيل خروج</button></div>
      </div>`);
    document.getElementById("retryBtn").onclick = () => renderLinkState(user);
    document.getElementById("signOutBtn").onclick = () => auth.signOut();
    return;
  }

  if (data && data.ok && data.linked) {
    await renderDashboard(user, data.student);
    return;
  }

  let enr = { status: "none" };
  try {
    const r = await workerFetch("/my-enrollment", { method: "GET" });
    if (r.res.ok && r.data && r.data.ok) enr = r.data;
  } catch (e) { /* لو فشل، نكمل بشاشة الربط العادية */ }

  if (enr.status === "pending") return renderEnrollPending(user, enr);
  if (enr.status === "rejected") setMsg("طلب التسجيل السابق اترفض. تقدر تقدّم طلب جديد أو تكلم المدرس.", "err");
  renderLinkForm(user);
}

// ---------- لوحة الطالب (حساب مربوط) ----------
function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return isNaN(d.getTime()) ? "" : d.toLocaleString("ar-EG", { dateStyle: "medium", timeStyle: "short" });
}

function examCardHtml(e) {
  const href = "exam.html?examId=" + encodeURIComponent(e.id);
  const score = Number(e.score) || 0, total = Number(e.total) || 0;
  const pct = total > 0 ? Math.round((score / total) * 100) : 0;
  let badge, action = "";
  if (e.submitted) {
    badge = `<span class="badge ok">تم التسليم: ${score} / ${total} (${pct}%)</span>`;
    action = e.canStart
      ? `<a class="btn" href="${href}">أعد الامتحان (المعلم سمحلك)</a>`
      : `<a class="btn secondary" href="${href}">راجع نتيجتك وإجاباتك</a>`;
  } else if (e.canStart) {
    badge = e.closed ? `<span class="badge warn">مقفول، لكن المعلم سمحلك</span>` : `<span class="badge go">مفتوح</span>`;
    action = `<a class="btn" href="${href}">ابدأ الامتحان</a>`;
  } else {
    badge = `<span class="badge off">مقفول</span>`;
  }
  const dl = (e.deadline && !e.closed && fmtDate(e.deadline)) ? `<div class="muted">آخر ميعاد: ${esc(fmtDate(e.deadline))}</div>` : "";
  return `<div class="item"><div class="item-title">${esc(e.title)}</div>${badge}${dl}${action}</div>`;
}

function dashboardHtml(student, exams) {
  const list = (exams || []).length
    ? exams.map(examCardHtml).join("")
    : `<p class="muted">مفيش امتحانات متاحة دلوقتي.</p>`;
  const lib = student && student.teacherId
    ? `<a class="btn secondary" style="margin-bottom:1rem;" href="materials.html?t=${encodeURIComponent(student.teacherId)}">فتح مكتبتي</a>` : "";
  return `
    <div class="card center">
      <div class="big">أهلاً ${esc(student?.name || "")}</div>
      <p class="muted">${esc(student?.stage || "")}</p>
    </div>
    <div class="card">
      <div class="sec-title">امتحاناتي</div>
      ${list}
    </div>
    ${lib}
    <div class="center"><button class="link" id="signOutBtn">تسجيل خروج</button></div>
  `;
}

async function renderDashboard(user, student) {
  setView(`<div class="card center"><p class="muted">جاري تحميل لوحتك...</p></div>`);
  try {
    const { res, data } = await workerFetch("/my-dashboard", { method: "GET" });
    if (res.ok && data && data.ok) {
      setView(dashboardHtml(data.student, data.exams || []));
      document.getElementById("signOutBtn").onclick = () => auth.signOut();
      return;
    }
  } catch (e) { /* نكمل للشاشة البديلة */ }
  setView(`
    <div class="card center">
      <div class="big">حسابك مربوط ✓</div>
      <p class="muted">أهلاً <strong>${esc(student?.name || "")}</strong>${student?.stage ? " — " + esc(student.stage) : ""}</p>
      <p class="muted">تعذر تحميل لوحتك دلوقتي.</p>
      <button class="btn" id="retryDashBtn">حاول تاني</button>
      <div class="center" style="margin-top:0.6rem;"><button class="link" id="signOutBtn">تسجيل خروج</button></div>
    </div>`);
  document.getElementById("retryDashBtn").onclick = () => renderDashboard(user, student);
  document.getElementById("signOutBtn").onclick = () => auth.signOut();
}

function enrollErrorText(code, status) {
  const map = {
    invalid_code: "كود الدعوة مش صحيح. اتأكد منه وحاول تاني.",
    code_expired: "كود الدعوة انتهت صلاحيته. اطلب كود جديد من المدرس.",
    code_revoked: "كود الدعوة ده اتلغى. اطلب كود جديد من المدرس.",
    request_pending: "طلبك اتبعت قبل كده وفي انتظار موافقة المدرس.",
    already_linked: "حسابك مربوط بكارت بالفعل.",
    invalid_name: "اكتب اسمك بالكامل (3 حروف على الأقل).",
    invalid_phone: "رقم التليفون مش صحيح. اكتبه أرقام بس.",
    email_not_verified: "لازم تأكد الإيميل الأول.",
    too_many_attempts: "محاولات كتير. استنى شوية وحاول تاني.",
    invalid_auth: "انتهت الجلسة. سجّل دخول تاني.",
    missing_auth: "انتهت الجلسة. سجّل دخول تاني.",
  };
  return map[code] || ("حصل خطأ، حاول تاني." + ((code || status) ? " (" + (code || status) + ")" : ""));
}

function renderEnrollPending(user, enr) {
  setView(`
    <div class="card center">
      <div class="big">طلبك في الانتظار</div>
      <p class="muted">طلب التسجيل بتاعك${enr.name ? " (<strong>" + esc(enr.name) + "</strong>)" : ""} وصل للمدرس.<br>
      أول ما يوافق عليه حسابك هيتربط بكارتك تلقائيًا، وترجع تفتح الصفحة دي.</p>
      <button class="btn" id="refreshBtn">تحديث الحالة</button>
      <div class="center" style="margin-top:0.6rem;"><button class="link" id="signOutBtn">تسجيل خروج</button></div>
    </div>
  `);
  document.getElementById("refreshBtn").onclick = () => renderLinkState(user);
  document.getElementById("signOutBtn").onclick = () => auth.signOut();
}

function renderEnrollForm(user) {
  setView(`
    <div class="card">
      <div class="big center">طلب تسجيل طالب جديد</div>
      <p class="muted">اطلب من المدرس <strong>كود الدعوة</strong> (8 حروف وأرقام) واكتب بياناتك. المدرس هيراجع الطلب ويوافق عليه.</p>
      <form id="enrollForm" novalidate>
        <label for="ecode">كود الدعوة</label>
        <input id="ecode" class="ltr" maxlength="9" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX" required>
        <label for="ename">اسمك بالكامل</label>
        <input id="ename" autocomplete="name" maxlength="80" required>
        <label for="eparent">رقم تليفون ولي الأمر</label>
        <input id="eparent" type="tel" class="ltr" inputmode="tel" maxlength="20" autocomplete="off" required>
        <label for="estudent">رقم تليفونك (اختياري)</label>
        <input id="estudent" type="tel" class="ltr" inputmode="tel" maxlength="20" autocomplete="off">
        <button class="btn" id="enrollBtn" type="submit">إرسال الطلب</button>
      </form>
      <div class="center" style="margin-top:0.6rem;"><button class="link" id="backToLinkBtn">رجوع</button></div>
    </div>
  `);

  const ecode = document.getElementById("ecode");
  ecode.addEventListener("input", () => {
    const raw = ecode.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
    ecode.value = raw.length > 4 ? raw.slice(0, 4) + "-" + raw.slice(4) : raw;
  });
  document.getElementById("backToLinkBtn").onclick = () => { setMsg(""); renderLinkForm(user); };

  document.getElementById("enrollForm").onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById("enrollBtn");
    const code = ecode.value.replace(/[^A-Z0-9]/gi, "");
    const name = document.getElementById("ename").value.trim();
    const parentPhone = document.getElementById("eparent").value.trim();
    const studentPhone = document.getElementById("estudent").value.trim();
    setMsg("");
    if (code.length !== 8) return setMsg("كود الدعوة لازم يكون 8 حروف وأرقام.");
    if (name.length < 3) return setMsg("اكتب اسمك بالكامل.");
    if (!parentPhone) return setMsg("اكتب رقم تليفون ولي الأمر.");
    setBusy(btn, true);
    try {
      const { res, data: d } = await workerFetch("/student-enroll-request", {
        method: "POST", body: JSON.stringify({ code, name, parentPhone, studentPhone })
      });
      if (res.ok && d.ok) {
        setMsg("اتبعت الطلب للمدرس.", "ok");
        await renderLinkState(user);
      } else if (d.error === "request_pending") {
        await renderLinkState(user);
      } else {
        setMsg(enrollErrorText(d.error, res.status), "err");
      }
    } catch (err) {
      setMsg("تعذر إرسال الطلب. تأكد من الإنترنت وحاول تاني.", "err");
    } finally { setBusy(btn, false, "إرسال الطلب"); }
  };
}

function renderLinkForm(user) {
  setView(`
    <div class="card">
      <div class="big center">اربط حسابك بكارت الطالب</div>
      <p class="muted">اطلب من المدرس كود الربط (8 حروف وأرقام، بالشكل XXXX-XXXX) وادخله هنا. الكود بيتستخدم مرة واحدة.</p>
      <form id="linkForm" novalidate>
        <label for="code">كود الربط</label>
        <input id="code" class="ltr" maxlength="9" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX" required>
        <button class="btn" id="linkBtn" type="submit">ربط الحساب</button>
      </form>
      <div class="divider">معيش كود ربط؟</div>
      <button class="btn secondary" id="newStudentBtn" type="button">أنا طالب جديد، عايز أقدّم طلب تسجيل</button>
      <div class="center" style="margin-top:0.6rem;"><button class="link" id="signOutBtn">تسجيل خروج</button></div>
    </div>
  `);

  const codeInput = document.getElementById("code");
  codeInput.addEventListener("input", () => {
    const raw = codeInput.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
    codeInput.value = raw.length > 4 ? raw.slice(0, 4) + "-" + raw.slice(4) : raw;
  });

  document.getElementById("linkForm").onsubmit = async (e) => {
    e.preventDefault();
    const code = codeInput.value.replace(/[^A-Z0-9]/gi, "");
    const btn = document.getElementById("linkBtn");
    setMsg("");
    if (code.length !== 8) return setMsg("الكود لازم يكون 8 حروف وأرقام.");
    setBusy(btn, true);
    try {
      const { res, data: d } = await workerFetch("/student-link-card", {
        method: "POST", body: JSON.stringify({ code })
      });
      if (res.ok && d.ok) {
        setMsg("تم ربط حسابك بنجاح.", "ok");
        await renderLinkState(user);
      } else {
        setMsg(linkErrorText(d.error, res.status), "err");
      }
    } catch (err) {
      setMsg("تعذر الربط. تأكد من الإنترنت وحاول تاني.", "err");
    } finally { setBusy(btn, false, "ربط الحساب"); }
  };

  document.getElementById("newStudentBtn").onclick = () => { setMsg(""); renderEnrollForm(user); };
  document.getElementById("signOutBtn").onclick = () => auth.signOut();
}

// ---------- المنطق الرئيسي ----------
async function render(user) {
  setMsg("");
  if (!user) return renderAuthChoice("login");

  const providers = (user.providerData || []).map(p => p.providerId);
  const isPassword = providers.includes("password");
  const isGoogle = providers.includes("google.com");

  // جلسة الرمز السري (custom token) مالهاش providerData، ومينفعش تربط منها حساب
  if (!isPassword && !isGoogle) return renderPinSession();

  if (isPassword && !user.emailVerified) return renderVerify(user);

  await renderLinkState(user);
}

auth.getRedirectResult().catch(err => setMsg(authErrorText(err), "err"));
auth.onAuthStateChanged(user => { render(user); });
</script>
