<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="mobile-web-app-capable" content="yes">

<title>Class Register — Mr. Abd El Rahman Moneer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #16302B; color: #1B2420; }
  input:focus, textarea:focus {
    outline: none;
    border-color: #D4A93B !important;
    box-shadow: 0 0 0 3px rgba(212,169,59,0.18);
  }
  button { font-family: inherit; transition: transform 0.08s ease, background 0.15s ease; }
  button:active { transform: scale(0.97); }
  .card-row:hover { background: #F3EFE2 !important; }
  @media (prefers-reduced-motion: reduce) { button, .card-row { transition: none !important; } }

  header { padding: 2.25rem 1.25rem 2rem; border-bottom: 1px solid rgba(245,241,230,0.12); }
  .app-content { display: none; }
  .header-inner { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 1.1rem; }
  .avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid #D4A93B; flex-shrink: 0; }
  .eyebrow { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.3rem; color: #9FB8AD; font-size: 0.76rem; letter-spacing: 0.12em; text-transform: uppercase; }
  h1.tname { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.5rem; color: #F5F1E6; margin: 0; line-height: 1.2; }
  .subline { color: #9FB8AD; margin-top: 0.3rem; font-size: 0.86rem; display: flex; align-items: center; gap: 0.35rem; }

  main { max-width: 640px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
  .toolbar { display: flex; gap: 0.6rem; margin-bottom: 0.6rem; }
  .backup-row { display: flex; gap: 0.6rem; margin-bottom: 1.25rem; }
  .stage-counts { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.9rem; }
  .stage-pill {
    display: flex; align-items: center; gap: 0.35rem; background: rgba(245,241,230,0.08);
    border: 1px solid rgba(245,241,230,0.16); color: #9FB8AD; border-radius: 999px;
    padding: 0.3rem 0.7rem; font-size: 0.78rem; cursor: pointer; user-select: none;
  }
  .stage-pill.active { background: #D4A93B; color: #1B2420; border-color: #D4A93B; font-weight: 600; }
  .stage-pill .count { font-weight: 700; }
  .stats-row { display: flex; gap: 0.5rem; margin-bottom: 0.9rem; }
  .stat-card { flex: 1; background: rgba(245,241,230,0.06); border: 1px solid rgba(245,241,230,0.14); border-radius: 10px; padding: 0.6rem 0.7rem; cursor: default; }
  .stat-label { font-size: 0.7rem; color: #9FB8AD; margin-bottom: 0.2rem; }
  .stat-value { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.05rem; color: #F5F1E6; }
  .overdue-card { cursor: pointer; transition: background 0.15s ease, border-color 0.15s ease; }
  .overdue-card:hover { background: rgba(193,91,60,0.15); }
  .overdue-card.active { background: #C15B3C; border-color: #C15B3C; }
  .overdue-card.active .stat-label, .overdue-card.active .stat-value { color: #ffffff; }
  .backup-btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.4rem;
    background: rgba(245,241,230,0.08); color: #9FB8AD; border: 1px solid rgba(245,241,230,0.18);
    border-radius: 9px; padding: 0.55rem; font-size: 0.82rem; font-weight: 600; cursor: pointer;
  }
  .search-wrap { position: relative; flex: 1; }
  .search-wrap svg { position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); }
  #searchInput {
    width: 100%; padding: 0.7rem 0.9rem 0.7rem 2.4rem; border-radius: 10px;
    border: 1px solid rgba(245,241,230,0.18); background: rgba(245,241,230,0.06);
    color: #F5F1E6; font-size: 0.95rem;
  }
  #searchInput::placeholder { color: rgba(245,241,230,0.45); }
  #addBtn {
    display: flex; align-items: center; gap: 0.4rem; background: #D4A93B; color: #1B2420;
    border: none; border-radius: 10px; padding: 0 1rem; font-weight: 600; font-size: 0.92rem;
    cursor: pointer; white-space: nowrap;
  }

  #errorBox { background: #F6E7E2; color: #9C4B32; padding: 0.65rem 0.9rem; border-radius: 8px; font-size: 0.88rem; margin-bottom: 1rem; display: none; }

  #formCard { background: #F5F1E6; border-radius: 14px; padding: 1.25rem; margin-bottom: 1.5rem; box-shadow: 0 8px 24px rgba(0,0,0,0.18); display: none; }
  .form-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .form-head h2 { font-family: 'Fraunces', serif; font-size: 1.15rem; margin: 0; font-weight: 600; }
  .close-x { background: none; border: none; cursor: pointer; color: #6B6B60; padding: 4px; }
  .field-group { margin-bottom: 0.75rem; }
  .checkbox-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.6rem 0.75rem; border-radius: 8px; border: 1px solid rgba(0,0,0,0.15); background: #FFFDF8; cursor: pointer; }
  .checkbox-row input[type="checkbox"] { width: 17px; height: 17px; accent-color: #3F6B4A; cursor: pointer; flex-shrink: 0; }
  .checkbox-row label { margin: 0; cursor: pointer; font-size: 0.9rem; color: #1B2420; font-weight: 500; }
  .mini-badge { font-size: 0.72rem; font-weight: 600; padding: 0.15rem 0.5rem; border-radius: 999px; white-space: nowrap; }
  .field-row { display: flex; gap: 0.7rem; }
  .field-row .field-group { flex: 1; }
  label { display: block; font-size: 0.78rem; color: #6B6B60; margin-bottom: 0.3rem; font-weight: 500; }
  input.reg-input, select.reg-input, textarea.reg-textarea {
    width: 100%; padding: 0.6rem 0.75rem; border-radius: 8px; border: 1px solid rgba(0,0,0,0.15);
    background: #FFFDF8; font-size: 0.92rem; color: #1B2420; font-family: inherit;
  }
  textarea.reg-textarea { resize: vertical; }
  .form-actions { display: flex; gap: 0.6rem; margin-top: 0.5rem; }
  #saveBtn {
    flex: 1; background: #3F6B4A; color: #F5F1E6; border: none; border-radius: 9px; padding: 0.7rem;
    font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.4rem;
  }
  #cancelBtn {
    background: transparent; color: #6B6B60; border: 1px solid rgba(0,0,0,0.15); border-radius: 9px;
    padding: 0.7rem 1rem; font-weight: 500; cursor: pointer;
  }

  #emptyState { text-align: center; padding: 3rem 1.5rem; color: #9FB8AD; border: 1px dashed rgba(245,241,230,0.2); border-radius: 14px; display: none; }

  #studentList { display: flex; flex-direction: column; gap: 0.6rem; }
  .card-row { background: #F5F1E6; border-radius: 12px; overflow: hidden; }
  .card-head { display: flex; align-items: center; justify-content: space-between; padding: 0.85rem 1rem; cursor: pointer; gap: 0.75rem; }
  .card-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.02rem; }
  .stage-tag { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.68rem; color: #4F7864; background: #EAF2E7; padding: 0.1rem 0.45rem; border-radius: 999px; vertical-align: middle; }
  .card-entry { font-size: 0.82rem; color: #6B6B60; margin-top: 0.15rem; }
  .badge { font-size: 0.75rem; font-weight: 600; padding: 0.25rem 0.6rem; border-radius: 999px; display: flex; align-items: center; gap: 0.35rem; white-space: nowrap; }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; }
  .card-details { padding: 0 1rem 1rem; border-top: 1px solid rgba(0,0,0,0.06); display: none; }
  .detail-row { display: flex; gap: 0.5rem; padding: 0.5rem 0; font-size: 0.88rem; border-bottom: 1px solid rgba(0,0,0,0.04); }
  .detail-label { color: #6B6B60; min-width: 90px; display: flex; align-items: center; gap: 0.3rem; }
  .detail-value { color: #1B2420; flex: 1; }
  .card-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.85rem; }
  .edit-btn, .del-btn, .wa-btn { flex: 1; min-width: 100px; display: flex; align-items: center; justify-content: center; gap: 0.35rem; border: none; border-radius: 8px; padding: 0.55rem; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
  .edit-btn { background: #EAEAE4; color: #1B2420; }
  .del-btn { background: #F6E7E2; color: #9C4B32; }
  .wa-btn { background: #25D366; color: #ffffff; flex-basis: 100%; }
  .payments-section { margin-top: 0.9rem; padding-top: 0.85rem; border-top: 1px solid rgba(0,0,0,0.06); }
  .payments-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 0.92rem; color: #1B2420; margin-bottom: 0.5rem; }
  .payment-row { display: flex; align-items: center; justify-content: space-between; padding: 0.4rem 0.55rem; background: #FFFDF8; border-radius: 7px; margin-bottom: 0.4rem; font-size: 0.85rem; }
  .payment-info { color: #1B2420; }
  .payment-actions { display: flex; gap: 0.3rem; }
  .pay-icon-btn { background: none; border: none; padding: 3px; cursor: pointer; display: flex; align-items: center; }
  .no-payments { font-size: 0.85rem; color: #6B6B60; margin: 0.3rem 0 0.6rem; }
  .add-payment-row { display: flex; gap: 0.4rem; margin-top: 0.5rem; }
  .add-payment-row input { font-size: 0.85rem; padding: 0.5rem 0.6rem; }
  .add-pay-btn { background: #3F6B4A; color: #F5F1E6; border: none; border-radius: 8px; padding: 0 0.85rem; font-size: 0.83rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<div id="lockScreen" style="position:fixed;inset:0;background:#16302B;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0.9rem;padding:1.5rem;text-align:center;">
  <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#D4A93B" stroke-width="1.75"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  <h2 style="font-family:'Fraunces',serif;color:#F5F1E6;margin:0;font-size:1.2rem;">كلمة السر</h2>
  <input id="lockPasswordInput" type="password" placeholder="ادخل كلمة السر" style="width:100%;max-width:260px;padding:0.7rem 0.9rem;border-radius:10px;border:1px solid rgba(245,241,230,0.25);background:rgba(245,241,230,0.08);color:#F5F1E6;font-size:0.95rem;text-align:center;">
  <button id="lockUnlockBtn" style="background:#D4A93B;color:#1B2420;border:none;border-radius:10px;padding:0.65rem 1.6rem;font-weight:600;font-size:0.92rem;cursor:pointer;">دخول</button>
  <p id="lockErrorMsg" style="color:#C15B3C;font-size:0.85rem;display:none;margin:0;">كلمة السر غير صحيحة</p>
</div>

    (snapshot) => {
      students = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      students.sort((a,b) => (a.name||"").localeCompare(b.name||""));
      render();
    },
    (err) => {
      showError("تعذر الاتصال بقاعدة البيانات. تأكد من اتصالك بالإنترنت.");
    }
  );
}
function fmtDate(d) {
  if (!d) return "—";
  const dt = new Date(d + "T00:00:00");
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" });
}
function getPayments(s) {
  if (Array.isArray(s.payments) && s.payments.length) {
    return [...s.payments].sort((a,b) => (b.date||"").localeCompare(a.date||""));
  }
  if (s.paymentDate) {
    return [{ date: s.paymentDate, amount: s.paymentAmount || "" }];
  }
  return [];
}
function paymentBadge(payments) {
  if (!payments.length) return { label: "No record", tone: "neutral" };
  const latest = payments[0];
  const paid = new Date(latest.date + "T00:00:00");
  const now = new Date();
  const days = Math.floor((now - paid) / (1000*60*60*24));
  if (days <= 31) return { label: "Current", tone: "good" };
  if (days <= 45) return { label: "Due soon", tone: "warn" };
  return { label: "Overdue", tone: "bad" };
}
const toneStyles = {
  good: { bg: "#EAF2E7", fg: "#3F6B4A", dot: "#5E9468" },
  warn: { bg: "#FBF0DE", fg: "#946A26", dot: "#D4A93B" },
  bad: { bg: "#F6E7E2", fg: "#9C4B32", dot: "#C15B3C" },
  neutral: { bg: "#EAEAE4", fg: "#6B6B60", dot: "#A3A398" },
};
function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function formatPhoneForWhatsapp(phone) {
  let digits = (phone || "").replace(/[^0-9]/g, "");
  if (!digits) return "";
  if (digits.startsWith("0")) digits = "2" + digits;
  else if (!digits.startsWith("20")) digits = "20" + digits;
  return digits;
}
function sendWhatsappReceipt(s, payment) {
  const waNumber = formatPhoneForWhatsapp(s.parentPhone);
  if (!waNumber) { showError("مفيش رقم ولي أمر مسجل لهذا الطالب."); return; }
  const amount = payment.amount ? payment.amount + " جنيه" : "";
  const date = fmtDate(payment.date);
  const message = `تحية طيبة،\nنفيدكم بأنه تم استلام مبلغ ${amount} من الطالب/ة ${s.name} بتاريخ ${date}.\nشكرًا لحضرتكم.\n${TEACHER_NAME}`;
  const url = "https://wa.me/" + waNumber + "?text=" + encodeURIComponent(message);
  window.open(url, "_blank");
}
async function addPayment(studentId) {
  const dateInput = document.getElementById("newPayDate_" + studentId);
  const amountInput = document.getElementById("newPayAmount_" + studentId);
  const date = dateInput.value;
  const amount = amountInput.value;
  if (!date || !amount) { showError("لازم تحدد التاريخ والمبلغ عشان تسجل الدفعة."); return; }
  const student = students.find(s => s.id === studentId);
  let payments = Array.isArray(student.payments) ? [...student.payments] : [];
  if (payments.length === 0 && student.paymentDate) {
    payments.push({ date: student.paymentDate, amount: student.paymentAmount || "", id: "legacy_" + studentId });
  }
  payments.push({ date, amount, id: Date.now().toString(36) + Math.random().toString(36).slice(2,6) });
  try {
    await studentsCol.doc(studentId).update({
      payments,
      paymentDate: firebase.firestore.FieldValue.delete(),
      paymentAmount: firebase.firestore.FieldValue.delete(),
    });
  } catch (err) {
    showError("تعذر تسجيل الدفعة. تأكد من اتصالك بالإنترنت.");
  }
}
async function deletePayment(studentId, paymentId) {
  if (!confirm("متأكد إنك عايز تمسح هذه الدفعة من السجل؟")) return;
  const student = students.find(s => s.id === studentId);
  const payments = getPayments(student).filter(p => p.id !== paymentId);
  try {
    await studentsCol.doc(studentId).update({ payments });
  } catch (err) {
    showError("تعذر حذف الدفعة. تأكد من اتصالك بالإنترنت.");
  }
}

function exportBackup() {
  const dataStr = JSON.stringify(students, null, 2);
  const blob = new Blob([dataStr], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const today = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = "class-register-backup-" + today + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showSuccess("تم تنزيل النسخة الاحتياطية بنجاح.");
}

async function importBackup(file) {
  const reader = new FileReader();
  reader.onload = async function(e) {
    let incoming;
    try {
      incoming = JSON.parse(e.target.result);
      if (!Array.isArray(incoming)) throw new Error("bad format");
    } catch (err) {
      showError("ملف النسخة الاحتياطية غير صالح.");
      return;
    }
    const replace = confirm("اضغط \"موافق\" لاستبدال كل البيانات الحالية بالكامل، أو \"إلغاء\" للدمج مع البيانات الموجودة.");
    try {
      if (replace) {
        const existing = await studentsCol.get();
        const batchDelete = db.batch();
        existing.docs.forEach(d => batchDelete.delete(d.ref));
        await batchDelete.commit();
      }
      const batchWrite = db.batch();
      incoming.forEach(s => {
        const { id, ...data } = s;
        const ref = id ? studentsCol.doc(id) : studentsCol.doc();
        batchWrite.set(ref, data, { merge: true });
      });
      await batchWrite.commit();
      showSuccess("تم استرجاع البيانات بنجاح.");
    } catch (err) {
      showError("تعذر استرجاع البيانات. تأكد من اتصالك بالإنترنت.");
    }
  };
  reader.readAsText(file);
}

  editingId = null;
  document.getElementById("formTitle").textContent = "New student";

  ["fName","fStudentPhone","fParentPhone","fEntryDate","fNotes"].forEach(id => document.getElementById(id).value = "");

function openEditForm(s) {
  editingId = s.id;

  document.getElementById("fName").value = s.name || "";

async function handleSubmit(e) {
  e.preventDefault();
  const name = document.getElementById("fName").value.trim();
  if (!name) { showError("Student name is required."); return; }
  clearError();
  const data = {
    name,
    stage: document.getElementById("fStage").value,
    studentPhone: document.getElementById("fStudentPhone").value.trim(),
    parentPhone: document.getElementById("fParentPhone").value.trim(),
    entryDate: document.getElementById("fEntryDate").value,
    term1Paid: document.getElementById("fTerm1Paid").checked,
    term1Received: document.getElementById("fTerm1Received").checked,
    term2Paid: document.getElementById("fTerm2Paid").checked,
    term2Received: document.getElementById("fTerm2Received").checked,
    notes: document.getElementById("fNotes").value.trim(),
  };
  const saveBtn = document.getElementById("saveBtn");
  saveBtn.disabled = true;
  try {
    if (editingId) {
      await studentsCol.doc(editingId).update(data);
    } else {
      await studentsCol.add(data);
    }
    closeForm();
  } catch (err) {
    showError("حصل خطأ أثناء الحفظ. تأكد من اتصالك بالإنترنت وحاول تاني.");
  } finally {
    saveBtn.disabled = false;
  }
}
async function handleDelete(id) {
  if (!confirm("متأكد إنك عايز تمسح بيانات هذا الطالب؟")) return;
  try {
    await studentsCol.doc(id).delete();
    if (expandedId === id) expandedId = null;
  } catch (err) {
    showError("تعذر الحذف. تأكد من اتصالك بالإنترنت.");
  }
}
function toggleExpand(id) {
  expandedId = expandedId === id ? null : id;
  render();
}
function filterByStage(stage) {
  const input = document.getElementById("searchInput");
  if (input.value.trim().toLowerCase() === stage.toLowerCase()) {
    input.value = "";
  } else {
    input.value = stage;
  }
  render();
}
function toggleOverdueFilter() {
  overdueOnly = !overdueOnly;
  render();
}

let overdueOnly = false;

function render() {
  const query = document.getElementById("searchInput").value.trim().toLowerCase();
  let filtered = !query ? students : students.filter(s =>
    s.name.toLowerCase().includes(query) ||
    (s.studentPhone||"").includes(query) ||
    (s.parentPhone||"").includes(query) ||
    (s.stage||"").toLowerCase().includes(query)
  );
  if (overdueOnly) {
    filtered = filtered.filter(s => paymentBadge(getPayments(s)).tone === "bad");
  }

  document.getElementById("studentCount").textContent = students.length + (students.length === 1 ? " student" : " students");

  const stages = ["Prep 1","Prep 2","Prep 3","Sec 1","Sec 2","Sec 3"];
  const counts = {};
  stages.forEach(st => counts[st] = 0);
  students.forEach(s => { if (s.stage && counts.hasOwnProperty(s.stage)) counts[s.stage]++; });
  const stageCountsEl = document.getElementById("stageCounts");
  stageCountsEl.innerHTML = stages.map(st => {
    const isActive = query === st.toLowerCase();
    return `<span class="stage-pill${isActive ? ' active' : ''}" onclick="filterByStage('${st}')">${st} <span class="count">${counts[st]}</span></span>`;
  }).join("");

  const now = new Date();
  const curYM = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0");
  let monthTotal = 0, grandTotal = 0, overdueCount = 0;
  students.forEach(s => {
    const payments = getPayments(s);
    payments.forEach(p => {
      const amt = parseFloat(p.amount) || 0;
      grandTotal += amt;
      if ((p.date||"").startsWith(curYM)) monthTotal += amt;
    });
    if (paymentBadge(payments).tone === "bad") overdueCount++;
  });
  document.getElementById("statMonth").textContent = monthTotal.toLocaleString() + " جنيه";
  document.getElementById("statTotal").textContent = grandTotal.toLocaleString() + " جنيه";
  document.getElementById("statOverdue").textContent = overdueCount + " طالب";
  const overdueCard = document.getElementById("overduePill");
  overdueCard.classList.toggle("active", overdueOnly);

  const listEl = document.getElementById("studentList");
  const emptyEl = document.getElementById("emptyState");

  if (filtered.length === 0) {
    listEl.innerHTML = "";
    document.getElementById("emptyMsg").textContent = students.length === 0
      ? "No students yet. Add your first one above."
      : (overdueOnly ? "مفيش طلاب متأخرين في الدفع حاليًا." : "No matches for that search.");
    emptyEl.style.display = "block";
    return;
  }
  emptyEl.style.display = "none";

  listEl.innerHTML = filtered.map(s => {
    const payments = getPayments(s);
    const badge = paymentBadge(payments);
    const tone = toneStyles[badge.tone];
    const isOpen = expandedId === s.id;
    const paymentsHtml = payments.length
      ? payments.map(p => `
          <div class="payment-row">
            <span class="payment-info">${p.amount ? p.amount + ' جنيه' : ''} — ${fmtDate(p.date)}</span>
            <span class="payment-actions">
              <button class="pay-icon-btn" title="إرسال إيصال واتساب" onclick='sendWhatsappReceipt(${JSON.stringify(s).replace(/'/g,"&apos;")}, ${JSON.stringify(p).replace(/'/g,"&apos;")})'>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="#25D366"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2zm0 18.16h-.01c-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.155 8.155 0 0 1-1.25-4.39c0-4.54 3.7-8.24 8.25-8.24 2.2 0 4.27.86 5.83 2.42a8.19 8.19 0 0 1 2.41 5.83c0 4.55-3.7 8.24-8.24 8.24z"/></svg>
              </button>
              <button class="pay-icon-btn" title="حذف الدفعة" onclick="deletePayment('${s.id}','${p.id}')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9C4B32" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"/></svg>
              </button>
            </span>
          </div>`).join("")
      : `<p class="no-payments">لسه مفيش مدفوعات مسجلة</p>`;
    return `
      <div class="card-row">
        <div class="card-head" onclick="toggleExpand('${s.id}')">
          <div style="min-width:0;flex:1;">
            <div class="card-name">${escapeHtml(s.name)}${s.stage ? ` <span class="stage-tag">${escapeHtml(s.stage)}</span>` : ''}</div>
            <div class="card-entry">Entered ${fmtDate(s.entryDate)}</div>

          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6B60" stroke-width="2">${isOpen ? '<path d="m18 15-6-6-6 6"/>' : '<path d="m6 9 6 6 6-6"/>'}</svg>
        </div>
        <div class="card-details" style="display:${isOpen ? 'block' : 'none'};">
          <div class="detail-row"><span class="detail-label">Student</span><span class="detail-value">${escapeHtml(s.studentPhone) || "—"}</span></div>
          <div class="detail-row"><span class="detail-label">Parent</span><span class="detail-value">${escapeHtml(s.parentPhone) || "—"}</span></div>
          <div class="detail-row"><span class="detail-label">مذكرة ترم أول</span><span class="detail-value" style="display:flex;gap:0.4rem;">
            <span class="mini-badge" style="background:${s.term1Paid ? '#EAF2E7' : '#EAEAE4'};color:${s.term1Paid ? '#3F6B4A' : '#6B6B60'};">دفع ${s.term1Paid ? '\u2713' : '\u2717'}</span>

          </span></div>
          <div class="detail-row"><span class="detail-label">مذكرة ترم تاني</span><span class="detail-value" style="display:flex;gap:0.4rem;">

            <span class="mini-badge" style="background:${(s.term2Received ?? s.term2) ? '#EAF2E7' : '#EAEAE4'};color:${(s.term2Received ?? s.term2) ? '#3F6B4A' : '#6B6B60'};">استلم ${(s.term2Received ?? s.term2) ? '\u2713' : '\u2717'}</span>
          </span></div>
          ${s.notes ? `<div class="detail-row"><span class="detail-label">Notes</span><span class="detail-value">${escapeHtml(s.notes)}</span></div>` : ""}

          <div class="payments-section">
            <div class="payments-title">سجل المدفوعات</div>
            ${paymentsHtml}
            <div class="add-payment-row">
              <input type="date" class="reg-input" id="newPayDate_${s.id}" style="flex:1;">
              <input type="number" min="0" step="1" class="reg-input" id="newPayAmount_${s.id}" placeholder="المبلغ" style="flex:1;">
              <button class="add-pay-btn" onclick="addPayment('${s.id}')">إضافة</button>
            </div>
          </div>

          <div class="card-actions">
            <button class="edit-btn" onclick='openEditForm(${JSON.stringify(s).replace(/'/g,"&apos;")})'>Edit</button>
            <button class="del-btn" onclick="handleDelete('${s.id}')">Delete</button>
          </div>
        </div>
      </div>
    `;
  }).join("");
}

document.getElementById("searchInput").addEventListener("input", render);

function showApp() {
  document.getElementById("lockScreen").style.display = "none";
  document.querySelectorAll(".app-content").forEach(el => el.style.display = "block");
  startSync();
}
function tryUnlock() {
  const val = document.getElementById("lockPasswordInput").value;
  if (val === APP_PASSWORD) {
    try { localStorage.setItem("registerUnlocked", "true"); } catch (e) {}
    showApp();
  } else {
    document.getElementById("lockErrorMsg").style.display = "block";
  }
}
document.getElementById("lockUnlockBtn").addEventListener("click", tryUnlock);
document.getElementById("lockPasswordInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") tryUnlock();
});

let alreadyUnlocked = false;
try { alreadyUnlocked = localStorage.getItem("registerUnlocked") === "true"; } catch (e) {}
if (alreadyUnlocked) {
  showApp();
} else {
  document.getElementById("lockPasswordInput").focus();
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

</script>
</body>
</html>
