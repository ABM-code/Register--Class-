<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#16302B">
<title>تفعيل كود الوصول</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --accent: #D4A93B; --accent-rgb: 212,169,59;
    --c-page: #16302B; --c-card: #F5F1E6; --c-cardalt: #EAEAE4; --c-field: #FFFDF8; --c-soft: #EFF5F0;
    --c-text: #1B2420; --c-muted: #6B6B60; --c-onpage: #F5F1E6; --c-mutedonpage: #9FB8AD;
    --c-success: #3F6B4A; --c-successbg: #E4EEE5; --c-successsolid: #5E9468;
    --c-danger: #C15B3C; --c-dangertext: #9C4B32; --c-dangerbg: #F6E7E2;
    --c-warnbg: #FBF0DE; --c-warntext: #8A6A1F; --c-warnsolid: #C99A2B;
  }
  @property --p { syntax: '<number>'; inherits: false; initial-value: 0; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: var(--c-page); color: var(--c-text); min-height: 100vh; }
  h1 { font-family: 'Fraunces', serif; color: var(--c-onpage); font-size: 1.4rem; margin: 0 0 0.3rem; }
  p.sub { color: var(--c-mutedonpage); font-size: 0.88rem; margin: 0 0 1.5rem; }
  .ic { width: 1.15em; height: 1.15em; vertical-align: -0.2em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; pointer-events: none; }
  .card { background: var(--c-card); border-radius: 16px; padding: 1.25rem; margin-bottom: 1rem; box-shadow: 0 8px 24px rgba(0,0,0,0.18); }
  label { display: block; font-size: 0.82rem; color: var(--c-muted); margin-bottom: 0.4rem; font-weight: 500; }
  select, input[type=text], input[type=email], input[type=password], textarea { width: 100%; padding: 0.65rem 0.8rem; border-radius: 10px; border: 1px solid rgba(0,0,0,0.15); background: var(--c-field); font-size: 0.95rem; color: var(--c-text); font-family: inherit; transition: border-color 0.15s ease, box-shadow 0.15s ease; }
  select:focus, input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),0.18); }
  button, .btn-primary { font-family: inherit; background: var(--accent); color: var(--c-text); border: none; border-radius: 12px; padding: 0.75rem 1.2rem; font-weight: 700; font-size: 0.95rem; cursor: pointer; width: 100%; transition: filter 0.15s ease, transform 0.08s ease; box-shadow: 0 3px 10px rgba(var(--accent-rgb),0.3); }
  .btn-primary { display: flex; align-items: center; justify-content: center; gap: 0.45rem; text-decoration: none; }
  button:hover:not(:disabled), .btn-primary:hover { filter: brightness(1.05); }
  button:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
  button:active:not(:disabled) { transform: scale(0.98); }
  button:focus-visible, .btn-primary:focus-visible, .page-link:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-green { background: var(--c-success); color: var(--c-card); box-shadow: none; }
  .link-btn { display: flex; align-items: center; justify-content: center; gap: 0.4rem; background: none; box-shadow: none; color: var(--c-mutedonpage); font-weight: 600; font-size: 0.85rem; padding: 0.5rem; }
  .page-link { display: flex; align-items: center; justify-content: center; gap: 0.45rem; color: var(--c-onpage); font-size: 0.9rem; text-decoration: none; padding: 0.6rem; margin-top: 0.4rem; }
  #errorBox { display: none; align-items: flex-start; gap: 0.5rem; background: var(--c-dangerbg); color: var(--c-dangertext); padding: 0.65rem 0.9rem; border-radius: 10px; font-size: 0.88rem; margin-bottom: 1rem; }
  .empty-state { display: flex; flex-direction: column; align-items: center; gap: 0.6rem; text-align: center; padding: 2rem 1.25rem; color: var(--c-muted); }
  .empty-state > .ic { box-sizing: content-box; width: 1.9rem; height: 1.9rem; padding: 0.8rem; stroke-width: 1.5; background: rgba(0,0,0,0.06); border-radius: 50%; }
  .empty-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.05rem; color: var(--c-text); }
  .empty-state p { margin: 0 0 0.4rem; font-size: 0.88rem; line-height: 1.7; }
  .spinner { width: 1.1rem; height: 1.1rem; border-radius: 50%; border: 2px solid rgba(159,184,173,0.35); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading { display: flex; align-items: center; justify-content: center; gap: 0.6rem; color: var(--c-mutedonpage); padding: 2rem 0; }
  .student-suggestions { margin-top: 0.4rem; border-radius: 10px; overflow: hidden; display: none; box-shadow: 0 4px 14px rgba(0,0,0,0.12); }
  .student-suggestion-item { display: block; width: 100%; text-align: right; background: var(--c-field); color: var(--c-text); border: 1px solid rgba(0,0,0,0.12); border-top: none; padding: 0.7rem 0.8rem; font-size: 0.92rem; font-weight: 500; cursor: pointer; border-radius: 0; box-shadow: none; transition: background 0.12s ease; }
  .student-suggestion-item:first-child { border-top: 1px solid rgba(0,0,0,0.12); border-radius: 10px 10px 0 0; }
  .student-suggestion-item:last-child { border-radius: 0 0 10px 10px; }
  .student-suggestion-item:hover, .student-suggestion-item:active { background: var(--c-warnbg); filter: none; }
  .student-suggestion-empty { padding: 0.65rem 0.8rem; font-size: 0.85rem; color: var(--c-dangertext); background: var(--c-dangerbg); border-radius: 10px; }
  @media (pointer: coarse) { select, input[type=text], input[type=email], input[type=password], textarea { font-size: 16px; } }
  @media (prefers-reduced-motion: reduce) { .spinner, .score-ring.animate { animation: none; } .exam-progress-fill { transition: none; } }
  .wrap { max-width: 480px; margin: 0 auto; padding: 1.75rem 1.25rem 3rem; }
  .card input, .card select { margin-bottom: 0.8rem; }
  input.code-input { font-family: 'Fraunces', serif; font-size: 1.2rem; text-align: center; letter-spacing: 2px; text-transform: uppercase; }
  @media (pointer: coarse) { input.code-input { font-size: 1.2rem; } }
  #successBox { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 0.4rem; }
  #successBox > .ic { box-sizing: content-box; width: 2rem; height: 2rem; padding: 0.7rem; stroke-width: 1.7; color: var(--c-success); background: var(--c-successbg); border-radius: 50%; }
  .success-title { font-family: 'Fraunces', serif; font-weight: 700; font-size: 1.2rem; color: var(--c-success); }
  .success-product { font-weight: 600; margin: 0; }
  .item-line { display: flex; align-items: center; gap: 0.5rem; width: 100%; padding: 0.55rem 0; border-bottom: 1px solid rgba(0,0,0,0.08); font-size: 0.9rem; text-align: start; }
  .item-line:last-of-type { border-bottom: none; }
  .item-line .ic { color: var(--c-muted); }
  .status-chip { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.78rem; font-weight: 600; padding: 0.25rem 0.7rem; border-radius: 999px; margin-top: 0.4rem; background: rgba(0,0,0,0.06); color: var(--c-muted); }
  .status-chip.ok { background: var(--c-successbg); color: var(--c-success); }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true"><symbol id="i-check-circle" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></symbol><symbol id="i-clipboard" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></symbol><symbol id="i-book" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></symbol><symbol id="i-key" viewBox="0 0 24 24"><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/></symbol><symbol id="i-log-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></symbol><symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol><symbol id="i-calendar" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></symbol><symbol id="i-infinity" viewBox="0 0 24 24"><path d="M12 12c-2-2.67-4-4-6-4a4 4 0 1 0 0 8c2 0 4-1.33 6-4Zm0 0c2 2.67 4 4 6 4a4 4 0 0 0 0-8c-2 0-4 1.33-6 4Z"/></symbol></svg>
<div class="wrap">
  <h1>تفعيل كود الوصول</h1>
  <p class="sub" id="pageSub">سجّل دخولك أو اعمل حساب جديد عشان تفعّل الكود</p>
  <div id="errorBox"></div>
  <div id="content"><div class="loading"><span class="spinner"></span>جاري التحميل...</div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
const STUDENT_AUTH_WORKER_URL = "https://register-class-auth.abm319.workers.dev";
const firebaseConfig = {
  apiKey: "AIzaSyBcWhyLvCSnpyLSLWw9rHVSvODYgK67Wh0",
  authDomain: "register-class-302e6.firebaseapp.com",
  projectId: "register-class-302e6",
  storageBucket: "register-class-302e6.firebasestorage.app",
  messagingSenderId: "230991294181",
  appId: "1:230991294181:web:167cb0a370c68b6a6f6e0c"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function icon(name) { return '<svg class="ic" aria-hidden="true"><use href="#i-' + name + '"/></svg>'; }
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function showError(msg) {
  const box = document.getElementById("errorBox");
  box.innerHTML = icon("alert") + "<span></span>";
  box.lastChild.textContent = msg;
  box.style.display = "flex";
}
function clearError() { document.getElementById("errorBox").style.display = "none"; }

const ERROR_MESSAGES = {
  invalid_code: "الكود غير صحيح.",
  already_activated: "هذا الكود تم تفعيله بالفعل من حساب آخر.",
  code_expired: "انتهت صلاحية تفعيل هذا الكود.",
  code_disabled: "هذا الكود معطّل.",
  product_unavailable: "هذا المنتج غير متاح حاليًا.",
  server_error: "حدث خطأ. حاول تاني.",
};

let mode = "login"; // login | signup

function renderAuthForm() {
  document.getElementById("content").innerHTML = `
    <div class="card">
      <label>البريد الإلكتروني</label>
      <input type="email" id="emailInput" autocomplete="email">
      <label>كلمة المرور</label>
      <input type="password" id="passwordInput" autocomplete="${mode === 'signup' ? 'new-password' : 'current-password'}">
      <button id="authBtn">${mode === 'signup' ? 'إنشاء حساب' : 'تسجيل الدخول'}</button>
    </div>
    <button class="link-btn" id="toggleModeBtn">${mode === 'signup' ? 'عندك حساب بالفعل؟ سجّل دخولك' : 'مفيش عندك حساب؟ اعمل حساب جديد'}</button>
  `;
  document.getElementById("toggleModeBtn").addEventListener("click", () => {
    mode = mode === "signup" ? "login" : "signup";
    clearError();
    renderAuthForm();
  });
  document.getElementById("authBtn").addEventListener("click", async () => {
    clearError();
    const email = document.getElementById("emailInput").value.trim();
    const password = document.getElementById("passwordInput").value;
    if (!email || password.length < 6) { showError("اكتب بريد إلكتروني صحيح وكلمة مرور 6 أحرف على الأقل."); return; }
    const btn = document.getElementById("authBtn");
    btn.disabled = true; btn.textContent = "جاري التحقق...";
    try {
      if (mode === "signup") {
        await auth.createUserWithEmailAndPassword(email, password);
      } else {
        await auth.signInWithEmailAndPassword(email, password);
      }
      renderRedeemForm();
    } catch (err) {
      const map = {
        "auth/email-already-in-use": "البريد ده مستخدم بالفعل. سجّل دخولك بدل إنشاء حساب.",
        "auth/wrong-password": "كلمة المرور غير صحيحة.",
        "auth/user-not-found": "مفيش حساب بالبريد ده. اعمل حساب جديد.",
        "auth/invalid-email": "البريد الإلكتروني غير صحيح.",
      };
      showError(map[err.code] || "تعذر تسجيل الدخول. حاول تاني.");
      btn.disabled = false; btn.textContent = mode === "signup" ? "إنشاء حساب" : "تسجيل الدخول";
    }
  });
}

function renderRedeemForm() {
  document.getElementById("pageSub").textContent = "اكتب كود الوصول المطبوع على الكارت";
  document.getElementById("content").innerHTML = `
    <div class="card">
      <label>كود الوصول</label>
      <input type="text" id="codeInput" class="code-input" placeholder="XXXX-XXXX-XXXX" maxlength="14">
      <button id="redeemBtn">تفعيل الكود</button>
    </div>
    <a href="my-content.html" class="page-link">${icon("book")} عرض المحتوى اللي عندي بالفعل</a>
    <button class="link-btn" id="signOutBtn">${icon("log-out")} تسجيل خروج</button>
  `;
  const codeInput = document.getElementById("codeInput");
  codeInput.addEventListener("input", () => {
    let v = codeInput.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 12);
    v = v.replace(/(.{4})(?=.)/g, "$1-");
    codeInput.value = v;
  });
  document.getElementById("signOutBtn").addEventListener("click", async () => {
    await auth.signOut();
    mode = "login";
    renderAuthForm();
  });
  document.getElementById("redeemBtn").addEventListener("click", async () => {
    clearError();
    const code = codeInput.value.trim();
    if (!code) { showError("اكتب الكود أولاً."); return; }
    const btn = document.getElementById("redeemBtn");
    btn.disabled = true; btn.textContent = "جاري التفعيل...";
    try {
      const idToken = await auth.currentUser.getIdToken();
      const res = await fetch(`${STUDENT_AUTH_WORKER_URL}/redeem-code`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${idToken}` },
        body: JSON.stringify({ code }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) throw new Error(data.error || "server_error");
      renderSuccess(data.product, data.expiresAt);
    } catch (err) {
      showError(ERROR_MESSAGES[err.message] || ERROR_MESSAGES.server_error);
      btn.disabled = false; btn.textContent = "تفعيل الكود";
    }
  });
}

function renderSuccess(product, expiresAt) {
  const itemsHtml = (product.items || []).map(it => `<div class="item-line">${icon(it.type === 'exam' ? 'clipboard' : 'book')}<span>${it.type === 'exam' ? 'امتحان' : 'محتوى'}: ${escapeHtml(it.title || it.id)}</span></div>`).join("");
  const expiryHtml = expiresAt
    ? `<div class="status-chip">${icon("calendar")} الوصول متاح لحد ${new Date(expiresAt).toLocaleDateString('ar-EG')}</div>`
    : `<div class="status-chip ok">${icon("infinity")} وصول دائم</div>`;
  document.getElementById("content").innerHTML = `
    <div class="card" id="successBox">
      ${icon("check-circle")}
      <div class="success-title">تم التفعيل بنجاح</div>
      <p class="success-product">${escapeHtml(product.title)}</p>
      ${itemsHtml}
      ${expiryHtml}
    </div>
    <a href="my-content.html" class="btn-primary">${icon("book")} فتح محتواي</a>
  `;
}

auth.onAuthStateChanged(user => {
  if (user) renderRedeemForm();
  else renderAuthForm();
});
</script>
</body>
</html>
